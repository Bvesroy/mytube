  const CAT_FALLBACK = { id: "other", name: "Uncategorised" };
  const CAT_KNOWN = new Set([...CATS.map(c => c.id), CAT_FALLBACK.id]);
  let catList = null;
  let catOfCh = null;
  let autoCatOfCh = null; // the classifier's bucket, before your manual overrides
  const catCounts = new Map();

  const tokenSet = text => {
    const w = String(text).toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
    const s = new Set(w);
    for (let i = 1; i < w.length; i++) s.add(w[i - 1] + " " + w[i]);
    return s;
  };

  function buildCategories() {
    if (catList) return;
    const N = CH.length;
    const titleSets = [], nameSets = [], descSets = [], lens = [];
    for (let i = 0; i < N; i++) {
      const titles = byChannel[i].slice(0, 30).map(v => v.title).join(" \n ");
      titleSets.push(tokenSet(titles));
      nameSets.push(tokenSet(CH[i].name));
      descSets.push(tokenSet(CH[i].desc || ""));
      lens.push(titles.length / 6 + (CH[i].desc || "").length / 6 + CH[i].name.length * 3);
    }
    const df = new Map();
    for (const c of CATS) for (const t of Object.keys(c.terms)) df.set(t, 0);
    for (let i = 0; i < N; i++) {
      for (const t of df.keys()) {
        if (titleSets[i].has(t) || nameSets[i].has(t) || descSets[i].has(t)) df.set(t, df.get(t) + 1);
      }
    }
    catList = CATS.map(c => {
      let norm = 0;
      const terms = [];
      for (const [term, w] of Object.entries(c.terms)) {
        const d = df.get(term) || 0;
        if (!d || d > N * 0.35) continue; // nowhere or everywhere: no signal
        const eff = w * Math.log((N + 1) / (d + 1));
        if (eff < 0.6) continue;
        terms.push([term, eff]);
        norm += eff * eff;
      }
      return { id: c.id, name: c.name, terms, norm: Math.sqrt(norm) || 1 };
    });
    catOfCh = new Array(N);
    autoCatOfCh = new Array(N);
    for (const c of catList) catCounts.set(c.id, 0);
    for (let i = 0; i < N; i++) {
      let best = null, bestScore = 0;
      for (const c of catList) {
        let s = 0;
        for (const [term, w] of c.terms) {
          if (titleSets[i].has(term)) s += w * 2.2;
          else if (nameSets[i].has(term)) s += w * 3;
          else if (descSets[i].has(term)) s += w;
        }
        if (s <= 0) continue;
        const n = (s / c.norm) / Math.pow(Math.max(1, lens[i]) / 500, 0.25);
        if (n > bestScore) { bestScore = n; best = c; }
      }
      autoCatOfCh[i] = bestScore >= 0.33 && best ? best.id : CAT_FALLBACK.id;
      const ov = catOv[CH[i].id]; // a manual move beats the classifier's guess
      catOfCh[i] = ov && CAT_KNOWN.has(ov) ? ov : autoCatOfCh[i];
      catCounts.set(catOfCh[i], (catCounts.get(catOfCh[i]) || 0) + 1);
    }
  }

  const catDef = id => (id === CAT_FALLBACK.id ? CAT_FALLBACK : (catList || []).find(c => c.id === id) || CAT_FALLBACK);
  const catIdOf = c => (catOfCh ? catOfCh[c.i] : CAT_FALLBACK.id);
  const catName = c => catDef(catIdOf(c)).name;
  const catOff = c => hiddenCat.has(catIdOf(c));

  // Re-assign every channel from the classifier's bucket plus your manual overrides, and
  // rebuild the per-bucket channel counts. Cheap enough (1.4k rows) to run on each move.
  function rebucket() {
    catCounts.clear();
    for (let i = 0; i < CH.length; i++) {
      const ov = catOv[CH[i].id];
      catOfCh[i] = ov && CAT_KNOWN.has(ov) ? ov : (autoCatOfCh ? autoCatOfCh[i] : CAT_FALLBACK.id);
      catCounts.set(catOfCh[i], (catCounts.get(catOfCh[i]) || 0) + 1);
    }
  }

  function setCatOverride(c, target) {
    buildCategories();
    const prev = catOv[c.id];
    if (target) catOv[c.id] = target; else delete catOv[c.id];
    saveCatOv();
    rebucket();
    invalidateWatched();
    renderSide();
    route();
    const name = target ? catDef(target).name : catDef(autoCatOfCh[c.i]).name;
    toast(`Moved ${c.name} to ${name}.`, "Undo", () => {
      if (prev) catOv[c.id] = prev; else delete catOv[c.id];
      saveCatOv(); rebucket(); invalidateWatched(); renderSide(); route();
    });
  }

  // Per-bucket video totals and how many of them are still unwatched (not in history),
  // over the channels you can see. Hidden videos are left out entirely.
  function catVideoStats(chs) {
    const w = watchedSet();
    const m = new Map();
    for (const c of chs) for (const v of byChannel[c.i]) {
      if (hiddenVid.has(v.id)) continue;
      const id = catOfCh[c.i];
      let e = m.get(id); if (!e) { e = { total: 0, unread: 0 }; m.set(id, e); }
      e.total++; if (!w.has(v.id)) e.unread++;
    }
    return m;
  }

  // Categories live in the bar across the top; channels keep the sidebar.
  function renderCategories() {
    buildCategories();
    const host = $("#catBar");
    if (!host) return;
    const stats = catVideoStats(CH.filter(c => !hiddenCh.has(c.id)));
    const rows = catList.filter(c => catCounts.get(c.id))
      .sort((a, b) => catCounts.get(b.id) - catCounts.get(a.id));
    if (catCounts.get(CAT_FALLBACK.id)) rows.push(CAT_FALLBACK);
    const route = routeFromHash();
    host.innerHTML = rows.map(c => {
      const off = hiddenCat.has(c.id);
      const n = catCounts.get(c.id) || 0;
      const st = stats.get(c.id);
      const unseen = st && st.unread > 0 && st.unread < st.total ? ` <i class="unread">${fmtNum(st.unread)} new</i>` : "";
      return `<div class="cchip${off ? " off" : ""}${route === "t/" + c.id ? " on" : ""}" data-href="#/t/${c.id}" data-route="t/${c.id}">
        <span>${esc(c.name)}</span><b>${fmtNum(n)}</b>${unseen}
        <button class="eye" data-hidecat="${c.id}" title="${off ? "Show" : "Hide"} ${esc(c.name)}" aria-label="${off ? "Show" : "Hide"} category ${esc(c.name)}">${off ? eyeOff : eyeOpen}</button></div>`;
    }).join("");
  }

  function toggleCategory(id, silent) {

    else toast(`Hid ${def.name} — ${fmtNum(catCounts.get(id) || 0)} channels out of All videos, search and recommendations.`, "Undo", () => {
      hiddenCat.delete(id); saveHidden(); renderSide(); route();

  // Shared by the star buttons and the 1-5 keyboard shortcut on channel pages.
  function setRating(c, n) {
    const prev = ratings[c.id];
    if (prev === n) delete ratings[c.id]; else ratings[c.id] = n;

    main.querySelectorAll("#stars button").forEach(x => x.classList.toggle("lit", +x.dataset.rate <= (ratings[c.id] || 0)));

      const rowEl = $(`#chList .item[data-route="c/${c.i}"]`);
      if (!rowEl) return;

        if (!badge) { const el = document.createElement("span"); el.className = "ratebadge"; rowEl.insertBefore(el, rowEl.querySelector(".eye")); el.textContent = "★" + ratings[c.id]; }
        else badge.textContent = "★" + ratings[c.id];
      } else if (badge) badge.remove();
    };
    refreshBadge();
    toast(ratings[c.id] ? `Rated ${c.name} ${ratings[c.id]} stars.` : `Rating cleared for ${c.name}.`, "Undo", () => {
      if (prev) ratings[c.id] = prev; else delete ratings[c.id];
      saveRatings();
      main.querySelectorAll("#stars button").forEach(x => x.classList.toggle("lit", +x.dataset.rate <= (ratings[c.id] || 0)));
      refreshBadge();
    });
    return ratings[c.id] || 0;
  }

  function viewCat(id) {
    buildCategories();
    const def = catDef(id);
    const hidden = hiddenCat.has(id);
    const chs = CH.filter(c => catOfCh[c.i] === id);
    const shown = chs.filter(c => !hiddenCh.has(c.id));
    const total = shown.reduce((n, c) => n + byChannel[c.i].length, 0);
    const st = catVideoStats(shown).get(id);
    const unread = st ? st.unread : 0;
    main.innerHTML = `<div class="chhead">
      <div style="min-width:0">

        <div class="sub">${fmtNum(shown.length)} channel${shown.length === 1 ? "" : "s"} · ${fmtNum(total)} videos${unread && unread < total ? ` · ${fmtNum(unread)} unwatched` : ""}${hidden ? " · hidden from your feeds" : ""}</div>
        <div class="blurb">Grouped from each channel's name, description and recent video titles — a keyword classifier with idf weighting, not a hand-kept list.</div>
        <div class="actions">
          <button class="pill${hidden ? " primary" : ""}" data-hidecat="${id}">${hidden ? "Show category" : "Hide category"}</button>
          <button class="pill" id="markCat">${seenAll.cats.has(id) ? "Clear watched mark" : "Mark all watched"}</button>
        </div>
      </div></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    $("#markCat", main).onclick = () => toggleSeenCat(id);
    const items = interleave(shown.map(c => byChannel[c.i].filter(v => !hiddenVid.has(v.id))));
    let pos = 0;
    const grid = infiniteGrid(feed, n => items.slice(pos, pos += n), {
      empty: "No channels landed in this category.",
      watched: watchedSet(),

  // 1,478 channels: render a slice, let the filter box reach the rest.
  function renderChannelList(term) {
    const q = term.trim().toLowerCase();
    const hits = q ? CH.filter(c => c.name.toLowerCase().includes(q)) : CH.slice().sort((a, b) => b.n - a.n);

    let h = shown.map(row).join("");

    else if (hits.length > shown.length) h += `<div class="sideempty">${fmtNum(hits.length - shown.length)} more — type to narrow</div>`;

  function renderSide() {
    $("#side").innerHTML = `<a class="item" href="#/" data-route="home">
      <svg class="nav" viewBox="0 0 24 24"><path d="M4 21V10.08l8-6.96 8 6.96V21h-6v-6h-4v6H4z"/></svg>

  /* ---------- home ---------- */
  let cleanup = () => {};
  const sorts = [["foryou", "For you"], ["latest", "Latest"], ["popular", "Popular"], ["shuffled", "Shuffled"]];

  // Round-robin across channels keeps big channels from burying the small ones.
  function interleave(lists) {
    const out = [];
    const max = Math.max(0, ...lists.map(l => l.length));
    for (let i = 0; i < max; i++) for (const l of lists) if (i < l.length) out.push(l[i]);
    return out;
  }

  function viewHome() {
    let chFilter = null;
    let sort = history.length ? "foryou" : "latest";
    const recent = history.slice(-10).reverse().map(h => byId.get(h.id)).filter(v => v && !vOff(v));
    main.innerHTML = `
      <div class="chips" id="chChips">
        <button class="chip on" data-c="all">All channels</button>
        ${CH.slice().sort((a, b) => b.n - a.n).slice(0, 15).map(c => `<button class="chip${chOff(c) ? " off" : ""}" data-c="${c.i}"${chOff(c) ? ' title="Hidden"' : ""}>${avatar(c)}${esc(c.name)}</button>`).join("")}
      </div>
      <div class="chips" id="sortChips">
        ${sorts.map(([k, label]) => `<button class="chip${k === sort ? " on" : ""}" data-s="${k}">${label}</button>`).join("")}
      </div>
      ${recent.length ? `<h2 class="shelfhead">Continue watching</h2><div class="shelf">${recent.map(v => mini(v, whyFor(v.id))).join("")}</div>` : ""}
      <div id="shelves"></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    const shelfHost = $("#shelves", main);
    let grid = null;

    const drawShelves = () => {
      shelfHost.replaceChildren();
      _why.clear();   // reasons belong to this render only
      if (sort !== "foryou" || chFilter != null || !history.length) return;
      const list = homeShelves(chFilter);
      if (!list.length) return;
      shelfHost.innerHTML = list.map(s => `<section class="shelfwrap" data-shelf="${esc(s.id)}">
        <h2 class="shelfhead">${esc(s.title)}<span class="shelfnote">${esc(s.note)}</span></h2>
        <div class="shelf">${s.items.map(v => mini(v, whyFor(v.id))).join("")}</div>
      </section>`).join("");
      for (const s of list) shelfImpression(s.id);
    };

    const list = () => {
      const chs = (chFilter == null ? CH : [CH[chFilter]]).filter(c => !chOff(c));
      if (sort === "foryou") return forYou(chs);
      const pool = chs.flatMap(c => byChannel[c.i]).filter(v => !vOff(v));
      if (sort === "popular") return pool.sort((a, b) => (b.views || 0) - (a.views || 0));
      if (sort === "shuffled") return shuffle(pool);
      return interleave(chs.map(c => byChannel[c.i])).filter(v => !vOff(v)); // each channel is newest-first
    };
    const rebuild = () => {
      grid && grid.stop();
      feed.replaceChildren();
      if (sort === "foryou") {
        const note = document.createElement("div");
        note.className = "feednote";
        if (history.length) {
          const p = profile();
          const learned = ranker ? `learned ranker (${fmtNum(ranker.pairs)} pairs)` : "hand-tuned weights";
          note.innerHTML = `Ranked from ${fmtNum(p.watched.size)} watched videos · topic vectors + channel graph + ${learned} · <button id="tuneRec">Tune</button> · <button id="resetRec">Reset</button>`;
          note.querySelector("#tuneRec").onclick = openReco;
          note.querySelector("#resetRec").onclick = () => {
            history = [];
            store.set("history", history);
            negIds.clear();
            saveNeg();
            invalidateReco();
            toast("Recommendations reset.");
            rebuild();
            drawShelves();
          };
        } else {
          note.textContent = "Watch a few videos and this feed starts ranking by the topics and channels you actually watch.";
        }
        feed.append(note);
      }
      const items = list();
      let pos = 0;
      grid = infiniteGrid(feed, n => items.slice(pos, pos += n), { empty: "Nothing to show — every channel in this view is hidden." });
    };
    main.querySelectorAll("#chChips .chip").forEach(b => b.onclick = () => {
      chFilter = b.dataset.c === "all" ? null : +b.dataset.c;
      main.querySelectorAll("#chChips .chip").forEach(x => x.classList.toggle("on", x === b));
      drawShelves();
      rebuild();
    });
    main.querySelectorAll("#sortChips .chip").forEach(b => b.onclick = () => {

  /* ---------- search ---------- */
  function viewSearch(q) {
    $("#q").value = q;
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const score = v => {
      const title = v.title.toLowerCase();
      const channel = CH[v.ch].name.toLowerCase();
      const inTitle = terms.every(t => title.includes(t));
      const hits = terms.filter(t => title.includes(t)).length;
      return (inTitle ? 4 : 0) + hits + (terms.every(t => channel.includes(t)) ? 2 : 0);
    };
    const hits = V
      .filter(v => !vOff(v) && (() => { const hay = v.title.toLowerCase() + " " + CH[v.ch].name.toLowerCase(); return terms.every(t => hay.includes(t)); })())
      .sort((a, b) => score(b) - score(a) || (b.views || 0) - (a.views || 0));
    main.innerHTML = `<h2 class="pagetitle">${fmtNum(hits.length)} result${hits.length === 1 ? "" : "s"} for “${esc(q)}”</h2><div class="feed"></div>`;
    let pos = 0;
    const grid = infiniteGrid($(".feed", main), n => hits.slice(pos, pos += n), { empty: "No videos matched that search." });
    document.title = q + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid.stop();
  }

  /* ---------- watch ---------- */
  let ytReady = null;
  let player = null;
  let upNext = [];
  let autoplay = (() => { try { return localStorage.getItem("jeetube-autoplay") !== "0"; } catch { return true; } })();
  if (typeof window.onYouTubeIframeAPIReady === "undefined") window.onYouTubeIframeAPIReady = null;

  function loadYT() {
    if (!ytReady) {
      ytReady = new Promise(resolve => {
        window.onYouTubeIframeAPIReady = resolve;
        const s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";

      });

  function playNext() {
    const v = upNext[0];
    if (v) location.hash = `#/watch/${v.id}`;
  }

  function viewWatch(id) {
    const v = byId.get(id);
    if (!v) { main.innerHTML = `<div class="empty">Video not found.</div>`; return; }
    const c = CH[v.ch];
    const playbackMode = Backend.modeSync();
    remember(v);
    upNext = similarTo(v, 15);
    const prof = profile();
    const whyUp = new Map();
    for (const x of upNext) if (x.ix != null) whyUp.set(x.id, explain(x.ix, prof));

    const ytUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`;
    const isExternal = playbackMode === 'external_youtube';
    const truthNote = isExternal
      ? `<div class="desc" style="margin-top:10px;border-left:3px solid var(--accent,#2563eb);padding-left:10px"><strong>External playback:</strong> Opens in your browser/YouTube profile. My Tube records that you opened it here (initiation only). It <strong>cannot</strong> confirm or sync your YouTube account watch history.</div>`
      : `<div class="desc" style="margin-top:10px;border-left:3px solid var(--border,#ddd);padding-left:10px">Embedded playback uses the YouTube player. My Tube records its own watch history when the backend is available; YouTube account history is managed separately by YouTube.</div>`;

    main.innerHTML = `<div class="watch">
      <div class="primary">
        ${isExternal
          ? `<div class="player" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center"><div style="font-size:18px;font-weight:600">Open on YouTube</div><div style="color:var(--muted,#666);max-width:560px">This video will open in your browser so YouTube can use your account/profile there. My Tube will record the open action, but not confirmed YouTube watch history.</div><button class="pill primary" id="openYtBtn">Open on YouTube ↗</button></div>`
          : `<div class="player"><div id="ytplayer"></div></div>`}
        <h1>${esc(v.title)}</h1>
        <div class="chrow">${avatar(c, "lg")}
          <div style="min-width:0">
            <a class="nm" href="#/c/${c.i}">${esc(c.name)}</a>
            <div class="cnt">${c.subs ? fmtNum(c.subs) + " subscribers" : fmtNum(c.n) + " videos"}</div>
          </div>
          <div class="actions">
            <button class="pill primary" id="nextBtn" title="Next video (Shift+N)">Next video ⏭</button>
            <a class="pill" href="${ytUrl}" target="_blank" rel="noopener" id="ytDirectLink">YouTube ↗</a>
            <button class="pill" data-course="${c.i}" data-video="${v.id}">＋ Course</button>
            <button class="pill" data-hidevid="${v.id}">Hide</button>
            <button class="pill${negIds.has(v.id) ? " primary" : ""}" data-notint="${v.id}">${negIds.has(v.id) ? "Not interested ✓" : "Not interested"}</button>
          </div>
        </div>
        <div class="desc">
          <div class="stats">${[fmtViews(v.views), v.dur ? fmtDur(v.dur) : ""].filter(Boolean).join(" · ") || "—"}</div>
          <div class="tagline">${esc(c.name)}${c.desc ? " · " + esc(c.desc) : ""}</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <label style="display:inline-flex;gap:8px;align-items:center"><span>Playback mode</span>
            <select id="playbackModeSel">
              <option value="embedded"${!isExternal ? ' selected' : ''}>Embedded (track in My Tube)</option>
              <option value="external_youtube"${isExternal ? ' selected' : ''}>Open on YouTube (initiation only)</option>
            </select>
          </label>
        </div>
        ${truthNote}
      </div>
      <aside class="secondary">
        <h3>Up next</h3>
        <label class="autoplay"><input type="checkbox" id="autoplayBox" ${autoplay ? "checked" : ""}> Autoplay next video</label>
        ${upNext.map(x => mini(x, whyUp.get(x.id) || "")).join("")}
      </aside>
    </div>`;

    $("#nextBtn").onclick = playNext;
    $("#autoplayBox").onchange = e => {
      autoplay = e.target.checked;
      try { localStorage.setItem("jeetube-autoplay", autoplay ? "1" : "0"); } catch {}
    };
    const modeSel = $("#playbackModeSel");
    if (modeSel) modeSel.onchange = async e => {
      const m = e.target.value;
      store.set('playback-mode', m);
      await Backend.setPlaybackMode(m);
      viewWatch(id);
    };
    document.title = v.title + " - My Tube";
    window.scrollTo(0, 0);

    let ended = false;
    let progressTimer = null;
    const sessionId = Backend.sid();
    Backend.sessions.set(id, { id: sessionId, source: isExternal ? 'external_youtube' : 'embedded', lastPos: 0, lastSent: Date.now() });

    async function startBackendSession(source) {
      // Best-effort: requires backend + known video in library. Failure preserves local behavior.
      const r = await Backend.historyStart(id, source, sessionId, 0);
      if (r && r.session_id) { Backend.sessions.get(id).id = r.session_id; }
    }

    if (isExternal) {
      const openBtn = $("#openYtBtn");
      const openExternal = async () => {
        await startBackendSession('external_youtube'); // initiation recorded; NOT confirmed YouTube history
        window.open(ytUrl, '_blank', 'noopener');
        toast('Opened on YouTube. My Tube recorded initiation only (no confirmed YouTube sync).');
      };
      if (openBtn) openBtn.onclick = openExternal;
      // clicking the direct link also records initiation
      const direct = $("#ytDirectLink");
      if (direct) direct.addEventListener('click', () => { startBackendSession('external_youtube'); });
      cleanup = () => {
        try { /* no player */ } catch {}
        Backend.sessions.delete(id);
      };
      return;
    }

    // Embedded mode
    startBackendSession('embedded');
    loadYT().then(() => {
      if (location.hash !== `#/watch/${id}`) return;
      player = new YT.Player("ytplayer", {
        videoId: id,
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onStateChange: e => {
            if (e.data === YT.PlayerState.PLAYING) {
              if (!progressTimer) progressTimer = setInterval(() => {
                try {
                  if (!player || !player.getCurrentTime) return;
                  const secs = player.getCurrentTime() || 0;
                  const st = Backend.sessions.get(id);
                  if (st && st.id) Backend.historyProgress(st.id, { position_s: secs, watched_delta_s: 5 });
                } catch {}
              }, 5000);
            }
            if (e.data === YT.PlayerState.ENDED) {
              ended = true;
              rememberEngagement(id, 0, true);
              if (autoplay) playNext();
            }
          },
        },
      });
    });
    cleanup = () => {
      let secs = 0;
      try { if (player && player.getCurrentTime) secs = player.getCurrentTime() || 0; } catch {}
      if (progressTimer) try { clearInterval(progressTimer); } catch {}
      rememberEngagement(id, secs, ended);
      try { player && player.destroy(); } catch {}
      player = null;
      Backend.sessions.delete(id);
    };
  }

  /* ---------- backup: export / import ----------
     Everything that makes the app yours lives in a handful of mytube-* keys. Export
     serialises them to one JSON file; import validates the shape, replaces the current
     state, and keeps an Undo of whatever was there before. */
  const STATE_KEYS = ["hidden-ch", "hidden-vid", "hidden-cat", "cat-ov", "ratings", "courses", "history", "seen", "neg"];
  const emptyFor = k => (k === "cat-ov" || k === "ratings" || k === "seen") ? {} : [];
  const snapshotState = () => {
    const s = {};
    for (const k of STATE_KEYS) s[k] = store.get(k, emptyFor(k));
    return s;
  };
  function exportState() {
    const payload = { mytube: 1, exportedAt: new Date().toISOString(), state: snapshotState() };
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "mytube-backup.json";
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded your backup — hidden items, category moves, star ratings, courses and history.");
  }
  function applyState(state) {
    const prev = snapshotState();
    hiddenCh.clear(); for (const id of state["hidden-ch"]) hiddenCh.add(id);
    hiddenVid.clear(); for (const id of state["hidden-vid"]) hiddenVid.add(id);
    hiddenCat.clear(); for (const id of state["hidden-cat"]) hiddenCat.add(id);
    Object.keys(catOv).forEach(k => delete catOv[k]); Object.assign(catOv, state["cat-ov"]);
    ratings = { ...state["ratings"] };
    courses = state["courses"];
    history = state["history"];
    seenAll = { cats: new Set(state["seen"].cats), chs: new Set(state["seen"].chs) };
    negIds = new Set(Array.isArray(state["neg"]) ? state["neg"] : []);
    saveHidden(); saveCatOv(); saveRatings(); saveCourses(); saveSeen(); saveNeg();
    store.set("history", history);
    rebucket();
    invalidateWatched();
    renderSide();
    route();
    return prev;
  }
  function importState(file) {
    file.text().then(text => {
      let payload;
      try { payload = JSON.parse(text); } catch { toast("That file isn't valid JSON — nothing changed."); return; }
      if (!payload || payload.mytube !== 1 || !payload.state || typeof payload.state !== "object") {
        toast("That doesn't look like a My Tube backup — nothing changed."); return;
      }
      const s = payload.state;
      const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
      const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
      const seenRaw = obj(s["seen"]);
      const clean = {
        "hidden-ch": strArr(s["hidden-ch"]),
        "hidden-vid": strArr(s["hidden-vid"]),
        "hidden-cat": strArr(s["hidden-cat"]),
        "cat-ov": Object.fromEntries(Object.entries(obj(s["cat-ov"])).filter(([, v]) => typeof v === "string")),
        "ratings": Object.fromEntries(Object.entries(obj(s["ratings"])).filter(([, v]) => Number.isInteger(v) && v >= 1 && v <= 5)),
        "courses": (Array.isArray(s["courses"]) ? s["courses"] : [])
          .filter(c => c && typeof c.name === "string" && Array.isArray(c.videos))
          .map(c => ({ ...c, id: typeof c.id === "string" ? c.id : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), videos: c.videos.filter(x => typeof x === "string") })),
        "history": (Array.isArray(s["history"]) ? s["history"] : [])
          .filter(h => h && typeof h.id === "string")
          .map(h => ({ id: h.id, ch: Number.isInteger(h.ch) ? h.ch : 0, t: typeof h.t === "number" ? h.t : 0 })),
        "seen": { cats: strArr(seenRaw.cats), chs: strArr(seenRaw.chs) },
        "neg": strArr(s["neg"]),
      };
      const prev = applyState(clean);
      const parts = [];
      if (clean["hidden-ch"].length) parts.push(`${clean["hidden-ch"].length} hidden channels`);
      if (clean["hidden-vid"].length) parts.push(`${clean["hidden-vid"].length} hidden videos`);
      if (clean["hidden-cat"].length) parts.push(`${clean["hidden-cat"].length} hidden categories`);
      if (Object.keys(clean["cat-ov"]).length) parts.push(`${Object.keys(clean["cat-ov"]).length} category moves`);
      if (Object.keys(clean["ratings"]).length) parts.push(`${Object.keys(clean["ratings"]).length} ratings`);
      if (clean["courses"].length) parts.push(`${clean["courses"].length} courses`);
      if (clean["history"].length) parts.push(`${clean["history"].length} history entries`);
      if (clean["seen"].cats.length || clean["seen"].chs.length) parts.push("watched marks");
      if (clean["neg"].length) parts.push(`${clean["neg"].length} not-interested marks`);
      toast(`Imported ${parts.join(", ") || "an empty backup"}.`, "Undo", () => applyState(prev));
    }).catch(() => toast("Couldn't read that file — nothing changed."));
  }

  /* ---------- about ---------- */
  function viewAbout() {

      <h2>How it works</h2>

        <li><b>For you</b> is a hybrid two-stage recommender. Candidates come from four generators —

          topic vectors built by random projection of TF-IDF, a channel topic graph, and session
          transitions — then a linear ranker scores them on ten features, and MMR re-ranking spreads
          the result across channels. Nothing leaves this browser: the profile is built from your local

        <li><b>Feed filters</b> in the sidebar hide Shorts (under a minute) or show only unwatched

        <li><b>Continue watching</b> pins your most recently watched videos at the top of the home feed.</li>
        <li><b>Backup</b> — Export JSON downloads your hidden items, category moves, ratings, courses

      </ul>

      <h2>Keyboard</h2>
      <ul>
        <li><kbd>Shift</kbd> + <kbd>N</kbd> — play a random video (or the next one while watching)</li>

      <h2>Recs Lab</h2>
      <p>A temporal hold-out test of the recommender, run in this page. It trains on all but the

        <code>Takeout 2/YouTube and YouTube Music/subscriptions/subscriptions.csv</code> — all
        ${fmtNum(CH.length)} channels — and each channel's uploads are listed with
        <a class="link" href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a>
        into one file, <code>site/videos.json</code>.${cap}</p>
      <pre>python3 build.py                 # cached build
python3 build.py --refresh       # re-download every listing
python3 build.py --per-channel 0 # every upload, not just the latest 50</pre>
      <h2>Your data</h2>
      <p>Hidden channels, hidden videos, courses, category moves, star ratings and your watch history are stored only in this browser
        (<code>localStorage</code>) and are never uploaded anywhere.
        <button class="pill" id="tuneReco">Tune ranking</button>
        <button class="pill" id="exportState" style="margin-left:8px">Export JSON</button>
        <button class="pill" id="importStateBtn" style="margin-left:8px">Import</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="pill" id="resetAll" style="margin-left:8px">Reset everything</button></p>
      <p class="muted">Export downloads a JSON backup of your hidden items, category moves, ratings, courses,
        watch history and watched-marks; Import replaces your current state with a backup file (an Undo toast restores the old one).</p>
      <p class="muted">Video titles, durations and view counts are a snapshot from the last build.
        View counts and the videos themselves live on YouTube.</p>
    </div>`;
    const tune = $("#tuneReco", main);
    if (tune) tune.onclick = openReco;
    const lab = $("#runLab", main);
    if (lab) lab.onclick = () => {
      const out = $("#labOut", main);
      lab.disabled = true;
      lab.textContent = "Running…";
      out.innerHTML = `<div class="muted">Training on the earlier watches, replaying the last ${12}…</div>`;
      setTimeout(() => {
        const r = evaluateEngine(12);
        lab.disabled = false;
        lab.textContent = "Run evaluation";
        if (!r.ok) { out.innerHTML = `<div class="empty">${esc(r.msg)}</div>`; return; }
        const pc = x => (x * 100).toFixed(1) + "%";
        const dec = x => x.toFixed(3);
        const delta = (b, h, fmt) => {
          const d = h - b;
          const good = d > 0.0005, bad = d < -0.0005;
          return `<td class="${good ? "up" : bad ? "down" : ""}">${d > 0 ? "+" : ""}${fmt(Math.abs(d))}</td>`;
        };
        const line = (label, b, h, fmt) => `<tr><td>${label}</td><td>${fmt(b)}</td><td>${fmt(h)}</td>${delta(b, h, fmt)}</tr>`;
        out.innerHTML = `<table class="metrics">
          <thead><tr><th>Metric</th><th>BM25 baseline</th><th>Hybrid</th><th>Δ</th></tr></thead>
          <tbody>
            ${line("Candidate pool recall", r.base.candRecall, r.hybrid.candRecall, pc)}
            ${line("Recall@10", r.base.recall, r.hybrid.recall, pc)}
            ${line("NDCG@10", r.base.ndcg, r.hybrid.ndcg, dec)}
            ${line("MRR", r.base.mrr, r.hybrid.mrr, dec)}
            ${line("Channel coverage", r.base.coverage, r.hybrid.coverage, pc)}
            ${line("Intra-list diversity", r.base.ild, r.hybrid.ild, dec)}
          </tbody>
        </table>
        <p class="muted">${fmtNum(r.trained)} watches trained, ${fmtNum(r.tested)} replayed from the hold-out.
          Read the numbers as a sanity check on one user, not a benchmark.</p>`;
      }, 30);
    };
    const reset = $("#resetAll", main);
    if (reset) reset.onclick = () => {
      hiddenCh.clear(); hiddenVid.clear(); history = []; courses = [];
      Object.keys(catOv).forEach(k => delete catOv[k]); saveCatOv();
      ratings = {}; saveRatings();
      seenAll.cats.clear(); seenAll.chs.clear(); saveSeen();
      filters = { shorts: false, unwatched: false }; saveFilters();
      reco = Object.assign({}, RECO_DEFAULTS); saveReco();
      negIds.clear(); saveNeg();
      bandit = {}; saveBandit();
      resetRanker();
      saveHidden(); store.set("history", history); saveCourses();
      rebucket();
      invalidateWatched();
      renderSide(); route();
      toast("Hidden channels, watch history, courses, category moves, ratings, watched marks and filters cleared.");
    };
    const exp = $("#exportState", main);
    if (exp) exp.onclick = exportState;
    const imp = $("#importStateBtn", main);
    const impFile = $("#importFile", main);
    if (imp) imp.onclick = () => impFile.click();
    if (impFile) impFile.onchange = e => { if (e.target.files && e.target.files[0]) importState(e.target.files[0]); e.target.value = ""; };
    document.title = "About - My Tube";
    window.scrollTo(0, 0);
  }

  /* ---------- ranking controls ---------- */
  let rerankTimer = 0;
  function scheduleRerank() {
    clearTimeout(rerankTimer);
    rerankTimer = setTimeout(() => {
      const onForYou = (($("#sortChips .chip.on") || {}).textContent || "") === "For you";
      if (location.hash.startsWith("#/watch/")) route();
      else if ((location.hash === "" || location.hash === "#/") && onForYou) route();
    }, 140);
  }

  function renderRecoBody() {
    const body = $("#recoBody");
    if (!body) return;
    const row = (id, label, val, min, max, step, hint) => `<div class="tunerow">
      <label for="${id}">${label} <b id="${id}Val">${val}</b></label>
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${parseFloat(val)}">
      <div class="hint">${hint}</div></div>`;
    const learned = ranker
      ? `Trained on ${fmtNum(ranker.pairs)} pairs · log-loss ${ranker.loss} · ${new Date(ranker.at).toLocaleDateString()}`
      : "Not trained yet — the feed uses the hand-tuned weights below. Training takes about 30 ms and stays in this browser.";
    body.innerHTML =
      row("tAff", "Channel affinity", reco.affinity + "%", 0, 200, 10,
        "How much a channel you keep watching is boosted above the topic score. 0% ignores channels and ranks purely by topic; 60% lets a favourite channel score up to 1.6×, 200% up to 3×.")
      + row("tHalf", "History half-life", reco.halfLife + " days", 7, 365, 1,
        "A watch this many days old counts half as much as a fresh one. Long means slow, stable taste; short means the feed mostly follows what you watched this week.")
      + row("tWatched", "Already-watched weight", reco.watched + "%", 0, 100, 5,
        "Already-watched videos keep this share of their score, so they sink down the feed but stay available. At 0% they drop to the bottom.")
      + row("tSer", "Serendipity", reco.serendipity + "%", 0, 100, 10,
        "How far the feed reaches outside your comfort zone. At 0% it stays strictly on-topic and a channel may appear three times in a row; at 100% it enforces one video per channel and boosts channels you have never watched.")
      + `<div class="presets">${[["Balanced", 60, 90, 30, 30], ["Topic first", 0, 120, 30, 25],
        ["Channel first", 160, 180, 60, 15], ["This week only", 60, 14, 30, 45]]
        .map(([n, a, h, w, s]) => `<button class="pill" data-preset="${a},${h},${w},${s}">${n}</button>`).join("")}</div>`
      + `<div class="tunerow"><label>Learned ranker <b>${ranker ? "on" : "off"}</b></label>
          <div class="hint">${learned}</div>
          <div class="presets">
            <button class="pill" id="trainRank">${ranker ? "Retrain on my history" : "Train on my history"}</button>
            ${ranker ? `<button class="pill" id="clearRank">Forget model</button>` : ""}
          </div>
          ${ranker ? `<div class="weights">${FEATURES.map((f, i) => `<span class="wchip">${f} <b>${ranker.w[i].toFixed(2)}</b></span>`).join("")}</div>` : ""}
        </div>`;
    const bind = (id, key, suffix) => {
      const el = $("#" + id, body);
      el.oninput = e => {
        reco[key] = +e.target.value;
        $("#" + id + "Val", body).textContent = e.target.value + suffix;
        saveReco();
        scheduleRerank();
      };
    };
    bind("tAff", "affinity", "%");
    bind("tHalf", "halfLife", " days");
    bind("tWatched", "watched", "%");
    bind("tSer", "serendipity", "%");
    body.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
      const [affinity, halfLife, watched, serendipity] = b.dataset.preset.split(",").map(Number);
      reco = { affinity, halfLife, watched, serendipity };
      saveReco();
      renderRecoBody();
      scheduleRerank();
    });
    const train = $("#trainRank", body);
    if (train) train.onclick = () => {
      train.disabled = true;
      train.textContent = "Training…";
      setTimeout(() => {
        const r = trainRanker();
        if (r.ok) {
          toast(`Ranker trained on ${fmtNum(r.pairs)} pairs — your feed now uses learned weights.`);
          renderRecoBody();
          scheduleRerank();
        } else {
          toast(r.msg);
          renderRecoBody();
        }
      }, 20);
    };
    const clear = $("#clearRank", body);
    if (clear) clear.onclick = () => {
      resetRanker();
      renderRecoBody();
      scheduleRerank();
      toast("Learned weights forgotten — back to the hand-tuned model.");
    };
  }

  function openReco() {
    renderRecoBody();
    $("#recoModal").hidden = false;
  }
  function closeReco() { $("#recoModal").hidden = true; }

  /* ---------- courses ---------- */
  let picker = null;

  const newCourseId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const courseVideos = course => course.videos.map(id => byId.get(id)).filter(Boolean);
  function courseStats(course) {
    const vids = courseVideos(course);
    const watched = watchedSet();
    const done = vids.filter(v => watched.has(v.id)).length;
    const hours = vids.reduce((s, v) => s + (v.dur || 0), 0) / 3600;
    return { vids, done, hours, pct: vids.length ? Math.round((done / vids.length) * 100) : 0 };
  }

  function renderCourses() {
    const host = $("#courseList");
    if (!host) return;
    host.innerHTML = courses.length
      ? courses.map(c => {
          const { vids, done, pct } = courseStats(c);
          return `<a class="item course" href="#/course/${c.id}" data-route="course/${c.id}">
            <svg class="nav" viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H5V3zm2 5h7v2H7V8zm0 4h10v2H7v-2zm0 4h7v2H7v-2z"/></svg>
            <span class="name">${esc(c.name)}<span class="csub">${fmtNum(vids.length)} videos · ${pct}% watched</span></span>
            <span class="cnt">${done}/${vids.length}</span></a>`;
        }).join("")
      : `<div class="sideempty">No courses yet. Hit <b>+</b> to build one from any channel.</div>`;
    markSide(routeFromHash());
  }

  function renderPickList() {
    const list = $("#cmList");
    if (!list || !picker) return;
    const term = (picker.term || "").trim().toLowerCase();
    const base = picker.channel === "" ? V : byChannel[+picker.channel] || [];
    const pool = term
      ? base.filter(v => v.title.toLowerCase().includes(term) || CH[v.ch].name.toLowerCase().includes(term))
      : base;
    const shown = pool.slice(0, 60);
    list.innerHTML = shown.length
      ? shown.map(v => `<label class="pickrow">
          <input type="checkbox" data-pick="${v.id}" ${picker.selected.has(v.id) ? "checked" : ""}>
          <img src="${thumbURL(v.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <span class="t">${esc(v.title)}</span>
          <span class="c">${esc(CH[v.ch].name)}</span>
        </label>`).join("")
        + (pool.length > shown.length ? `<div class="sideempty">${fmtNum(pool.length - shown.length)} more — type to narrow</div>` : "")
      : `<div class="sideempty" style="padding:14px 2px">No videos match.</div>`;
    updatePickCount();
  }

  function updatePickCount() {
    const n = picker ? picker.selected.size : 0;
    const el = $("#cmCount");
    if (el) el.textContent = `${fmtNum(n)} selected`;
  }

  function openCourseModal(course, opts = {}) {
    picker = {
      course: course || null,
      selected: new Set(course ? course.videos : []),
      channel: opts.channel != null ? String(opts.channel) : "",
      term: "",
    };
    if (opts.video) picker.selected.add(opts.video);
    $("#cmTitle").textContent = course ? "Edit course" : "New course";
    $("#cmSave").textContent = course ? "Save changes" : "Create course";
    $("#cmBody").innerHTML = `
      <input id="cmName" type="text" maxlength="80" autocomplete="off" placeholder="Course name — e.g. Linear algebra from scratch" value="${course ? esc(course.name) : ""}">
      <div class="pickerrow">
        <input id="cmSearch" type="search" autocomplete="off" placeholder="Search videos to add">
        <select id="cmChannel" aria-label="Filter videos by channel">
          <option value="">All channels</option>
          ${CH.slice().sort((a, b) => b.n - a.n).map(c => `<option value="${c.i}">${esc(c.name)}</option>`).join("")}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="pill" type="button" id="cmAll">Select all shown</button>
        <button class="pill" type="button" id="cmNone">Clear</button>
      </div>
      <div class="picklist" id="cmList"></div>`;
    $("#cmChannel").value = picker.channel;
    $("#courseModal").hidden = false;
    $("#cmSearch").oninput = e => { picker.term = e.target.value; renderPickList(); };
    $("#cmChannel").onchange = e => { picker.channel = e.target.value; renderPickList(); };
    $("#cmList").onchange = e => {
      const box = e.target.closest("[data-pick]");
      if (!box) return;
      if (box.checked) picker.selected.add(box.dataset.pick);
      else picker.selected.delete(box.dataset.pick);
      updatePickCount();
    };
    $("#cmAll").onclick = () => {
      document.querySelectorAll("#cmList [data-pick]").forEach(b => { b.checked = true; picker.selected.add(b.dataset.pick); });
      updatePickCount();
    };
    $("#cmNone").onclick = () => {
      picker.selected.clear();
      document.querySelectorAll("#cmList [data-pick]").forEach(b => { b.checked = false; });
      updatePickCount();
    };
    renderPickList();
  }

  function closeCourseModal() {
    $("#courseModal").hidden = true;
    picker = null;
  }

  function saveCourseFromModal() {
    if (!picker) return;
    const name = $("#cmName").value.trim();
    if (!name) { $("#cmName").focus(); toast("Give the course a name first."); return; }
    const videos = [...picker.selected];
    let target = picker.course;
    const created = !target;
    if (target) { target.name = name; target.videos = videos; }
    else { target = { id: newCourseId(), name, videos, created: Date.now() }; courses.push(target); }
    saveCourses();
    closeCourseModal();
    renderCourses();
    if (created) location.hash = `#/course/${target.id}`;
    else if (location.hash === `#/course/${target.id}`) route();
    toast(`“${target.name}” ${created ? "created" : "saved"} — ${fmtNum(videos.length)} video${videos.length === 1 ? "" : "s"}.`);
  }

  function viewCourse(id) {
    const course = courses.find(c => c.id === id);
    if (!course) {
      main.innerHTML = `<div class="empty">Course not found. <a class="link" href="#/">Back to All videos</a></div>`;
      document.title = "Course - My Tube";
      return;
    }
    const { vids, done, hours, pct } = courseStats(course);
    const time = hours >= 1 ? `${Math.round(hours)} hours` : `${Math.round(hours * 60)} minutes`;
    main.innerHTML = `<div class="chhead">
      <div style="min-width:0">
        <h1>${esc(course.name)}</h1>
        <div class="sub">${fmtNum(vids.length)} videos · ${time} · ${done} watched (${pct}%)</div>
        <div class="coursebar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Course progress"><div style="width:${pct}%"></div></div>
        <div class="actions">
          <button class="pill primary" id="addVids">＋ Add videos</button>
          <button class="pill" id="editCourse">Edit course</button>
          <button class="pill" id="deleteCourse">Delete</button>
        </div>
      </div></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    let grid = null;
    const build = () => {
      grid && grid.stop();
      feed.replaceChildren();
      let pos = 0;
      grid = infiniteGrid(feed, n => vids.slice(pos, pos += n), {
        empty: "No videos in this course yet — use “Add videos” to pull them from any channel.",
        watched: watchedSet(),
      });
    };
    $("#addVids").onclick = () => openCourseModal(course);
    $("#editCourse").onclick = () => openCourseModal(course);
    $("#deleteCourse").onclick = () => {
      if (!confirm(`Delete “${course.name}”?`)) return;
      const backup = courses;
      courses = courses.filter(c => c.id !== course.id);
      saveCourses();
      location.hash = "#/";
      renderCourses();
      toast("Course deleted.", "Undo", () => { courses = backup; saveCourses(); renderCourses(); });
    };
    build();
    document.title = course.name + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid && grid.stop();
  }

  /* ---------- router ---------- */
  function route() {
    cleanup(); cleanup = () => {};
    const h = location.hash.replace(/^#\/?/, "");
    const m = {};
    if (!h.startsWith("search/")) $("#q").value = "";
    $("#aboutBtn").classList.toggle("active", h === "about");
    if ((m.watch = h.match(/^watch\/([\w-]{11})$/))) { markSide(""); viewWatch(m.watch[1]); }
    else if ((m.ch = h.match(/^c\/(\d+)$/))) { markSide(`c/${m.ch[1]}`); viewChannel(+m.ch[1]); }
    else if ((m.search = h.match(/^search\/(.*)$/))) { markSide(""); viewSearch(decodeURIComponent(m.search[1])); }
    else if ((m.cat = h.match(/^t\/([\w-]+)$/))) { markSide(`t/${m.cat[1]}`); viewCat(m.cat[1]); }
    else if ((m.course = h.match(/^course\/([\w-]+)$/))) { markSide(`course/${m.course[1]}`); viewCourse(m.course[1]); }
    else if (h === "about") { markSide("about"); viewAbout(); }
    else { markSide("home"); viewHome(); }
    renderCategories(); // refresh the chip badges after history changes
  }

  /* ---------- boot ---------- */
  function boot() {
    if (!data || !Array.isArray(data.videos) || !data.videos.length) {
      main.innerHTML = `<div class="empty">No video data yet. Run <code>python3 build.py</code> to generate <code>site/data.js</code>.</div>`;
      return;
    }
    CH = data.channels.map((c, i) => ({ ...c, i }));
    byChannel = CH.map(() => []);
    V = data.videos.map(([id, title, dur, views, ch], ix) => ({ id, title, dur, views, ch, ix }));
    for (const v of V) { (byChannel[v.ch] || (byChannel[v.ch] = [])).push(v); byId.set(v.id, v); }
    $("#q").placeholder = `Search ${fmtNum(V.length)} videos`;
    renderSide();
    window.addEventListener("hashchange", route);
    route();
  }
  boot();

  /* ---------- chrome ---------- */
  $("#searchForm").onsubmit = e => {
    e.preventDefault();
    const q = $("#q").value.trim();
    location.hash = q ? `#/search/${encodeURIComponent(q)}` : "#/";
  };
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const isLight = root.dataset.theme ? root.dataset.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = isLight ? "dark" : "light";
    try { localStorage.setItem("jeetube-theme", root.dataset.theme); } catch {}
  };
  $("#luckyBtn").onclick = () => {
    if (!V.length) return;
    location.hash = `#/watch/${V[Math.random() * V.length | 0].id}`;
  };
  $("#cmSave").onclick = saveCourseFromModal;
  $("#cmCancel").onclick = closeCourseModal;
  $("#courseModal").addEventListener("click", e => { if (e.target.id === "courseModal") closeCourseModal(); });
  $("#recoDone").onclick = closeReco;
  $("#recoDefaults").onclick = () => {
    reco = Object.assign({}, RECO_DEFAULTS);
    saveReco(); renderRecoBody(); scheduleRerank();
    toast("Ranking back to its defaults.");
  };
  $("#recoModal").addEventListener("click", e => { if (e.target.id === "recoModal") closeReco(); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (picker) closeCourseModal();
    else if (!$("#recoModal").hidden) closeReco();
  });
  // Channel links inside cards (anchors can't nest, so these are spans). The hide and
  // course controls are handled first so they never navigate.
  document.addEventListener("click", e => {
    const notint = e.target.closest("[data-notint]");
    if (notint) {
      e.preventDefault(); e.stopPropagation();
      const v = byId.get(notint.dataset.notint);
      if (v) {
        markNotInterested(v);
        const wrap = notint.closest(".cardwrap");
        if (wrap) wrap.remove(); else route();
      }
      return;
    }
    const hideV = e.target.closest("[data-hidevid]");
    if (hideV) {
      e.preventDefault(); e.stopPropagation();
      const v = byId.get(hideV.dataset.hidevid);
      if (v) hideVideo(v, hideV);
      return;
    }
    const hideCat = e.target.closest("[data-hidecat]");
    if (hideCat) {
      e.preventDefault(); e.stopPropagation();
      toggleCategory(hideCat.dataset.hidecat);
      return;
    }
    const hideC = e.target.closest("[data-hidech]");
    if (hideC) {
      e.preventDefault(); e.stopPropagation();
      toggleChannel(+hideC.dataset.hidech);
      return;
    }
    const add = e.target.closest("[data-course]");
    if (add) {
      e.preventDefault(); e.stopPropagation();
      openCourseModal(null, { channel: +add.dataset.course, video: add.dataset.video });
      return;
    }
    const t = e.target.closest("[data-href]");
    if (t) { e.preventDefault(); e.stopPropagation(); location.hash = t.dataset.href; return; }
    // Click feedback for the shelf bandit: which row earned the click?
    const shelf = e.target.closest("[data-shelf]");
    if (shelf && e.target.closest("a[data-vid]")) shelfClick(shelf.dataset.shelf);
  }, true);

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) return;
    const cm = location.hash.match(/^#\/c\/(\d+)$/);
    if (cm && /^[1-5]$/.test(e.key)) { const c = CH[+cm[1]]; if (c) setRating(c, +e.key); return; }
    if (e.key === "N" && e.shiftKey) {
      e.preventDefault();
      if (location.hash.startsWith("#/watch/")) playNext();
      else if (V.length) location.hash = `#/watch/${V[Math.random() * V.length | 0].id}`;
    }
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  });
  window.addEventListener("scroll", () => {
    $("#hdr").classList.toggle("scrolled", window.scrollY > 2);
  }, { passive: true });
})();
</script>
</body>
</html>
