<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tube</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='1' y='4' width='22' height='16' rx='5' fill='%23ff4242'/><path d='M10 8.5v7l6-3.5z' fill='white'/></svg>">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try { const t = localStorage.getItem("jeetube-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #0f0f0f; --bg1: #181818; --bg2: #212121; --bg3: #303030;
  --fg: #f1f1f1; --fg2: #aaaaaa; --line: #2b2b2b;
  --brand: #ff4242; --radius: 12px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg1: #f2f2f2; --bg2: #e9e9e9; --bg3: #dcdcdc;
  --fg: #0f0f0f; --fg2: #606060; --line: #e2e2e2;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --bg1: #f2f2f2; --bg2: #e9e9e9; --bg3: #dcdcdc;
    --fg: #0f0f0f; --fg2: #606060; --line: #e2e2e2;
    color-scheme: light;
  }
  :root:not([data-theme="dark"]) .icon-moon { display: none; }
  :root:not([data-theme="dark"]) .icon-sun { display: block; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
img { display: block; }

/* ---------- Header ---------- */
header {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  height: 56px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid transparent;
}
header.scrolled { border-bottom-color: var(--line); }
.logo { display: flex; align-items: center; gap: 8px; flex: none; padding: 4px 8px 4px 0; }
.logo svg { width: 32px; height: 23px; }
.logo span { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
.search { flex: 1; display: flex; justify-content: center; min-width: 0; }
.search .box {
  display: flex; align-items: center; width: min(600px, 100%);
  border: 1px solid var(--bg3); border-radius: 20px; overflow: hidden; background: var(--bg);
}
.search input {
  flex: 1; min-width: 0; height: 38px; padding: 0 16px; border: 0; background: transparent; outline: none;
}
.search input::placeholder { color: var(--fg2); }
.search button {
  flex: none; width: 56px; height: 38px; display: grid; place-items: center;
  background: var(--bg1); border-left: 1px solid var(--bg3);
}
.search button:hover { background: var(--bg2); }
.search svg { width: 20px; height: 20px; fill: var(--fg); }
.hdr-right { display: flex; align-items: center; gap: 2px; flex: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
}
.icon-btn:hover { background: var(--bg2); }
.icon-btn svg { width: 22px; height: 22px; fill: var(--fg); }
.icon-sun { display: none; }

/* ---------- Layout ---------- */
.catbar {
  position: sticky; top: 56px; z-index: 40; display: flex; align-items: center; gap: 8px;
  height: 47px; padding: 0 24px; overflow-x: auto; background: var(--bg);
  border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.catbar::-webkit-scrollbar { display: none; }
.cchip {
  display: inline-flex; align-items: center; gap: 7px; flex: none; height: 32px;
  padding: 0 12px; border-radius: 16px; background: var(--bg2); color: var(--fg);
  font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.cchip:hover { background: var(--bg3); }
.cchip.on { background: var(--fg); color: var(--bg); }
.cchip b { font-weight: 400; font-size: 12px; opacity: 0.7; }
.cchip.off { opacity: 0.45; }
.cchip.off > span:first-child { text-decoration: line-through; }
.cchip .eye { opacity: 0; flex: none; width: 18px; height: 18px; padding: 1px; border-radius: 50%; color: inherit; }
.cchip:hover .eye, .cchip.on .eye, .cchip.off .eye { opacity: 0.85; }
.cchip .eye:hover { background: rgba(127, 127, 127, 0.35); }
.cchip .unread { font-style: normal; font-size: 11px; opacity: 0.65; }
.stars { display: inline-flex; align-items: center; gap: 1px; padding: 2px 6px; }
.stars button { font-size: 17px; line-height: 1; color: var(--fg2); padding: 2px; border-radius: 6px; }
.stars button.lit { color: #f6c945; }
.stars button:hover { color: #f6c945; }
.ratebadge { color: #f6c945; font-size: 11.5px; flex: none; }
.catpick {
  height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--bg3);
  background: var(--bg2); font-size: 13.5px; font-weight: 600; max-width: 260px; outline: none;
}
.catpick:focus { border-color: var(--fg2); }
.shelfhead { margin: 16px 0 10px; font-size: 16px; }
.shelf { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: thin; }
.shelf .mini { flex: 0 0 168px; flex-direction: column; gap: 6px; margin-bottom: 0; }
.shelf .mini .thumb { width: 100%; }
.sidechips { flex-wrap: wrap; overflow: visible; padding: 4px 0 12px; }
.layout { display: flex; align-items: flex-start; gap: 0; }
.side {
  position: sticky; top: 103px; align-self: flex-start; flex: none;
  width: 240px; height: calc(100vh - 103px); overflow-y: auto; padding: 8px 12px 32px;
  scrollbar-width: thin;
}
@media (max-width: 640px) {
  .catbar { padding: 0 8px; gap: 6px; }
}
.side h4 {
  margin: 16px 0 6px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--fg2);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.side hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.chfilter {
  width: 100%; height: 34px; margin: 4px 0 8px; padding: 0 12px; border-radius: 17px;
  border: 1px solid var(--bg3); background: var(--bg1); outline: none; font-size: 13px;
}
.chfilter:focus { border-color: var(--fg2); }
.sideempty { color: var(--fg2); font-size: 12px; padding: 8px 10px; line-height: 1.4; }
.item {
  display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px;
  font-size: 14px; min-height: 40px;
}
.item:hover { background: var(--bg2); }
.item.active { background: var(--bg1); font-weight: 600; }
.item.active:hover { background: var(--bg2); }
.item svg.nav { width: 20px; height: 20px; fill: currentColor; flex: none; }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .cnt { margin-left: auto; color: var(--fg2); font-size: 12px; flex: none; }
main { flex: 1; min-width: 0; padding: 0 24px 64px; }

/* ---------- Avatars ---------- */
.av {
  position: relative; flex: none; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; background: var(--bg3); color: var(--fg);
  width: 32px; height: 32px; font-size: 13px; font-weight: 700; text-transform: uppercase;
}
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.xl { width: 100px; height: 100px; font-size: 40px; }
.av.lg { width: 40px; height: 40px; font-size: 16px; }

/* ---------- Chips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--bg2);
  font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.12s;
}
.chip:hover { background: var(--bg3); }
.chip.on { background: var(--fg); color: var(--bg); }
.chip .av { width: 20px; height: 20px; font-size: 9px; }

/* ---------- Video grid ---------- */
.grid {
  display: grid; gap: 28px 16px; padding-top: 14px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.card { display: block; }
.card .thumb {
  position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
  background: var(--bg1);
}
.card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s ease; }
.card:hover .thumb img { transform: scale(1.03); }
.card .dur {
  position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 5px;
  background: rgba(0, 0, 0, 0.82); color: #fff; font-size: 12px; font-weight: 600;
  letter-spacing: 0.2px;
}
.card .meta { display: flex; gap: 12px; margin-top: 10px; }
.card .t {
  font-size: 14px; font-weight: 600; line-height: 20px; letter-spacing: -0.1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .sub { color: var(--fg2); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; }
.card .sub .chnl { cursor: pointer; }
.card .sub .chnl:hover { color: var(--fg); text-decoration: underline; }
.sentinel { height: 1px; }

/* ---------- Hide controls / courses / modal ---------- */
.cardwrap { position: relative; }
.cardwrap .hidebtn {
  position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0, 0, 0, 0.78); color: #fff;
  font-size: 13px; line-height: 1; opacity: 0; transition: opacity 0.12s;
}
.cardwrap:hover .hidebtn, .cardwrap .hidebtn:focus-visible { opacity: 1; }
.cardwrap .tick {
  position: absolute; left: 6px; bottom: 6px; padding: 1px 6px; border-radius: 5px;
  background: rgba(0, 0, 0, 0.82); color: #6ee7a8; font-size: 11px; font-weight: 700;
}
.feednote { color: var(--fg2); font-size: 12.5px; padding: 10px 2px 0; }
.feednote button { color: var(--brand); font-weight: 700; }
.item[data-href] { cursor: pointer; }
.item .eye { margin-left: 2px; flex: none; color: var(--fg2); padding: 4px; border-radius: 50%; opacity: 0; }
.item:hover .eye, .item .eye:focus-visible { opacity: 1; }
.item.off { opacity: 0.45; }
.item.off .name { text-decoration: line-through; }
.item.off .eye { opacity: 1; }
.item.course .name { white-space: normal; display: flex; flex-direction: column; line-height: 1.3; }
.item .csub { font-size: 11px; color: var(--fg2); font-weight: 400; }
h4 .addbtn {
  margin-left: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg2);
  color: var(--fg); font-size: 14px; line-height: 1; vertical-align: middle;
}
h4 .addbtn:hover { background: var(--bg3); }
.linkbtn { color: var(--brand); font-weight: 700; }
.coursebar { height: 6px; max-width: 420px; margin-top: 12px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
.coursebar > div { height: 100%; background: var(--brand); transition: width 0.2s; }
.tunerow { margin: 16px 0; }
.tunerow label { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; font-weight: 600; }
.tunerow label b { color: var(--brand); font-variant-numeric: tabular-nums; flex: none; }
.tunerow input[type="range"] { width: 100%; margin: 9px 0 5px; accent-color: var(--brand); }
.tunerow .hint { color: var(--fg2); font-size: 12px; line-height: 1.45; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(0, 0, 0, 0.62); }
.modal[hidden] { display: none; }
.modal .panel {
  width: min(680px, 100%); max-height: min(84vh, 760px); display: flex; flex-direction: column;
  background: var(--bg1); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.modal h2 { margin: 0; padding: 18px 20px 10px; font-size: 17px; }
.modal .body { padding: 0 20px 8px; overflow-y: auto; }
.modal .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal .foot .muted { margin-left: auto; color: var(--fg2); font-size: 12.5px; }
.modal input[type="text"], .modal input[type="search"], .modal select {
  height: 38px; padding: 0 12px; border: 1px solid var(--bg3); border-radius: 10px;
  background: var(--bg); color: var(--fg); outline: none; font-size: 13.5px;
}
.modal input[type="text"], .modal input[type="search"] { width: 100%; }
.modal .pickerrow { display: flex; gap: 8px; margin: 10px 0; }
.modal .pickerrow select { flex: none; max-width: 210px; }
.modal .picklist { border-top: 1px solid var(--line); }
.pickrow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.pickrow img { width: 64px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; }
.pickrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow .c { color: var(--fg2); font-size: 11.5px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toast {
  position: fixed; left: 20px; bottom: 20px; z-index: 80; max-width: min(520px, 90vw);
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px;
  background: var(--bg2); color: var(--fg); font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  opacity: 0; transform: translateY(10px); pointer-events: none; transition: 0.18s;
}
#toast.show { opacity: 1; transform: none; pointer-events: auto; }
#toast button { color: var(--brand); font-weight: 700; flex: none; }

/* ---------- Watch ---------- */
.watch { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding-top: 20px; }
.watch .player { aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); overflow: hidden; }
.watch .player iframe, .watch .player > div { width: 100%; height: 100%; border: 0; display: block; }
.watch h1 { font-size: 20px; line-height: 27px; font-weight: 700; margin: 14px 0 0; letter-spacing: -0.2px; }
.chrow { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.chrow .nm { font-weight: 600; font-size: 15px; }
.chrow .nm:hover { text-decoration: underline; }
.chrow .cnt { color: var(--fg2); font-size: 12px; margin-top: 1px; }
.chrow .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  height: 36px; padding: 0 16px; border-radius: 18px; background: var(--bg2);
  font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.pill:hover { background: var(--bg3); }
.pill.primary { background: var(--fg); color: var(--bg); }
.pill.primary:hover { opacity: 0.9; }
.pill input { accent-color: var(--brand); margin: 0; }
.desc { background: var(--bg1); border-radius: var(--radius); padding: 12px 14px; margin-top: 14px; font-size: 13.5px; }
.desc .stats { font-weight: 600; }
.desc .body { margin-top: 6px; color: var(--fg); white-space: pre-wrap; }
.desc .tagline { color: var(--fg2); margin-top: 2px; }
.secondary h3 { margin: 2px 0 10px; font-size: 15px; }
.secondary .autoplay {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--fg2); font-size: 13px;
}
.mini { display: flex; gap: 10px; margin-bottom: 10px; border-radius: 10px; }
.mini:hover .t { color: var(--fg); }
.mini .thumb {
  position: relative; width: 168px; flex: none; aspect-ratio: 16 / 9; border-radius: 8px;
  overflow: hidden; background: var(--bg1);
}
.mini .thumb img { width: 100%; height: 100%; object-fit: cover; }
.mini .thumb .dur { position: absolute; right: 4px; bottom: 4px; padding: 1px 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.82); color: #fff; font-size: 11px; font-weight: 600; }
.mini .t {
  font-size: 13.5px; font-weight: 600; line-height: 19px; color: var(--fg);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mini .sub { color: var(--fg2); font-size: 12px; margin-top: 4px; }

/* ---------- Channel / pages ---------- */
.chhead { display: flex; gap: 24px; align-items: center; padding: 24px 0 4px; }
.chhead h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
.chhead .sub { color: var(--fg2); margin-top: 4px; font-size: 13px; }
.chhead .blurb { color: var(--fg2); margin-top: 8px; max-width: 780px; font-size: 13.5px; }
.chhead .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.pagetitle { font-size: 20px; margin: 22px 0 0; letter-spacing: -0.2px; }
.pagetitle .muted { color: var(--fg2); font-weight: 400; }
.about { max-width: 820px; padding-top: 24px; }
.about h1 { font-size: 26px; margin: 0 0 12px; }
.about h2 { font-size: 17px; margin: 26px 0 8px; }
.about p, .about li { color: var(--fg); font-size: 14px; line-height: 1.65; }
.about .muted { color: var(--fg2); }
.about ul { padding-left: 20px; }
.about code, .about pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  background: var(--bg1); border-radius: 6px;
}
.about code { padding: 1px 5px; }
.about pre { padding: 12px; overflow-x: auto; }
.about a.link { color: #7cc4ff; text-decoration: underline; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.stat { background: var(--bg1); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.empty { padding: 60px 8px; color: var(--fg2); text-align: center; font-size: 14px; }
.empty code { background: var(--bg1); padding: 2px 6px; border-radius: 5px; }
kbd { background: var(--bg2); border-radius: 5px; padding: 1px 5px; font-size: 12px; font-family: inherit; }

@media (max-width: 1100px) {
  .watch { grid-template-columns: minmax(0, 1fr); }
  .secondary { max-width: 760px; }
}
@media (max-width: 900px) {
  .side { display: none; }
  main { padding: 0 16px 64px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 12px; }
  .chhead { gap: 14px; }
  .chhead .av.xl { width: 64px; height: 64px; font-size: 26px; }
  .chhead h1 { font-size: 21px; }
}
@media (max-width: 640px) {
  header { padding: 0 8px; gap: 4px; }
  .logo span { display: none; }
  .search button { width: 44px; }
  .mini .thumb { width: 140px; }
}
/* ---------- Recommender UI: shelves, reasons, channel graph, Recs Lab ---------- */
.shelfwrap { margin: 4px 0 6px; }
.shelfhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shelfnote { color: var(--fg2); font-size: 12px; font-weight: 500; letter-spacing: 0; }
.whyline { display: none; color: var(--fg2); font-size: 11.5px; line-height: 15px; margin-top: 4px; }
.whyline.show { display: block; }
.cardwrap:hover .whyline, .cardwrap:focus-within .whyline { display: block; }
.cardwrap .nibtn {
  position: absolute; top: 6px; left: 40px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0, 0, 0, 0.78); color: #fff;
  font-size: 14px; line-height: 1; opacity: 0; transition: opacity 0.12s;
}
.cardwrap:hover .nibtn, .cardwrap .nibtn:focus-visible { opacity: 1; }
.cardwrap .nibtn:hover { background: var(--brand); }
.chcard {
  flex: 0 0 168px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; padding: 12px 8px; border: 1px solid var(--line); border-radius: var(--radius);
}
.chcard:hover { background: var(--bg3); }
.chcard .av { width: 56px; height: 56px; font-size: 18px; }
.cc-name { font-size: 13px; font-weight: 600; line-height: 17px; }
.cc-sub { font-size: 11.5px; color: var(--fg2); }
.weights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.wchip {
  font-size: 11px; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 8px; font-variant-numeric: tabular-nums;
}
.wchip b { color: var(--fg); }
.labout { margin-top: 10px; }
table.metrics { border-collapse: collapse; width: 100%; max-width: 620px; font-size: 13px; }
table.metrics th, table.metrics td {
  text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
table.metrics th:first-child, table.metrics td:first-child { text-align: left; }
table.metrics thead th { color: var(--fg2); font-weight: 600; }
table.metrics td.up { color: #3fb950; font-weight: 700; }
table.metrics td.down { color: var(--brand); font-weight: 700; }

/* ---------- Intelligence workspace (My Tube 3.0) ---------- */
.intel { max-width: 1180px; padding: 22px 0 40px; }
.intelhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.intelhead h1 { margin: 0; font-size: 25px; letter-spacing: -0.5px; }
.intelhead p { margin: 6px 0 0; color: var(--fg2); max-width: 760px; font-size: 13.5px; line-height: 1.55; }
.intelactions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.intelcard { background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.intelcard h2, .intelcard h3 { margin: 0 0 10px; font-size: 16px; }
.intelcard h3 { font-size: 14px; }
.intelgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.intelrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.intelrow > input[type=text], .intelrow > input[type=search], .intelrow > input[type=number], .intelrow > select, .intelrow > textarea {
  min-height: 36px; padding: 7px 11px; border: 1px solid var(--bg3); border-radius: 9px;
  background: var(--bg); color: var(--fg); outline: none;
}
.intelrow > textarea { width: 100%; min-height: 74px; resize: vertical; }
.intelrow > input:focus, .intelrow > select:focus, .intelrow > textarea:focus { border-color: var(--fg2); }
.intelrow .grow { flex: 1; min-width: 180px; }
.intelmuted { color: var(--fg2); font-size: 12.5px; line-height: 1.55; }
.intelpane { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.intellist { display: flex; flex-direction: column; gap: 8px; }
.intelitem { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--bg); }
.intelitem .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--fg2); font-size: 11.5px; margin-top: 6px; }
.intelitem .meta a { color: #7cc4ff; text-decoration: underline; }
.intelbadge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; background: var(--bg2); color: var(--fg2); font-size: 11px; white-space: nowrap; }
.intelbadge.ok { color: #3fb950; }
.intelbadge.warn { color: #f6c945; }
.intelbadge.bad { color: var(--brand); }
.intelcite { border-left: 3px solid var(--brand); padding: 8px 10px; background: var(--bg1); border-radius: 0 8px 8px 0; margin: 8px 0; }
.intelcite q { display: block; margin-top: 5px; color: var(--fg2); font-size: 12.5px; }
.intelanswer { white-space: pre-wrap; line-height: 1.65; font-size: 14px; }
.kgwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
.kgcanvas { width: 100%; height: 520px; background: var(--bg1); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.kgcanvas svg { width: 100%; height: 100%; display: block; }
.kgnode { cursor: pointer; }
.kgnode text { font-size: 9px; fill: var(--fg); pointer-events: none; }
.kglegend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--fg2); font-size: 11.5px; padding-top: 8px; }
.kglegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 10px; }
.barcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 18px; height: 100%; }
.bar { width: 100%; max-width: 34px; min-height: 2px; background: var(--brand); border-radius: 4px 4px 0 0; opacity: 0.9; }
.barcol span { color: var(--fg2); font-size: 9.5px; writing-mode: vertical-rl; transform: rotate(180deg); max-height: 44px; }
.tlrow { display: grid; grid-template-columns: 74px 1fr 100px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.tlrow:last-child { border-bottom: 0; }
.tlbar { height: 9px; border-radius: 5px; background: var(--brand); opacity: 0.7; }
.fcface { min-height: 130px; display: grid; place-items: center; text-align: center; font-size: 19px; line-height: 1.5; padding: 20px; border: 1px dashed var(--bg3); border-radius: 10px; }
.fcback { color: var(--fg2); font-size: 14px; margin-top: 12px; }
.fcrate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.pathstage { border-left: 2px solid var(--bg3); padding: 2px 0 14px 14px; margin-left: 4px; }
.pathstage h3 { margin: 0 0 8px; }
.pathitem { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.pathitem:last-child { border-bottom: 0; }
.pathitem .grow { flex: 1; min-width: 0; }
.radarkind { text-transform: capitalize; }
.inteloffline { max-width: 720px; margin: 50px auto; text-align: center; }
.inteloffline h1 { font-size: 25px; }
.inteloffline code { background: var(--bg1); padding: 2px 6px; border-radius: 5px; }
.intelsplit { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; }
@media (max-width: 900px) {
  .kgwrap, .intelsplit { grid-template-columns: minmax(0, 1fr); }
  .kgcanvas { height: 380px; }
}
</style>
</head>
<body>
<header id="hdr">
  <a class="logo" href="#/" title="My Tube — home">
    <svg viewBox="0 0 30 22" aria-hidden="true"><rect width="30" height="22" rx="6" fill="#ff4242"/><path d="M12 6.5v9l8-4.5z" fill="#fff"/></svg>
    <span>My Tube</span>
  </a>
  <form class="search" id="searchForm" role="search">
    <div class="box">
      <input id="q" type="search" placeholder="Search videos" autocomplete="off" aria-label="Search videos">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59A7.46 7.46 0 0 0 17 10a7 7 0 1 0-7 7c1.75 0 3.35-.64 4.58-1.72l5.59 5.59.7-.7zM10 16a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg>
      </button>
    </div>
  </form>
  <div class="hdr-right">
    <button class="icon-btn" id="luckyBtn" title="Play a random video (Shift+N)" aria-label="Play a random video">
      <svg viewBox="0 0 24 24"><path d="M18.15 13.65 22 17.5l-3.85 3.85-.71-.71L20.09 18H19c-2.84 0-4.94-2.04-6.97-4.01l.71-.71C14.59 15.12 16.55 17 19 17h1.09l-2.65-2.65.71-.7zM18.15 2.65l-.71.71L20.09 6H19c-5.53 0-8.72 6.65-11.39 9.83C6.43 17.25 5.03 18 3 18v1c2.4 0 4.04-.9 5.38-2.5C11.2 13.15 14.08 7 19 7h1.09l-2.65 2.65.71.71L22 6.5l-3.85-3.85zM3 5v1c1.74 0 3.04.67 4.29 1.82l.7-.71C6.6 5.86 5.09 5 3 5z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Switch light / dark theme" aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 13.9A8 8 0 0 1 14.5 2.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1 3h-2l1-3zm0 20-1-3h2l-1 3zM2 12l3-1v2l-3-1zm20 0-3 1v-2l3 1zM4.9 4.9l2.8 1.4-1.4 1.4-1.4-2.8zm14.2 14.2-2.8-1.4 1.4-1.4 1.4 2.8zM4.9 19.1l1.4-2.8 1.4 1.4-2.8 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4 2.8-1.4z"/></svg>
    </button>
    <a class="icon-btn" id="aboutBtn" href="#/about" title="About this site" aria-label="About">?</a>
  </div>
</header>

<nav class="catbar" id="catBar" aria-label="Categories"></nav>

<div class="layout">
  <nav class="side" id="side" aria-label="Channels"></nav>
  <main id="main"><div class="empty">Loading videos…</div></main>
</div>

<div class="modal" id="courseModal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
    <h2 id="cmTitle">New course</h2>
    <div class="body" id="cmBody"></div>
    <div class="foot">
      <button class="pill primary" id="cmSave">Create course</button>
      <button class="pill" id="cmCancel">Cancel</button>
      <span class="muted" id="cmCount"></span>
    </div>
  </div>
</div>

<div class="modal" id="recoModal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="recoTitle" style="max-width:520px">
    <h2 id="recoTitle">Tune the ranking</h2>
    <div class="body" id="recoBody"></div>
    <div class="foot">
      <button class="pill primary" id="recoDone">Done</button>
      <button class="pill" id="recoDefaults">Defaults</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const data = window.JEE_DATA;
  const main = $("#main");

  /* ---------- saved state ---------- */
  const store = {
    get(key, fallback) {
      try { const raw = localStorage.getItem("mytube-" + key); return raw ? JSON.parse(raw) : fallback; }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem("mytube-" + key, JSON.stringify(value)); } catch {}
    },
  };
  const hiddenCh = new Set(store.get("hidden-ch", []));   // channel ids, not indices: survives rebuilds
  const hiddenVid = new Set(store.get("hidden-vid", [])); // video ids
  const hiddenCat = new Set(store.get("hidden-cat", [])); // category ids: hides every channel in them
  let history = store.get("history", []);                 // [{id, ch, t}], oldest first
  let courses = store.get("courses", []);                 // [{id, name, videos: [ids], created}]
  const saveHidden = () => {
    store.set("hidden-ch", [...hiddenCh]);
    store.set("hidden-vid", [...hiddenVid]);
    store.set("hidden-cat", [...hiddenCat]);
  };
  const saveCourses = () => store.set("courses", courses);
  const catOv = store.get("cat-ov", {});             // channel id -> category id: manual bucket overrides
  const saveCatOv = () => store.set("cat-ov", catOv);
  let ratings = store.get("ratings", {});            // channel id -> 1..5 stars
  const saveRatings = () => store.set("ratings", ratings);
  // 1 star halves a channel's scores, 5 stars boosts them 1.5x, 3 stars is neutral.
  const rateFactor = i => { const r = ratings[CH[i].id]; return r ? 1 + (r - 3) * 0.25 : 1; };

  // Ranking knobs, tuned from the UI. affinity is a % boost for channels you watch,
  // halfLife is how many days until an old watch counts half, watched is the share of
  // score an already-seen video keeps.
  const RECO_DEFAULTS = { affinity: 60, halfLife: 90, watched: 30, serendipity: 30 };
  let reco = Object.assign({}, RECO_DEFAULTS, store.get("reco", {}));
  const saveReco = () => store.set("reco", reco);
  // Feed filters: Hide Shorts (<60s) and/or only unwatched videos, across every feed.
  let filters = Object.assign({ shorts: false, unwatched: false }, store.get("filters", {}));

  const saveFilters = () => store.set("filters", filters);

  /* ---------- backend bridge (Phase 2/3): best-effort, preserves standalone mode ---------- */
  const Backend = (() => {
    let ok = null, prefs = null;
    const base = '/api/v1';
    async function ping() {
      if (ok !== null) return ok;
      try { const r = await fetch(base + '/health', { cache: 'no-store' }); ok = r.ok; } catch { ok = false; }
      return ok;
    }
    async function api(path, opts) {
      if (!(await ping())) return null;
      try {
        const r = await fetch(base + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
        if (!r.ok) return null;
        return await r.json().catch(() => ({}));
      } catch { return null; }
    }
    async function getPrefs() {
      if (prefs) return prefs;
      const d = await api('/user/preferences');
      prefs = (d && d.preferences) || { playback_mode: store.get('playback-mode', 'embedded') };
      return prefs;
    }
    async function setPlaybackMode(mode) {
      prefs = Object.assign({}, await getPrefs(), { playback_mode: mode });
      store.set('playback-mode', mode);
      await api('/user/preferences', { method: 'PUT', body: JSON.stringify({ playback_mode: mode }) });
      return prefs;
    }
    function modeSync() { return store.get('playback-mode', 'embedded'); }
    // Phase 2 history (truthful): external_youtube = initiation only, never confirmed YouTube history.
    async function historyStart(videoId, source, sessionId, positionS) {
      return api('/history/start', { method: 'POST', body: JSON.stringify({ video_id: videoId, playback_source: source, session_id: sessionId, position_s: positionS || 0 }) });
    }
    async function historyProgress(sessionId, data) {
      return api('/history/progress', { method: 'POST', body: JSON.stringify(Object.assign({ session_id: sessionId }, data || {})) });
    }
    async function historyComplete(sessionId, data) {
      return api('/history/complete', { method: 'POST', body: JSON.stringify(Object.assign({ session_id: sessionId }, data || {})) });
    }
    // per-watch session state
    const sessions = new Map(); // videoId -> {id, source, lastPos, lastSent}
    function sid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
    // Phase 5/6: job+sync adapter hooks (best-effort). Safe localStorage migration remains partial.
    async function enqueueSync(payload) { return api('/jobs/sync', { method: 'POST', body: JSON.stringify(payload || {}) }); }
    async function getJob(id) { return api('/jobs/' + encodeURIComponent(id)); }
    async function cancelJob(id) { return api('/jobs/' + encodeURIComponent(id) + '/cancel', { method: 'POST' }); }
    const bridge = { ping, api, getPrefs, setPlaybackMode, modeSync, historyStart, historyProgress, historyComplete, sessions, sid, enqueueSync, getJob, cancelJob };
    try { window.MyTubeBackend = bridge; } catch {}
    return bridge;
  })();

  // Categories/channels marked entirely watched, without flooding the 800-entry history
  // with one entry per video. Their videos count as watched until the mark is cleared.
  let seenAll = (() => {
    const raw = store.get("seen", { cats: [], chs: [] });
    const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
    return { cats: new Set(strArr(raw.cats)), chs: new Set(strArr(raw.chs)) };
  })();
  const saveSeen = () => store.set("seen", { cats: [...seenAll.cats], chs: [...seenAll.chs] });
  let _watchedCache = null;
  const invalidateWatched = () => { _watchedCache = null; };
  // Watched = in your history, or in a bucket you marked all-watched. Cached because it
  // runs inside video-filter loops; call invalidateWatched() after any change to either.
  const watchedSet = () => {
    if (!_watchedCache) {
      const s = new Set(history.map(h => h.id));
      if (seenAll.cats.size || seenAll.chs.size) {
        for (const v of V) {
          if (hiddenVid.has(v.id)) continue;
          const cat = catOfCh ? catOfCh[v.ch] : null;
          if (seenAll.chs.has(CH[v.ch].id) || (cat && seenAll.cats.has(cat))) s.add(v.id);
        }
      }
      _watchedCache = s;
    }
    return _watchedCache;
  };

  let CH = [];
  let V = [];
  let byChannel = [];
  let byId = new Map();
  const seen = new Set();

  /* ---------- formatting ---------- */
  function fmtDur(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
  }
  function fmtViews(n) {
    if (n == null) return "";
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "B views";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M views";
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, "") + "K views";
    return n + " view" + (n === 1 ? "" : "s");
  }
  function fmtNum(n) { return n == null ? "" : n.toLocaleString(); }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /* ---------- shared markup ---------- */
  const thumbURL = id => `https://i.ytimg.com/vi/${id}/hq720.jpg`;
  const thumbFallback = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  const initials = n => (n || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("") || "?";

  function avatar(c, cls = "") {
    const img = c.avatar ? `<img src="${esc(c.avatar)}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<span class="av ${cls}">${esc(initials(c.name))}${img}</span>`;
  }

  // Thumbnails fall back to the smaller still if hq720 is missing.
  const imgTag = id => `<img loading="lazy" src="${thumbURL(id)}" alt="" onerror="this.onerror=null;this.src='${thumbFallback(id)}'">`;

  function card(v, showChannel = true, opts = {}) {
    const c = CH[v.ch];
    const sub = showChannel
      ? `<span class="chnl" data-href="#/c/${c.i}">${esc(c.name)}</span>${v.views != null ? `<span>· ${fmtViews(v.views)}</span>` : ""}`
      : (v.views != null ? fmtViews(v.views) : "");
    const why = opts.why === false ? "" : whyFor(v.id);
    return `<div class="cardwrap">
      <a class="card" href="#/watch/${v.id}" data-vid="${v.id}">
        <div class="thumb">${imgTag(v.id)}${v.dur ? `<span class="dur">${fmtDur(v.dur)}</span>` : ""}${opts.watched ? `<span class="tick" title="Watched">✓ watched</span>` : ""}</div>
        <div class="meta">${showChannel ? avatar(c) : ""}<div style="min-width:0">
          <div class="t">${esc(v.title)}</div>
          <div class="sub">${sub}</div>
          ${why ? `<div class="whyline" title="Why this is here">✦ ${esc(why)}</div>` : ""}
        </div></div>
      </a>
      <button class="nibtn" data-notint="${v.id}" title="Not interested — sink this video" aria-label="Not interested">⊘</button>
      <button class="hidebtn" data-hidevid="${v.id}" title="Hide this video from your feeds" aria-label="Hide this video">✕</button>
    </div>`;
  }

  function mini(v, why = "") {
    const c = CH[v.ch];
    return `<a class="mini" href="#/watch/${v.id}" data-vid="${v.id}" title="${esc(why ? why : c.name)}">
      <div class="thumb">${imgTag(v.id)}${v.dur ? `<span class="dur">${fmtDur(v.dur)}</span>` : ""}</div>
      <div style="min-width:0">
        <div class="t">${esc(v.title)}</div>
        <div class="sub">${esc(c.name)}</div>
        <div class="sub">${fmtViews(v.views)}</div>
        ${why ? `<div class="whyline show">✦ ${esc(why)}</div>` : ""}
      </div>
    </a>`;
  }

  // A channel tile for the topic-graph rails ("channels like this one").
  function chCard(i, score) {
    const c = CH[i];
    return `<a class="chcard" href="#/c/${i}">${avatar(c, "lg")}
      <div class="cc-name">${esc(c.name)}</div>
      <div class="cc-sub">${fmtNum(c.n)} videos${score ? ` · ${Math.round(score * 100)}% topic match` : ""}</div>
    </a>`;
  }

  // Infinite-scrolling grid fed by more(n) -> next batch of videos.
  function infiniteGrid(host, more, opts = {}) {
    const grid = document.createElement("div");
    grid.className = "grid";
    const sentinel = document.createElement("div");
    sentinel.className = "sentinel";
    host.append(grid, sentinel);
    let done = false;
    const load = () => {
      if (done) return;
      const batch = more(24);
      if (!batch.length) {
        done = true;
        if (!grid.children.length) grid.outerHTML = `<div class="empty">${opts.empty || "Nothing here yet."}</div>`;
        return;
      }
      grid.insertAdjacentHTML("beforeend", batch.map(v => card(v, opts.showChannel !== false, { watched: opts.watched ? opts.watched.has(v.id) : false })).join(""));
    };
    load(); load();
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) load(); }, { rootMargin: "1000px" });
    io.observe(sentinel);
    return { stop: () => io.disconnect() };
  }

  /* ---------- sidebar ---------- */
  function routeFromHash() {
    const h = location.hash.replace(/^#\/?/, "");
    return /^c\/\d+$/.test(h) || /^t\/[\w-]+$/.test(h) || /^course\/[\w-]+$/.test(h) || h === "about" ? h : "home";
  }

  /* ---------- hiding ---------- */
  const chOff = c => hiddenCh.has(c.id) || catOff(c);
  const videoFiltered = v => (filters.shorts && (v.dur || 0) > 0 && v.dur < 60) || (filters.unwatched && watchedSet().has(v.id));
  const vOff = v => hiddenVid.has(v.id) || chOff(CH[v.ch]) || videoFiltered(v);
  const eyeOpen = `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 5C7 5 3 9.5 3 12s4 7 9 7 9-4.5 9-7-4-7-9-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>`;
  const eyeOff = `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M3 4.3 4.3 3 21 19.7 19.7 21l-3-3c-1.4.6-3 1-4.7 1-5 0-9-4.5-9-7 0-.9.5-2 1.4-3.1L3 4.3zM12 5c5 0 9 4.5 9 7 0 .8-.4 1.7-1 2.6l-3.2-3.2A4 4 0 0 0 10 6.2L8.5 4.7C9.6 4.9 10.8 5 12 5z"/></svg>`;

  function updateHiddenNote() {
    const note = $("#hiddenNote");
    if (!note) return;
    const nch = CH.filter(c => hiddenCh.has(c.id)).length, nv = hiddenVid.size, nc = hiddenCat.size;
    note.innerHTML = nch || nv || nc
      ? `Hidden: ${fmtNum(nch)} channel${nch === 1 ? "" : "s"} · ${fmtNum(nv)} video${nv === 1 ? "" : "s"} · ${fmtNum(nc)} categor${nc === 1 ? "y" : "ies"} · <button class="linkbtn" id="showAll">Show all</button>`
      : "";
    const all = $("#showAll", note);
    if (all) all.onclick = () => {
      hiddenCh.clear(); hiddenVid.clear(); hiddenCat.clear(); saveHidden();
      invalidateWatched();
      renderSide(); route();
      toast("Everything is visible again.");
    };
  }

  let toastTimer = 0;
  function toast(text, actionLabel, action) {
    const el = $("#toast");
    const span = document.createElement("span");
    span.textContent = text;
    el.replaceChildren(span);
    if (actionLabel) {
      const b = document.createElement("button");
      b.textContent = actionLabel;
      b.onclick = () => { el.classList.remove("show"); if (action) action(); };
      el.append(b);
    }
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 7000);
  }

  function hideVideo(v, fromEl) {
    hiddenVid.add(v.id);
    saveHidden();
    invalidateWatched();
    updateHiddenNote();
    const wrap = fromEl && fromEl.closest(".cardwrap");
    if (location.hash === `#/watch/${v.id}`) location.hash = "#/";
    else if (wrap) wrap.remove();
    else route();
    toast(`Hidden: “${v.title.slice(0, 68)}${v.title.length > 68 ? "…" : ""}”`, "Undo", () => {
      hiddenVid.delete(v.id); saveHidden(); invalidateWatched(); updateHiddenNote(); route();
    });
  }

  function toggleChannel(i) {
    const c = CH[i];
    if (!c) return;
    const wasHidden = hiddenCh.has(c.id);
    if (wasHidden) hiddenCh.delete(c.id); else hiddenCh.add(c.id);
    saveHidden();
    renderSide();
    route();
    if (wasHidden) toast(`${c.name} is back in your feeds.`);
    else toast(`Hid ${c.name} — out of All videos, search and recommendations.`, "Undo", () => {
      hiddenCh.delete(c.id); saveHidden(); renderSide(); route();
    });
  }

  /* ---------- recommendations ----------

     A hybrid, two-stage recommender with the same shape as YouTube's own pipeline —
     candidate generation → ranking → re-ranking — assembled from published, open
     algorithms and no model files, because this page has to stay one offline file:

       candidates   BM25 over title uni/bi-grams ....... Robertson & Zaragoza 2009 (Lucene, rank_bm25)
                    random-projection TF-IDF vectors ... Johnson–Lindenstrauss 1984 / Random Indexing
                    channel topic graph ................ cosine of channel centroid vectors
                    session transitions ................ SKNN / FPMC session-based recsys
       ranking      pairwise BPR linear ranker .......... Rendle et al., BPR 2009 (SGD, trained on your history)
       re-ranking   MMR diversification ................ Carbonell & Goldstein, SIGIR 1998
                    per-channel spread cap, serendipity dial
       shelves      Thompson sampling on shelf clicks .... Agrawal & Goyal 2012

     Why this shape: title words alone can only ever find videos that share words with what
     you watched, which drifts back to the same channels. The topic vectors generalise past
     exact words ("rust borrow checker" ↔ "memory safety in C"), and the channel graph plus
     the new-channel term push candidates out of the channel you are currently in. Nothing
     leaves the browser: the index and the embeddings are built in the page (~0.5 s for
     58,903 titles), and the ranker trains on your own history in ~30 ms.
  */
  let docs = [];
  let postings = new Map();
  let df = new Map();
  let avgdl = 1;
  const STOP = new Set(("a an and are as at be but by for from how i in into is it its of on or that "
    + "the this to vs was what when where which why with you your we they he she his her them my me our "
    + "new full video official trailer part ep episode vol").split(" "));

  function titleTerms(title) {
    const words = String(title).toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, " ")
      .split(/\s+/)
      .filter(w => w.length > 1 && !STOP.has(w) && !/^\d{1,4}$/.test(w));
    const out = [];
    for (let i = 0; i < words.length; i++) {
      out.push(words[i]);
      if (i) out.push(words[i - 1] + " " + words[i]);
    }
    return out;
  }

  function buildIndex() {
    if (docs.length) return;
    docs = V.map(v => titleTerms(v.title));
    const counts = new Map();
    for (const terms of docs) for (const t of terms) counts.set(t, (counts.get(t) || 0) + 1);
    for (const [term, n] of counts) {
      if (n < 2 || n > 4000) continue; // unique terms can't link videos; ubiquitous ones carry no signal
      df.set(term, n);
      postings.set(term, []);
    }
    for (let i = 0; i < docs.length; i++) {
      const used = new Set();
      for (const t of docs[i]) {
        if (used.has(t)) continue;
        used.add(t);
        const list = postings.get(t);
        if (list) list.push(i);
      }
    }
    let total = 0;
    for (const terms of docs) total += terms.length;
    avgdl = total / Math.max(1, docs.length);
  }

  /* ---------- topic vectors ----------
     TF-IDF over the same title terms, projected down to 64 dimensions by signed random
     projection: every term gets a deterministic ±1 pattern from its hash, so two titles
     that share vocabulary land close together without ever building a co-occurrence
     matrix. This is the Johnson–Lindenstrauss sketch / Random Indexing trick — O(nnz · d),
     no SVD, incremental, and cosine similarity in the sketch approximates cosine in the
     full term space. 64 dims keeps the whole library at ~15 MB of Float32. */
  const EMB_D = 64;
  let emb = null;       // Float32Array(V.length * EMB_D), unit rows
  let chEmb = null;     // Float32Array(CH.length * EMB_D), unit rows (channel centroids)
  let embBuilt = false;

  function hash32(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function buildEmbeddings() {
    if (embBuilt) return;
    buildIndex();
    const n = V.length;
    emb = new Float32Array(n * EMB_D);
    for (let d = 0; d < n; d++) {
      const terms = docs[d];
      if (!terms || !terms.length) continue;
      const counts = new Map();
      for (const t of terms) counts.set(t, (counts.get(t) || 0) + 1);
      const base = d * EMB_D;
      let norm = 0;
      const items = [];
      for (const [t, c] of counts) {
        const nq = df.get(t);
        if (!nq) continue;
        const idf = Math.log(1 + (n - nq + 0.5) / (nq + 0.5));
        const w = (1 + Math.log(c)) * idf;
        items.push([t, w]);
        norm += w * w;
      }
      if (!norm) continue;
      const inv = 1 / Math.sqrt(norm);
      for (let j = 0; j < items.length; j++) {
        const t = items[j][0], w = items[j][1] * inv;
        let s = hash32(t) | 1;              // per-term seed, never 0
        for (let k = 0; k < EMB_D; k++) {
          s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
          emb[base + k] += (s & 1) ? w : -w;
        }
      }
    }
    // Rows come out near-unit already; normalise exactly so cosine is a plain dot product.
    for (let d = 0; d < n; d++) {
      const base = d * EMB_D;
      let ss = 0;
      for (let k = 0; k < EMB_D; k++) ss += emb[base + k] * emb[base + k];
      if (ss > 1e-9) { const inv = 1 / Math.sqrt(ss); for (let k = 0; k < EMB_D; k++) emb[base + k] *= inv; }
    }
    chEmb = new Float32Array(CH.length * EMB_D);
    for (let c = 0; c < CH.length; c++) {
      const list = byChannel[c] || [];
      const base = c * EMB_D;
      for (const v of list) {
        const b2 = v.ix * EMB_D;
        for (let k = 0; k < EMB_D; k++) chEmb[base + k] += emb[b2 + k];
      }
      let ss = 0;
      for (let k = 0; k < EMB_D; k++) ss += chEmb[base + k] * chEmb[base + k];
      if (ss > 1e-9) { const inv = 1 / Math.sqrt(ss); for (let k = 0; k < EMB_D; k++) chEmb[base + k] *= inv; }
    }
    embBuilt = true;
  }

  // Channels whose topic centroids sit near this one — the graph that lets the feed leave a
  // channel for a neighbour that publishes about the same things.
  const _chNb = new Map();
  function neighboursOfChannel(i, k = 8) {
    buildEmbeddings();
    let all = _chNb.get(i);
    if (!all) {
      all = [];
      const b1 = i * EMB_D;
      for (let c = 0; c < CH.length; c++) {
        if (c === i) continue;
        const b2 = c * EMB_D;
        let s = 0;
        for (let d = 0; d < EMB_D; d++) s += chEmb[b1 + d] * chEmb[b2 + d];
        if (s > 0.06) all.push([c, s]);
      }
      all.sort((a, b) => b[1] - a[1]);
      _chNb.set(i, all);
    }
    return k ? all.slice(0, k) : all;
  }

  /* ---------- feedback state ---------- */
  let negIds = new Set(store.get("neg", []));           // "not interested" video ids
  const saveNeg = () => store.set("neg", [...negIds]);
  let ranker = store.get("ranker", null);               // { w: [..NF weights], pairs, at, loss }
  let bandit = store.get("bandit", {});                 // shelf id -> { c: clicks, i: impressions }
  const saveBandit = () => store.set("bandit", bandit);

  let _profile = null, _profileKey = "";
  let _sess = null, _sessKey = "";
  const _why = new Map();                               // video id -> explanation for the current feed
  const invalidateReco = () => { _profile = null; _sess = null; };

  const SESSION_GAP = 30 * 60 * 1000;                   // 30 min of silence starts a new session

  /* ---------- ranking model ----------
     Ten features, all bounded to roughly 0..1 so one learned weight is comparable to
     another. The defaults are the hand-tuned prior; `trainRanker` replaces them with
     weights fitted to this user by pairwise BPR. */
  const FEATURES = ["lexical", "semantic", "channel", "neighbours", "session",
                    "popular", "rating", "duration", "newChannel", "negative"];
  const NF = FEATURES.length;
  const DEFAULT_W = { lexical: 1.00, semantic: 1.30, channel: 0.35, neighbours: 0.55,
                      session: 0.90, popular: 0.12, rating: 0.30, duration: 0.12,
                      newChannel: 0.30, negative: -2.00 };

  function weightVector() {
    const out = new Float32Array(NF);
    const src = ranker && Array.isArray(ranker.w) && ranker.w.length === NF
      ? ranker.w : FEATURES.map(f => DEFAULT_W[f]);
    for (let i = 0; i < NF; i++) out[i] = src[i];
    // The Tune knobs still apply on top of a learned model: affinity scales the channel
    // feature, serendipity scales the new-channel feature.
    out[2] *= reco.affinity / 60;
    out[8] *= 0.4 + (reco.serendipity / 100) * 1.2;
    return out;
  }

  const _f = new Float32Array(NF);
  function lexFor(ix, p) {
    const terms = docs[ix];
    if (!terms || !terms.length) return 0;
    const K1 = 1.2, B = 0.75, dl = terms.length;
    let s = 0;
    const done = new Set();
    for (const t of terms) {
      if (done.has(t)) continue;
      done.add(t);
      const qw = p.query.get(t);
      if (!qw) continue;
      const nq = df.get(t);
      if (!nq) continue;
      const idf = Math.log(1 + (V.length - nq + 0.5) / (nq + 0.5));
      s += qw * idf * (K1 + 1) / (K1 * (1 - B + B * dl / avgdl) + 1);
    }
    return s;
  }

  /* Score = relevance × prior boost + small additive adjustments.
     Relevance (lexical, semantic, session) decides *whether* a video is for you; channel
     affinity, the topic graph and the new-channel push then amplify relevant videos instead
     of giving every video in a channel you watch a floor it did not earn. The old additive
     blend was why a chess search could surface a non-chess video from a favourite channel. */
  function scoreFrom(f, w) {
    const rel = f[0] * w[0] + f[1] * w[1] + f[4] * w[4];
    const boost = 1 + f[2] * w[2] + f[3] * w[3] + f[8] * w[8];
    return rel * boost + f[5] * w[5] + f[6] * w[6] + f[7] * w[7] + f[9] * w[9];
  }

  // d(score)/dw for the pairwise BPR update below — the product term makes this
  // slightly more than "feature difference".
  const _g = new Float32Array(NF);
  function scoreGrad(f, w, out) {
    const rel = f[0] * w[0] + f[1] * w[1] + f[4] * w[4];
    const boost = 1 + f[2] * w[2] + f[3] * w[3] + f[8] * w[8];
    out[0] = f[0] * boost; out[1] = f[1] * boost; out[4] = f[4] * boost;
    out[2] = rel * f[2]; out[3] = rel * f[3]; out[8] = rel * f[8];
    out[5] = f[5]; out[6] = f[6]; out[7] = f[7]; out[9] = f[9];
    return out;
  }

  function featVec(ix, p, ctx, out) {
    const v = V[ix];
    const f = out || _f;
    // log1p keeps order between two titles that both match the query hard (lx/1+lx
    // would squash them to the same 1.0 and throw the BM25 differences away).
    const lx = ctx.lex ? ctx.lex[ix] : lexFor(ix, p);
    f[0] = lx > 0 ? Math.min(1, Math.log1p(lx) / 12) : 0;
    let cos = 0;
    if (p.vecLen) {
      const b = ix * EMB_D;
      for (let k = 0; k < EMB_D; k++) cos += p.vec[k] * emb[b + k];
    }
    f[1] = cos > 0 ? cos : 0;
    f[2] = p.chAffN.get(v.ch) || 0;
    f[3] = ctx.neigh ? (ctx.neigh.get(v.ch) || 0) : 0;
    f[4] = ctx.sess ? (ctx.sess.get(ix) || 0) : 0;
    f[5] = v.views ? Math.min(1, Math.log10(1 + v.views) / 8) : 0;
    f[6] = rateFactor(v.ch) - 1;
    f[7] = (ctx.dur && v.dur) ? Math.max(0, 1 - Math.abs(Math.log(v.dur / ctx.dur)) / 1.6) : 0.5;
    f[8] = (p.chAff.size && !p.chAff.has(v.ch)) ? 1 : 0;
    f[9] = negIds.has(v.id) ? 1 : 0;
    return f;
  }

  /* ---------- profile = your taste, decayed ---------- */
  function weightedMedianDur(pairs) {
    if (!pairs.length) return 900;
    pairs.sort((a, b) => a[0] - b[0]);
    let total = 0;
    for (const [, w] of pairs) total += w;
    let run = 0;
    for (const [d, w] of pairs) { run += w; if (run >= total / 2) return d; }
    return pairs[pairs.length - 1][0];
  }

  function buildProfile(hist) {
    buildEmbeddings();
    const now = Date.now();
    const vec = new Float32Array(EMB_D);
    const query = new Map();
    const chAff = new Map();
    const seedByTerm = new Map();
    const watched = new Set();
    const durs = [];
    const recent = hist.slice(-200);
    for (const h of hist) { const v = byId.get(h.id); if (v) watched.add(v.id); }
    // Newest first, so a term maps to the most recent video you watched that carries it.
    for (let i = recent.length - 1; i >= 0; i--) {
      const v = byId.get(recent[i].id);
      if (!v) continue;
      for (const t of docs[v.ix] || []) if (!seedByTerm.has(t)) seedByTerm.set(t, v);
    }
    for (const h of recent) {
      const v = byId.get(h.id);
      if (!v) continue;
      const age = Math.max(0, (now - (h.t || now)) / 864e5);
      const decay = Math.pow(0.5, age / Math.max(1, reco.halfLife));
      const eng = typeof h.w === "number" ? h.w : 1;   // engagement: 0.3 for a quick exit, 1.4 for a full watch
      const w = decay * eng;
      if (w < 0.02) continue;
      chAff.set(v.ch, (chAff.get(v.ch) || 0) + w);
      for (const t of docs[v.ix] || []) query.set(t, (query.get(t) || 0) + w);
      const b = v.ix * EMB_D;
      for (let k = 0; k < EMB_D; k++) vec[k] += emb[b + k] * w;
      if (v.dur) durs.push([v.dur, w]);
    }
    let vecLen = 0;
    for (let k = 0; k < EMB_D; k++) vecLen += vec[k] * vec[k];
    vecLen = Math.sqrt(vecLen);
    if (vecLen > 1e-9) for (let k = 0; k < EMB_D; k++) vec[k] /= vecLen; else vecLen = 0;
    let cmax = 1;
    for (const n of chAff.values()) if (n > cmax) cmax = n;
    const chAffN = new Map();
    for (const [c, n] of chAff) chAffN.set(c, n / cmax);
    const chTop = [...chAff.entries()].sort((a, b) => b[1] - a[1])
      .slice(0, 8).map(([c, n]) => [c, n / cmax]);
    return { vec, vecLen, query, chAff, chAffN, chTop, watched, seedByTerm,
             prefDur: weightedMedianDur(durs), size: recent.length };
  }

  const historyKey = () => history.length + ":" + (history.length ? history[history.length - 1].t : 0)
    + ":" + negIds.size + ":" + reco.halfLife;

  function profile() {
    const key = historyKey();
    if (!_profile || _profileKey !== key) { _profile = buildProfile(history); _profileKey = key; }
    return _profile;
  }

  /* ---------- session transitions (what usually follows what) ---------- */
  function sessionTransitions() {
    const key = history.length + ":" + (history.length ? history[history.length - 1].t : 0);
    if (_sess && _sessKey === key) return _sess;
    const trans = new Map();
    let max = 1, last = [], prev = null;
    for (const h of history) {
      const v = byId.get(h.id);
      if (!v) continue;
      if (prev && (h.t || 0) - prev.t <= SESSION_GAP) {
        let m = trans.get(prev.ix);
        if (!m) trans.set(prev.ix, m = new Map());
        const c = (m.get(v.ix) || 0) + 1;
        m.set(v.ix, c);
        if (c > max) max = c;
      } else {
        last = [];
      }
      last.push(v.ix);
      prev = { ix: v.ix, t: h.t || 0 };
    }
    _sess = { trans, max, last: last.slice(-6) };
    _sessKey = key;
    return _sess;
  }

  /* ---------- candidate generation + ranking ---------- */
  let _lex = null, _mask = null;
  const _cand = [];

  function rankHybrid(p, opts = {}) {
    buildEmbeddings();
    const n = V.length;
    if (!_lex || _lex.length !== n) { _lex = new Float32Array(n); _mask = new Uint8Array(n); }
    _lex.fill(0); _mask.fill(0);
    const cand = _cand; cand.length = 0;
    const mark = ix => { if (!_mask[ix]) { _mask[ix] = 1; cand.push(ix); } };

    // 1 — lexical: BM25 postings for the profile's terms.
    const K1 = 1.2, B = 0.75;
    for (const [term, qw] of p.query) {
      const list = postings.get(term);
      if (!list) continue;
      const nq = df.get(term) || 0;
      const idf = Math.log(1 + (n - nq + 0.5) / (nq + 0.5));
      const w = qw * idf;
      for (let i = 0; i < list.length; i++) {
        const d = list[i];
        const dl = docs[d].length || 1;
        _lex[d] += w * (K1 + 1) / (K1 * (1 - B + B * dl / avgdl) + 1);
      }
    }
    for (let d = 0; d < n; d++) if (_lex[d] > 0) mark(d);

    // 2 — semantic: the nearest titles in topic-vector space, regardless of shared words.
    if (p.vecLen) {
      const top = [];
      for (let d = 0; d < n; d++) {
        const b = d * EMB_D;
        let s = 0;
        for (let k = 0; k < EMB_D; k++) s += p.vec[k] * emb[b + k];
        if (s > 0.05) top.push([d, s]);
      }
      top.sort((a, b) => b[1] - a[1]);
      const keep = Math.min(top.length, 2400);
      for (let i = 0; i < keep; i++) mark(top[i][0]);
    }

    // 3 — your favourite channels themselves: the next thing from a channel you watch.
    for (const [ch] of p.chTop) for (const v of byChannel[ch] || []) mark(v.ix);

    // 3b — channel topic graph: everything published by channels next to your favourites.
    const neigh = new Map();
    for (const [ch, w] of p.chTop) {
      for (const [nb, s] of neighboursOfChannel(ch, 8)) {
        neigh.set(nb, Math.max(neigh.get(nb) || 0, s * w));
      }
    }
    for (const ch of neigh.keys()) for (const v of byChannel[ch] || []) mark(v.ix);

    // 4 — session: what tended to follow what you just watched.
    const st = sessionTransitions();
    const sess = new Map();
    for (const a of st.last) {
      const m = st.trans.get(a);
      if (!m) continue;
      for (const [b, c] of m) sess.set(b, Math.max(sess.get(b) || 0, Math.min(1, c / st.max)));
    }
    for (const ix of sess.keys()) mark(ix);

    const ctx = { lex: _lex, neigh, sess, dur: p.prefDur };
    const w = opts.weights || weightVector();
    const allow = opts.allowSet || null;
    const exclude = opts.exclude || null;
    const out = [];
    for (let i = 0; i < cand.length; i++) {
      const ix = cand[i];
      const v = V[ix];
      if (vOff(v)) continue;
      if (allow && !allow.has(v.ch)) continue;
      if (exclude && exclude.has(v.id)) continue;
      const f = featVec(ix, p, ctx, _f);
      let sc = scoreFrom(f, w);
      if (p.watched.has(v.id)) sc *= reco.watched / 100;
      out.push({ ix, v, s: sc });
    }
    out.sort((a, b) => b.s - a.s);
    return out.slice(0, opts.limit || 900);
  }

  /* ---------- re-ranking: MMR + a channel spread cap ----------
     MMR trades a little relevance for variety (Carbonell & Goldstein). The cap stops one
     prolific channel from filling the head of the feed; serendipity sets both how hard the
     diversity term pulls and how tight the cap is. Similarity is approximated against the
     last 6 picks rather than all of them, which is the usual O(k) shortcut. */
  function diversify(ranked, head = 90) {
    if (!ranked.length) return ranked;
    const lam = 1 - (reco.serendipity / 100) * 0.55;
    const cap = reco.serendipity > 66 ? 1 : reco.serendipity > 33 ? 2 : 3;
    const pool = ranked.slice(0, Math.min(ranked.length, 240));
    const rest = ranked.slice(pool.length);
    const picked = [];
    const perCh = new Map();
    while (picked.length < head && pool.length) {
      let bi = -1, bs = -Infinity, fi = -1, fs = -Infinity;
      const from = Math.max(0, picked.length - 6);
      for (let i = 0; i < pool.length; i++) {
        const c = pool[i];
        let sim = 0;
        if (picked.length) {
          const b1 = c.ix * EMB_D;
          for (let j = from; j < picked.length; j++) {
            const b2 = picked[j].ix * EMB_D;
            let d = 0;
            for (let k = 0; k < EMB_D; k++) d += emb[b1 + k] * emb[b2 + k];
            if (d > sim) sim = d;
          }
        }
        const val = lam * c.s - (1 - lam) * sim;
        if (val > fs) { fs = val; fi = i; }
        if ((perCh.get(c.v.ch) || 0) >= cap) continue;
        if (val > bs) { bs = val; bi = i; }
      }
      const take = bi >= 0 ? bi : fi;
      if (take < 0) break;
      const c = pool.splice(take, 1)[0];
      picked.push(c);
      perCh.set(c.v.ch, (perCh.get(c.v.ch) || 0) + 1);
    }
    return picked.concat(pool, rest);
  }

  /* ---------- explanations ---------- */
  const shortTitle = t => t.length > 46 ? t.slice(0, 46).trimEnd() + "…" : t;

  function explain(ix, p) {
    const v = V[ix];
    const terms = docs[ix] || [];
    const scored = [];
    for (const t of terms) {
      const qw = p.query.get(t);
      if (!qw) continue;
      const nq = df.get(t);
      if (!nq) continue;
      scored.push([t, qw * Math.log(1 + (V.length - nq + 0.5) / (nq + 0.5))]);
    }
    scored.sort((a, b) => b[1] - a[1]);
    const top = scored.slice(0, 3).map(x => x[0]);
    const seed = top.length ? p.seedByTerm.get(top[0]) : null;
    const bits = [];
    if (seed && seed.ch !== v.ch) bits.push(`because you watched “${shortTitle(seed.title)}”`);
    else if (top.length >= 2) bits.push(`matches “${top[0]}” + “${top[1]}”`);
    else if (top.length) bits.push(`matches “${top[0]}”`);
    if (p.chAff.size && !p.chAff.has(v.ch)) bits.push(`channel you haven't watched`);
    else if (bits.length) bits.push("from your usual channels");
    return bits.join(" · ") || "popular in your library";
  }

  function whyFor(id) { return _why.get(id) || ""; }

  /* ---------- the feed ---------- */
  function forYou(chs) {
    if (!chs.length) return [];
    const p = profile();
    const pool = chs.flatMap(c => byChannel[c.i]).filter(v => !vOff(v));
    if (!p.size) return shuffle(pool);
    const allow = chs.length === CH.length ? null : new Set(chs.map(c => c.i));
    const ranked = diversify(rankHybrid(p, { allowSet: allow, limit: 900 }), 90);
    for (let i = 0; i < Math.min(ranked.length, 120); i++) {
      _why.set(ranked[i].v.id, explain(ranked[i].ix, p));
    }
    const out = ranked.map(r => r.v);
    const have = new Set(out.map(v => v.id));
    for (const v of pool) if (!have.has(v.id)) out.push(v);   // never let infinite scroll dead-end
    return out;
  }

  // Nearest titles in topic space, optionally forcing videos from *other* channels.
  function nearestTo(seedIx, n = 12, opts = {}) {
    buildEmbeddings();
    const base = seedIx * EMB_D;
    const out = [];
    for (let d = 0; d < V.length; d++) {
      if (d === seedIx) continue;
      const v = V[d];
      if (opts.avoidChannel != null && v.ch === opts.avoidChannel) continue;
      if (opts.exclude && opts.exclude.has(v.id)) continue;
      if (vOff(v) || negIds.has(v.id)) continue;
      const b = d * EMB_D;
      let s = 0;
      for (let k = 0; k < EMB_D; k++) s += emb[base + k] * emb[b + k];
      if (s <= 0.02) continue;
      out.push({ ix: d, v, s: s * rateFactor(v.ch) * (opts.ignoreWatched ? 1 : (watchedSet().has(v.id) ? 0.35 : 1)) });
    }
    out.sort((a, b) => b.s - a.s);
    return out.slice(0, n);
  }

  function similarTo(v, n = 15) {
    if (!v) return [];
    const p = profile();
    const ranked = rankHybrid(p, { exclude: new Set([v.id]), limit: 400 });
    // Seed the ranking with the video itself so "up next" never drifts off-topic.
    if (v.ix != null) {
      const seedRank = nearestTo(v.ix, 40).map(r => ({ ...r }));
      const seenIx = new Set(ranked.map(r => r.ix));
      for (const r of seedRank) if (!seenIx.has(r.ix)) ranked.push({ ix: r.ix, v: r.v, s: r.s });
    }
    const mixed = diversify(ranked, 70).map(r => r.v);
    // Up next on a watch page wants the creator you are already watching first, then
    // branches out — the opposite of the home shelves, which deliberately leave the channel.
    const sameCap = Math.max(2, Math.round(n * 0.4));
    const same = mixed.filter(x => x.ch === v.ch).slice(0, sameCap);
    const rest = mixed.filter(x => x.ch !== v.ch);
    const out = [];
    let si = 0, ri = 0;
    while (out.length < n && (si < same.length || ri < rest.length)) {
      if (si < same.length && out.length % 3 === 0) out.push(same[si++]);
      else if (ri < rest.length) out.push(rest[ri++]);
      else out.push(same[si++]);
    }
    if (out.length >= n) return out.slice(0, n);
    const have = new Set([v.id, ...out.map(x => x.id)]);
    const fill = V.filter(x => !have.has(x.id) && !vOff(x)).sort((a, b) => (b.views || 0) - (a.views || 0));
    for (const x of fill) { if (out.length >= n) break; out.push(x); }
    return out.slice(0, n);
  }

  /* ---------- home shelves ----------
     Four generators, each answering a different question. Every shelf's streak of clicks
     is fed back into a Thompson sampler, so the row order follows what you actually open
     instead of a hard-coded priority. */
  function homeShelves(chFilter) {
    if (chFilter != null) return [];
    const p = profile();
    if (!p.size) return [];
    const used = new Set();
    const take = (rows, n) => {
      const out = [];
      for (const r of rows) {
        const id = r.v.id;
        if (used.has(id)) continue;
        used.add(id);
        out.push(r.v);
        if (out.length >= n) break;
      }
      return out;
    };
    const shelves = [];

    // 1 — "Because you watched X", deliberately from other channels.
    const seeds = [];
    for (let i = history.length - 1; i >= 0 && seeds.length < 2; i--) {
      const v = byId.get(history[i].id);
      if (!v || vOff(v)) continue;
      if (seeds.some(s => s.ch === v.ch)) continue;
      seeds.push(v);
    }
    for (const seed of seeds) {
      const rows = nearestTo(seed.ix, 14, { avoidChannel: seed.ch });
      const items = take(rows, 10);
      if (items.length >= 5) {
        shelves.push({
          id: "because:" + seed.id,
          title: `Because you watched ${shortTitle(seed.title)}`,
          note: "similar videos from other channels",
          items,
        });
      }
    }

    // 2 — "New to you": strong candidates from channels with no watch history at all.
    const ranked = rankHybrid(p, { limit: 600 });
    const fresh = ranked.filter(r => p.chAff.size && !p.chAff.has(r.v.ch));
    const newItems = take(fresh, 12);
    if (newItems.length >= 5) {
      shelves.push({ id: "new-to-you", title: "New to you", note: "channels you haven't watched yet", items: newItems });
    }

    // 3 — "Continue this thread": the session's own transition model.
    const st = sessionTransitions();
    if (st.last.length >= 2) {
      const sessRows = [];
      for (const a of st.last) {
        const m = st.trans.get(a);
        if (!m) continue;
        for (const [b, c] of m) if (!used.has(V[b].id)) sessRows.push({ ix: b, v: V[b], s: c / st.max });
      }
      sessRows.sort((a, b) => b.s - a.s);
      const items = take(sessRows, 10);
      if (items.length >= 3) {
        shelves.push({ id: "thread", title: "Continue this thread", note: "what usually follows what you just watched", items });
      }
    }

    // 4 — "More from channels like X": the channel topic graph, not your history.
    if (p.chTop.length) {
      const topCh = p.chTop[0][0];
      const lists = [];
      for (const [nb, s] of neighboursOfChannel(topCh, 8)) {
        const arr = (byChannel[nb] || [])
          .filter(v => !used.has(v.id) && !vOff(v) && !negIds.has(v.id))
          .sort((a, b) => (b.views || 0) - (a.views || 0))
          .slice(0, 3);
        if (arr.length) lists.push({ s: s * rateFactor(nb), arr });
      }
      lists.sort((a, b) => b.s - a.s);
      // Round-robin across neighbours so a single channel cannot fill the shelf.
      const rows = [];
      for (let round = 0; round < 3; round++) {
        for (const l of lists) if (l.arr[round]) rows.push({ v: l.arr[round], s: l.s });
      }
      const items = take(rows, 10);
      if (items.length >= 5) {
        shelves.push({
          id: "neighbours:" + topCh,
          title: `More like ${CH[topCh].name}`,
          note: "channels that publish about the same things",
          items,
        });
      }
    }

    // 5 — "Deep cuts": relevant but under-watched, which the popularity term normally buries.
    if (history.length >= 5) {
      const cuts = ranked
        .filter(r => (r.v.views || 0) > 0 && (r.v.views || 0) < 60000 && !used.has(r.v.id))
        .slice(0, 40);
      const items = take(cuts, 10);
      if (items.length >= 5) shelves.push({ id: "deep-cuts", title: "Deep cuts", note: "relevant, but not the famous ones", items });
    }

    for (const s of shelves) for (const v of s.items) if (v.ix != null) _why.set(v.id, explain(v.ix, p));
    return orderShelves(shelves);
  }

  /* ---------- Thompson sampling over shelf order ---------- */
  function randn() {
    let u = 0, v = 0;
    while (!u) u = Math.random();
    while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function gammaSample(k) {
    if (k < 1) return gammaSample(1 + k) * Math.pow(Math.random(), 1 / k);
    const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
    for (;;) {
      let x, v;
      do { x = randn(); v = 1 + c * x; } while (v <= 0);
      v = v * v * v;
      const u = Math.random();
      if (u < 1 - 0.0331 * x * x * x * x) return d * v;
      if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
    }
  }
  const betaSample = (a, b) => { const x = gammaSample(a), y = gammaSample(b); return x / (x + y); };

  function orderShelves(list) {
    list.forEach((s, idx) => {
      const b = bandit[s.id] || { c: 0, i: 0 };
      // Cold start keeps the curated order; after a few impressions the sampler takes over.
      s.sample = b.i < 4 ? 1 - idx * 0.01 : betaSample(b.c + 1, b.i - b.c + 1);
    });
    return list.slice().sort((a, b) => b.sample - a.sample);
  }
  function shelfImpression(id) {
    const b = bandit[id] || (bandit[id] = { c: 0, i: 0 });
    b.i++;
    saveBandit();
  }
  function shelfClick(id) {
    const b = bandit[id] || (bandit[id] = { c: 0, i: 0 });
    b.c++;
    b.i++;
    saveBandit();
  }

  /* ---------- on-device learning: pairwise BPR ----------
     Rendle et al.'s Bayesian Personalised Ranking: for each video you actually watched,
     sample an unwatched one and nudge the weights until the watched one scores higher.
     No labels to provide, no model file, ~30 ms on a few hundred pairs. */
  const _fp = new Float32Array(NF), _fn = new Float32Array(NF);
  const _gp = new Float32Array(NF), _gn = new Float32Array(NF);
  function trainRanker() {
    buildEmbeddings();
    const pos = [];
    for (const h of history) {
      const v = byId.get(h.id);
      if (!v || negIds.has(v.id)) continue;
      if (typeof h.w === "number" && h.w < 0.45) continue;  // quick exits are not positives
      pos.push(v.ix);
    }
    if (pos.length < 8) return { ok: false, msg: "Watch at least 8 videos first — the ranker needs examples." };
    const p = profile();
    const ctx = { lex: null, neigh: new Map(), sess: new Map(), dur: p.prefDur };
    const st = sessionTransitions();
    for (const a of st.last) {
      const m = st.trans.get(a);
      if (m) for (const [b, c] of m) ctx.sess.set(b, Math.min(1, c / st.max));
    }
    for (const [ch, w] of p.chTop) for (const [nb, s] of neighboursOfChannel(ch, 8)) ctx.neigh.set(nb, Math.max(ctx.neigh.get(nb) || 0, s * w));

    let seed = 0x9e3779b9 ^ history.length;
    const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
    // Hard negatives: half sampled from channels you already watch (so the model cannot
    // learn "a new channel is always bad" — the usual exposure bias), half uniform.
    const negatives = [];
    const want = Math.max(24, pos.length * 4);
    const hotCh = p.chTop.map(x => x[0]);
    for (let guard = 0; negatives.length < want && guard < want * 80; guard++) {
      let v;
      if (hotCh.length && rnd() < 0.5) {
        const arr = byChannel[hotCh[(rnd() * hotCh.length) | 0]] || [];
        if (!arr.length) continue;
        v = arr[(rnd() * arr.length) | 0];
      } else {
        v = V[(rnd() * V.length) | 0];
      }
      if (!v || p.watched.has(v.id) || negIds.has(v.id)) continue;
      negatives.push(v.ix);
    }
    const w = new Float32Array(FEATURES.map(f => DEFAULT_W[f]));
    const lr = 0.03, l2 = 0.002;
    let loss = 0, steps = 0;
    for (let epoch = 0; epoch < 40; epoch++) {
      for (const a of pos) {
        const b = negatives[(rnd() * negatives.length) | 0];
        if (b == null) continue;
        featVec(a, p, ctx, _fp);
        featVec(b, p, ctx, _fn);
        const x = scoreFrom(_fp, w) - scoreFrom(_fn, w);
        const g = 1 / (1 + Math.exp(Math.max(-30, Math.min(30, x))));   // sigmoid(-x)
        loss += Math.log(1 + Math.exp(-Math.max(-30, Math.min(30, x))));
        scoreGrad(_fp, w, _gp); scoreGrad(_fn, w, _gn);
        for (let k = 0; k < NF; k++) {
          w[k] += lr * (g * (_gp[k] - _gn[k]) - l2 * w[k]);
          if (w[k] > 3) w[k] = 3; else if (w[k] < -3) w[k] = -3;
        }
        steps++;
      }
    }
    // One user is a tiny training set, so shrink toward the hand-tuned prior instead of
    // trusting weights fitted on a few hundred pairs. Exploration stays a policy, not a
    // preference: the exposure bias of "you have only watched 8 of 1,427 channels" must not
    // teach the model that new channels are bad.
    for (let k = 0; k < NF; k++) w[k] = 0.65 * w[k] + 0.35 * DEFAULT_W[FEATURES[k]];
    w[FEATURES.indexOf("newChannel")] = DEFAULT_W.newChannel;
    ranker = { w: Array.from(w), pairs: steps, at: Date.now(), loss: +(loss / Math.max(1, steps)).toFixed(4) };
    store.set("ranker", ranker);
    invalidateReco();
    return { ok: true, ...ranker };
  }

  function resetRanker() {
    ranker = null;
    try { localStorage.removeItem("mytube-ranker"); } catch {}
    invalidateReco();
  }

  /* ---------- offline evaluation (Recs Lab) ----------
     A temporal hold-out: train on everything before the cut, then replay the last few
     watches and measure where the engine would have put them. Recall@10, NDCG@10, MRR,
     plus catalogue coverage and intra-list diversity, for the BM25-only baseline and the
     hybrid model, so the improvement is a number and not a claim. */
  const BASE_W = new Float32Array(NF);
  BASE_W[0] = 1;

  function evaluateEngine(sample = 12) {
    buildEmbeddings();
    const hist = history.filter(h => byId.has(h.id)).slice().sort((a, b) => (a.t || 0) - (b.t || 0));
    if (hist.length < 12) return { ok: false, msg: "Watch at least 12 videos to get a meaningful evaluation." };
    const cut = Math.max(6, Math.floor(hist.length * 0.8));
    const train = hist.slice(0, cut);
    let test = hist.slice(cut);
    if (test.length > sample) test = test.slice(-sample);
    const run = weights => {
      let hit = 0, ndcg = 0, mrr = 0, cov = 0, ild = 0, n = 0, candHit = 0;
      for (let i = 0; i < test.length; i++) {
        const prior = train.concat(test.slice(0, i));
        if (!prior.length) continue;
        const p = buildProfile(prior);
        const tv = byId.get(test[i].id);
        const raw = rankHybrid(p, { weights, limit: 600 });
        if (tv && _mask[tv.ix]) candHit++;   // was the right answer even in the pool?
        // Relevance is measured on the ranked list; coverage and diversity on the re-ranked
        // feed, because MMR deliberately trades relevance for variety.
        const rank = raw.findIndex(r => r.v.id === test[i].id);
        if (rank >= 0 && rank < 10) { hit++; ndcg += 1 / Math.log2(rank + 2); mrr += 1 / (rank + 1); }
        const head = diversify(raw, 50).slice(0, 50);
        cov += new Set(head.map(r => r.v.ch)).size / Math.max(1, CH.length);
        let sim = 0, pairs = 0;
        for (let a = 0; a < Math.min(20, head.length); a++) {
          for (let b = a + 1; b < Math.min(20, head.length); b++) {
            const x = head[a].ix * EMB_D, y = head[b].ix * EMB_D;
            let s = 0;
            for (let k = 0; k < EMB_D; k++) s += emb[x + k] * emb[y + k];
            sim += Math.max(0, Math.min(1, 1 - s)); pairs++;
          }
        }
        ild += pairs ? sim / pairs : 0;
        n++;
      }
      return n ? { recall: hit / n, ndcg: ndcg / n, mrr: mrr / n, coverage: cov / n,
        ild: ild / n, candRecall: candHit / n, n } : null;
    };
    const base = run(BASE_W);
    const hybrid = run(weightVector());
    return { ok: true, base, hybrid, tested: test.length, trained: train.length };
  }

  /* ---------- engagement ---------- */
  function remember(v, weight) {
    history = history.filter(h => h.id !== v.id);
    history.push({ id: v.id, ch: v.ch, t: Date.now(), w: weight == null ? 1 : weight });
    if (history.length > 800) history = history.slice(-800);
    store.set("history", history);
    invalidateWatched();
    invalidateReco();
  }

  // Called when you leave a video: how much of it you actually watched becomes the weight
  // this watch carries in every future ranking (0.3 for a quick exit, 1.4 for the end).
  function rememberEngagement(id, seconds, ended) {
    let idx = -1;
    for (let i = history.length - 1; i >= 0; i--) if (history[i].id === id) { idx = i; break; }
    if (idx < 0) return;
