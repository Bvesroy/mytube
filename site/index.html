    const h = history[idx];
    const w = ended ? 1.4 : Math.min(1.3, Math.max(0.3, (seconds || 0) / 120));
    if (Math.abs((h.w || 1) - w) < 0.05) {
      // still report to backend best-effort
    } else {
      h.w = +w.toFixed(2);
      store.set("history", history);
      invalidateReco();
    }
    // Backend Phase 2/3 (best-effort): record My Tube progress/completion. For external mode, completion is not confirmed YouTube history.
    try {
      const st = Backend.sessions.get(id);
      if (st && st.id) {
        if (ended) Backend.historyComplete(st.id, { position_s: seconds || st.lastPos || 0, watched_s: seconds || 0, completed: st.source !== 'external_youtube' ? true : false });
        else Backend.historyProgress(st.id, { position_s: seconds || 0, watched_delta_s: Math.max(0, (seconds || 0) - (st.lastPos || 0)) });
        st.lastPos = seconds || st.lastPos || 0;
      }
    } catch {}
  }

  function markNotInterested(v) {
    const had = negIds.has(v.id);
    if (had) negIds.delete(v.id); else negIds.add(v.id);
    saveNeg();
    invalidateReco();
    if (!had) {
      toast(`Not interested in “${shortTitle(v.title)}” — it will sink in your feed.`, "Undo", () => {
        negIds.delete(v.id); saveNeg(); invalidateReco(); route();
      });
    } else toast("That video can show up again.");
  }

  /* ---------- categories ----------
     A shallow Rocchio-style text classifier: a weighted keyword lexicon scored over each
     channel's name, description and up to 30 recent titles. Term weights are multiplied
     by inverse library frequency (so "engineering", present in 300 channels, counts for
     little and a specific term counts for a lot), title and name hits count double, and
     scores are length-normalised so a long description can't win on volume. Terms used by

     score is under 0.33 falls back to "Uncategorised".

     need a model download or an API key and this page has to stay one offline file; k-means
     over TF-IDF was the other candidate (implemented in open toolkits as spherical k-means),

  const CAT_FALLBACK = { id: "other", name: "Uncategorised" };
  const CAT_KNOWN = new Set([...CATS.map(c => c.id), CAT_FALLBACK.id]);
  let catList = null;
  let catOfCh = null;
  let autoCatOfCh = null; // the classifier's bucket, before your manual overrides
  const catCounts = new Map();

  const tokenSet = text => {
    const w = String(text).toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
    const s = new Set(w);
    for (let i = 1; i < w.length; i++) s.add(w[i - 1] + " " + w[i]);
    return s;
  };

  function buildCategories() {
    if (catList) return;
    const N = CH.length;
    const titleSets = [], nameSets = [], descSets = [], lens = [];
    for (let i = 0; i < N; i++) {
      const titles = byChannel[i].slice(0, 30).map(v => v.title).join(" \n ");
      titleSets.push(tokenSet(titles));
      nameSets.push(tokenSet(CH[i].name));
      descSets.push(tokenSet(CH[i].desc || ""));
      lens.push(titles.length / 6 + (CH[i].desc || "").length / 6 + CH[i].name.length * 3);
    }
    const df = new Map();
    for (const c of CATS) for (const t of Object.keys(c.terms)) df.set(t, 0);
    for (let i = 0; i < N; i++) {
      for (const t of df.keys()) {
        if (titleSets[i].has(t) || nameSets[i].has(t) || descSets[i].has(t)) df.set(t, df.get(t) + 1);
      }
    }
    catList = CATS.map(c => {
      let norm = 0;
      const terms = [];
      for (const [term, w] of Object.entries(c.terms)) {
        const d = df.get(term) || 0;
        if (!d || d > N * 0.35) continue; // nowhere or everywhere: no signal
        const eff = w * Math.log((N + 1) / (d + 1));
        if (eff < 0.6) continue;
        terms.push([term, eff]);
        norm += eff * eff;
      }
      return { id: c.id, name: c.name, terms, norm: Math.sqrt(norm) || 1 };
    });
    catOfCh = new Array(N);
    autoCatOfCh = new Array(N);
    for (const c of catList) catCounts.set(c.id, 0);
    for (let i = 0; i < N; i++) {
      let best = null, bestScore = 0;
      for (const c of catList) {
        let s = 0;
        for (const [term, w] of c.terms) {
          if (titleSets[i].has(term)) s += w * 2.2;
          else if (nameSets[i].has(term)) s += w * 3;
          else if (descSets[i].has(term)) s += w;
        }
        if (s <= 0) continue;
        const n = (s / c.norm) / Math.pow(Math.max(1, lens[i]) / 500, 0.25);
        if (n > bestScore) { bestScore = n; best = c; }
      }
      autoCatOfCh[i] = bestScore >= 0.33 && best ? best.id : CAT_FALLBACK.id;
      const ov = catOv[CH[i].id]; // a manual move beats the classifier's guess
      catOfCh[i] = ov && CAT_KNOWN.has(ov) ? ov : autoCatOfCh[i];
      catCounts.set(catOfCh[i], (catCounts.get(catOfCh[i]) || 0) + 1);
    }
  }

  const catDef = id => (id === CAT_FALLBACK.id ? CAT_FALLBACK : (catList || []).find(c => c.id === id) || CAT_FALLBACK);
  const catIdOf = c => (catOfCh ? catOfCh[c.i] : CAT_FALLBACK.id);
  const catName = c => catDef(catIdOf(c)).name;
  const catOff = c => hiddenCat.has(catIdOf(c));

  // Re-assign every channel from the classifier's bucket plus your manual overrides, and
  // rebuild the per-bucket channel counts. Cheap enough (1.4k rows) to run on each move.
  function rebucket() {
    catCounts.clear();
    for (let i = 0; i < CH.length; i++) {
      const ov = catOv[CH[i].id];
      catOfCh[i] = ov && CAT_KNOWN.has(ov) ? ov : (autoCatOfCh ? autoCatOfCh[i] : CAT_FALLBACK.id);
      catCounts.set(catOfCh[i], (catCounts.get(catOfCh[i]) || 0) + 1);
    }
  }

  function setCatOverride(c, target) {
    buildCategories();
    const prev = catOv[c.id];
    if (target) catOv[c.id] = target; else delete catOv[c.id];
    saveCatOv();
    rebucket();
    invalidateWatched();
    renderSide();
    route();
    const name = target ? catDef(target).name : catDef(autoCatOfCh[c.i]).name;
    toast(`Moved ${c.name} to ${name}.`, "Undo", () => {
      if (prev) catOv[c.id] = prev; else delete catOv[c.id];
      saveCatOv(); rebucket(); invalidateWatched(); renderSide(); route();
    });
  }

  // Per-bucket video totals and how many of them are still unwatched (not in history),
  // over the channels you can see. Hidden videos are left out entirely.
  function catVideoStats(chs) {
    const w = watchedSet();
    const m = new Map();
    for (const c of chs) for (const v of byChannel[c.i]) {
      if (hiddenVid.has(v.id)) continue;
      const id = catOfCh[c.i];
      let e = m.get(id); if (!e) { e = { total: 0, unread: 0 }; m.set(id, e); }
      e.total++; if (!w.has(v.id)) e.unread++;
    }
    return m;
  }

  // Categories live in the bar across the top; channels keep the sidebar.
  function renderCategories() {
    buildCategories();
    const host = $("#catBar");
    if (!host) return;
    const stats = catVideoStats(CH.filter(c => !hiddenCh.has(c.id)));
    const rows = catList.filter(c => catCounts.get(c.id))
      .sort((a, b) => catCounts.get(b.id) - catCounts.get(a.id));
    if (catCounts.get(CAT_FALLBACK.id)) rows.push(CAT_FALLBACK);
    const route = routeFromHash();
    host.innerHTML = rows.map(c => {
      const off = hiddenCat.has(c.id);
      const n = catCounts.get(c.id) || 0;
      const st = stats.get(c.id);
      const unseen = st && st.unread > 0 && st.unread < st.total ? ` <i class="unread">${fmtNum(st.unread)} new</i>` : "";
      return `<div class="cchip${off ? " off" : ""}${route === "t/" + c.id ? " on" : ""}" data-href="#/t/${c.id}" data-route="t/${c.id}">
        <span>${esc(c.name)}</span><b>${fmtNum(n)}</b>${unseen}
        <button class="eye" data-hidecat="${c.id}" title="${off ? "Show" : "Hide"} ${esc(c.name)}" aria-label="${off ? "Show" : "Hide"} category ${esc(c.name)}">${off ? eyeOff : eyeOpen}</button></div>`;
    }).join("");
  }

  function toggleCategory(id, silent) {
    buildCategories();
    const def = catDef(id);
    const was = hiddenCat.has(id);
    if (was) hiddenCat.delete(id); else hiddenCat.add(id);
    saveHidden();
    renderSide();
    route();
    if (silent) return;
    if (was) toast(`${def.name} is back — its channels show up in your feeds again.`);
    else toast(`Hid ${def.name} — ${fmtNum(catCounts.get(id) || 0)} channels out of All videos, search and recommendations.`, "Undo", () => {
      hiddenCat.delete(id); saveHidden(); renderSide(); route();
    });
  }

  function toggleSeenCat(id) {
    buildCategories();
    const was = seenAll.cats.has(id);
    if (was) seenAll.cats.delete(id); else seenAll.cats.add(id);
    saveSeen();
    invalidateWatched();
    renderSide();
    route();
    if (was) toast(`${catDef(id).name} is unwatched again — its unread count is back.`);
    else toast(`Marked every ${catDef(id).name} video as watched.`, "Undo", () => {
      seenAll.cats.delete(id); saveSeen(); invalidateWatched(); renderSide(); route();
    });
  }

  function toggleSeenCh(c) {
    const was = seenAll.chs.has(c.id);
    if (was) seenAll.chs.delete(c.id); else seenAll.chs.add(c.id);
    saveSeen();
    invalidateWatched();
    renderSide();
    route();
    if (was) toast(`${c.name}'s watched mark is cleared.`);
    else toast(`Marked every ${c.name} video as watched.`, "Undo", () => {
      seenAll.chs.delete(c.id); saveSeen(); invalidateWatched(); renderSide(); route();
    });
  }

  // Shared by the star buttons and the 1-5 keyboard shortcut on channel pages.
  function setRating(c, n) {
    const prev = ratings[c.id];
    if (prev === n) delete ratings[c.id]; else ratings[c.id] = n;
    saveRatings();
    main.querySelectorAll("#stars button").forEach(x => x.classList.toggle("lit", +x.dataset.rate <= (ratings[c.id] || 0)));
    const refreshBadge = () => {
      const rowEl = $(`#chList .item[data-route="c/${c.i}"]`);
      if (!rowEl) return;
      const badge = rowEl.querySelector(".ratebadge");
      if (ratings[c.id]) {
        if (!badge) { const el = document.createElement("span"); el.className = "ratebadge"; rowEl.insertBefore(el, rowEl.querySelector(".eye")); el.textContent = "★" + ratings[c.id]; }
        else badge.textContent = "★" + ratings[c.id];
      } else if (badge) badge.remove();
    };
    refreshBadge();
    toast(ratings[c.id] ? `Rated ${c.name} ${ratings[c.id]} stars.` : `Rating cleared for ${c.name}.`, "Undo", () => {
      if (prev) ratings[c.id] = prev; else delete ratings[c.id];
      saveRatings();
      main.querySelectorAll("#stars button").forEach(x => x.classList.toggle("lit", +x.dataset.rate <= (ratings[c.id] || 0)));
      refreshBadge();
    });
    return ratings[c.id] || 0;
  }

  function viewCat(id) {
    buildCategories();
    const def = catDef(id);
    const hidden = hiddenCat.has(id);
    const chs = CH.filter(c => catOfCh[c.i] === id);
    const shown = chs.filter(c => !hiddenCh.has(c.id));
    const total = shown.reduce((n, c) => n + byChannel[c.i].length, 0);
    const st = catVideoStats(shown).get(id);
    const unread = st ? st.unread : 0;
    main.innerHTML = `<div class="chhead">
      <div style="min-width:0">
        <h1>${esc(def.name)}</h1>
        <div class="sub">${fmtNum(shown.length)} channel${shown.length === 1 ? "" : "s"} · ${fmtNum(total)} videos${unread && unread < total ? ` · ${fmtNum(unread)} unwatched` : ""}${hidden ? " · hidden from your feeds" : ""}</div>
        <div class="blurb">Grouped from each channel's name, description and recent video titles — a keyword classifier with idf weighting, not a hand-kept list.</div>
        <div class="actions">
          <button class="pill${hidden ? " primary" : ""}" data-hidecat="${id}">${hidden ? "Show category" : "Hide category"}</button>
          <button class="pill" id="markCat">${seenAll.cats.has(id) ? "Clear watched mark" : "Mark all watched"}</button>
        </div>
      </div></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    $("#markCat", main).onclick = () => toggleSeenCat(id);
    const items = interleave(shown.map(c => byChannel[c.i].filter(v => !hiddenVid.has(v.id))));
    let pos = 0;
    const grid = infiniteGrid(feed, n => items.slice(pos, pos += n), {
      empty: "No channels landed in this category.",
      watched: watchedSet(),
    });
    document.title = def.name + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid.stop();
  }

  // 1,478 channels: render a slice, let the filter box reach the rest.
  function renderChannelList(term) {
    const q = term.trim().toLowerCase();
    const hits = q ? CH.filter(c => c.name.toLowerCase().includes(q)) : CH.slice().sort((a, b) => b.n - a.n);
    const shown = hits.slice(0, q ? 150 : 40);
    const row = c => `<div class="item${chOff(c) ? " off" : ""}" data-href="#/c/${c.i}" data-route="c/${c.i}">${avatar(c)}<span class="name">${esc(c.name)}</span><span class="cnt">${fmtNum(c.n)}</span>${ratings[c.id] ? `<span class="ratebadge">★${ratings[c.id]}</span>` : ""}<button class="eye" data-hidech="${c.i}" title="${chOff(c) ? "Show" : "Hide"} ${esc(c.name)}" aria-label="${chOff(c) ? "Show" : "Hide"} channel">${chOff(c) ? eyeOff : eyeOpen}</button></div>`;
    let h = shown.map(row).join("");
    if (!shown.length) h = `<div class="sideempty">No channel matches that.</div>`;
    else if (hits.length > shown.length) h += `<div class="sideempty">${fmtNum(hits.length - shown.length)} more — type to narrow</div>`;
    $("#chList").innerHTML = h;
    markSide(routeFromHash());
  }

  /* ---------- home ---------- */
  let cleanup = () => {};
  const sorts = [["foryou", "For you"], ["latest", "Latest"], ["popular", "Popular"], ["shuffled", "Shuffled"]];

  // Round-robin across channels keeps big channels from burying the small ones.
  function interleave(lists) {
    const out = [];
    const max = Math.max(0, ...lists.map(l => l.length));
    for (let i = 0; i < max; i++) for (const l of lists) if (i < l.length) out.push(l[i]);
    return out;
  }

  function viewHome() {
    let chFilter = null;
    let sort = history.length ? "foryou" : "latest";
    const recent = history.slice(-10).reverse().map(h => byId.get(h.id)).filter(v => v && !vOff(v));
    main.innerHTML = `
      <div class="chips" id="chChips">
        <button class="chip on" data-c="all">All channels</button>
        ${CH.slice().sort((a, b) => b.n - a.n).slice(0, 15).map(c => `<button class="chip${chOff(c) ? " off" : ""}" data-c="${c.i}"${chOff(c) ? ' title="Hidden"' : ""}>${avatar(c)}${esc(c.name)}</button>`).join("")}
      </div>
      <div class="chips" id="sortChips">
        ${sorts.map(([k, label]) => `<button class="chip${k === sort ? " on" : ""}" data-s="${k}">${label}</button>`).join("")}
      </div>
      ${recent.length ? `<h2 class="shelfhead">Continue watching</h2><div class="shelf">${recent.map(v => mini(v, whyFor(v.id))).join("")}</div>` : ""}
      <div id="shelves"></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    const shelfHost = $("#shelves", main);
    let grid = null;

    const drawShelves = () => {
      shelfHost.replaceChildren();
      _why.clear();   // reasons belong to this render only
      if (sort !== "foryou" || chFilter != null || !history.length) return;
      const list = homeShelves(chFilter);
      if (!list.length) return;
      shelfHost.innerHTML = list.map(s => `<section class="shelfwrap" data-shelf="${esc(s.id)}">
        <h2 class="shelfhead">${esc(s.title)}<span class="shelfnote">${esc(s.note)}</span></h2>
        <div class="shelf">${s.items.map(v => mini(v, whyFor(v.id))).join("")}</div>
      </section>`).join("");
      for (const s of list) shelfImpression(s.id);
    };

    const list = () => {
      const chs = (chFilter == null ? CH : [CH[chFilter]]).filter(c => !chOff(c));
      if (sort === "foryou") return forYou(chs);
      const pool = chs.flatMap(c => byChannel[c.i]).filter(v => !vOff(v));
      if (sort === "popular") return pool.sort((a, b) => (b.views || 0) - (a.views || 0));
      if (sort === "shuffled") return shuffle(pool);
      return interleave(chs.map(c => byChannel[c.i])).filter(v => !vOff(v)); // each channel is newest-first
    };
    const rebuild = () => {
      grid && grid.stop();
      feed.replaceChildren();
      if (sort === "foryou") {
        const note = document.createElement("div");
        note.className = "feednote";
        if (history.length) {
          const p = profile();
          const learned = ranker ? `learned ranker (${fmtNum(ranker.pairs)} pairs)` : "hand-tuned weights";
          note.innerHTML = `Ranked from ${fmtNum(p.watched.size)} watched videos · topic vectors + channel graph + ${learned} · <button id="tuneRec">Tune</button> · <button id="resetRec">Reset</button>`;
          note.querySelector("#tuneRec").onclick = openReco;
          note.querySelector("#resetRec").onclick = () => {
            history = [];
            store.set("history", history);
            negIds.clear();
            saveNeg();
            invalidateReco();
            toast("Recommendations reset.");
            rebuild();
            drawShelves();
          };
        } else {
          note.textContent = "Watch a few videos and this feed starts ranking by the topics and channels you actually watch.";
        }
        feed.append(note);
      }
      const items = list();
      let pos = 0;
      grid = infiniteGrid(feed, n => items.slice(pos, pos += n), { empty: "Nothing to show — every channel in this view is hidden." });
    };
    main.querySelectorAll("#chChips .chip").forEach(b => b.onclick = () => {
      chFilter = b.dataset.c === "all" ? null : +b.dataset.c;
      main.querySelectorAll("#chChips .chip").forEach(x => x.classList.toggle("on", x === b));
      drawShelves();
      rebuild();
    });
    main.querySelectorAll("#sortChips .chip").forEach(b => b.onclick = () => {
      sort = b.dataset.s;
      main.querySelectorAll("#sortChips .chip").forEach(x => x.classList.toggle("on", x === b));
      drawShelves();
      rebuild();
    });
    drawShelves();   // first, so the grid's "why this" lines are not cleared afterwards
    rebuild();
    document.title = "My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid && grid.stop();
  }

  /* ---------- channel ---------- */
  function viewChannel(i) {
    const c = CH[i];

    let order = "newest";
    main.innerHTML = `<div class="chhead">${avatar(c, "xl")}
      <div style="min-width:0">
        <h1>${esc(c.name)}</h1>

        ${c.desc ? `<div class="blurb">${esc(c.desc)}</div>` : ""}
        <div class="actions">

    const rebuild = () => {

      if (order === "popular") items.sort((a, b) => (b.views || 0) - (a.views || 0));
      else if (order === "shuffled") shuffle(items);
      let pos = 0;
      grid = infiniteGrid(feed, n => items.slice(pos, pos += n), { showChannel: false, empty: "No videos listed for this channel." });
    };
    main.querySelectorAll(".chips .chip").forEach(b => b.onclick = () => {
      order = b.dataset.o;
      main.querySelectorAll(".chips .chip").forEach(x => x.classList.toggle("on", x === b));
      rebuild();
      window.scrollTo({ top: 0 });
    });
    const rail = $("#chRail", main);
    if (rail) {
      const nbs = neighboursOfChannel(i, 10);
      if (nbs.length) {
        rail.innerHTML = `<h2 class="shelfhead">Similar channels<span class="shelfnote">channels that publish about the same things</span></h2>
          <div class="shelf">${nbs.map(([n, s]) => chCard(n, s)).join("")}</div>`;
      }
    }
    rebuild();
    document.title = c.name + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid && grid.stop();
  }

  /* ---------- search ---------- */
  function viewSearch(q) {
    $("#q").value = q;
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const score = v => {
      const title = v.title.toLowerCase();
      const channel = CH[v.ch].name.toLowerCase();
      const inTitle = terms.every(t => title.includes(t));
      const hits = terms.filter(t => title.includes(t)).length;
      return (inTitle ? 4 : 0) + hits + (terms.every(t => channel.includes(t)) ? 2 : 0);
    };
    const hits = V
      .filter(v => !vOff(v) && (() => { const hay = v.title.toLowerCase() + " " + CH[v.ch].name.toLowerCase(); return terms.every(t => hay.includes(t)); })())
      .sort((a, b) => score(b) - score(a) || (b.views || 0) - (a.views || 0));
    main.innerHTML = `<h2 class="pagetitle">${fmtNum(hits.length)} result${hits.length === 1 ? "" : "s"} for “${esc(q)}”</h2><div class="feed"></div>`;
    let pos = 0;
    const grid = infiniteGrid($(".feed", main), n => hits.slice(pos, pos += n), { empty: "No videos matched that search." });
    document.title = q + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid.stop();
  }

  /* ---------- watch ---------- */
  let ytReady = null;
  let player = null;
  let upNext = [];
  let autoplay = (() => { try { return localStorage.getItem("jeetube-autoplay") !== "0"; } catch { return true; } })();
  if (typeof window.onYouTubeIframeAPIReady === "undefined") window.onYouTubeIframeAPIReady = null;

  function loadYT() {
    if (!ytReady) {
      ytReady = new Promise(resolve => {
        window.onYouTubeIframeAPIReady = resolve;
        const s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.append(s);
      });
    }
    return ytReady;
  }

  function playNext() {
    const v = upNext[0];
    if (v) location.hash = `#/watch/${v.id}`;
  }

  function viewWatch(id) {
    const v = byId.get(id);
    if (!v) { main.innerHTML = `<div class="empty">Video not found.</div>`; return; }
    const c = CH[v.ch];
    const playbackMode = Backend.modeSync();
    remember(v);
    upNext = similarTo(v, 15);
    const prof = profile();
    const whyUp = new Map();
    for (const x of upNext) if (x.ix != null) whyUp.set(x.id, explain(x.ix, prof));

    const ytUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`;
    const isExternal = playbackMode === 'external_youtube';
    const truthNote = isExternal
      ? `<div class="desc" style="margin-top:10px;border-left:3px solid var(--accent,#2563eb);padding-left:10px"><strong>External playback:</strong> Opens in your browser/YouTube profile. My Tube records that you opened it here (initiation only). It <strong>cannot</strong> confirm or sync your YouTube account watch history.</div>`
      : `<div class="desc" style="margin-top:10px;border-left:3px solid var(--border,#ddd);padding-left:10px">Embedded playback uses the YouTube player. My Tube records its own watch history when the backend is available; YouTube account history is managed separately by YouTube.</div>`;

    main.innerHTML = `<div class="watch">
      <div class="primary">
        ${isExternal
          ? `<div class="player" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center"><div style="font-size:18px;font-weight:600">Open on YouTube</div><div style="color:var(--muted,#666);max-width:560px">This video will open in your browser so YouTube can use your account/profile there. My Tube will record the open action, but not confirmed YouTube watch history.</div><button class="pill primary" id="openYtBtn">Open on YouTube ↗</button></div>`
          : `<div class="player"><div id="ytplayer"></div></div>`}
        <h1>${esc(v.title)}</h1>
        <div class="chrow">${avatar(c, "lg")}
          <div style="min-width:0">
            <a class="nm" href="#/c/${c.i}">${esc(c.name)}</a>
            <div class="cnt">${c.subs ? fmtNum(c.subs) + " subscribers" : fmtNum(c.n) + " videos"}</div>
          </div>
          <div class="actions">
            <button class="pill primary" id="nextBtn" title="Next video (Shift+N)">Next video ⏭</button>
            <a class="pill" href="${ytUrl}" target="_blank" rel="noopener" id="ytDirectLink">YouTube ↗</a>
            <button class="pill" data-course="${c.i}" data-video="${v.id}">＋ Course</button>
            <button class="pill" data-hidevid="${v.id}">Hide</button>
            <button class="pill${negIds.has(v.id) ? " primary" : ""}" data-notint="${v.id}">${negIds.has(v.id) ? "Not interested ✓" : "Not interested"}</button>
          </div>
        </div>
        <div class="desc">
          <div class="stats">${[fmtViews(v.views), v.dur ? fmtDur(v.dur) : ""].filter(Boolean).join(" · ") || "—"}</div>
          <div class="tagline">${esc(c.name)}${c.desc ? " · " + esc(c.desc) : ""}</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <label style="display:inline-flex;gap:8px;align-items:center"><span>Playback mode</span>
            <select id="playbackModeSel">
              <option value="embedded"${!isExternal ? ' selected' : ''}>Embedded (track in My Tube)</option>
              <option value="external_youtube"${isExternal ? ' selected' : ''}>Open on YouTube (initiation only)</option>
            </select>
          </label>
        </div>
        ${truthNote}
      </div>
      <aside class="secondary">
        <h3>Up next</h3>
        <label class="autoplay"><input type="checkbox" id="autoplayBox" ${autoplay ? "checked" : ""}> Autoplay next video</label>
        ${upNext.map(x => mini(x, whyUp.get(x.id) || "")).join("")}
      </aside>
    </div>`;

    $("#nextBtn").onclick = playNext;
    $("#autoplayBox").onchange = e => {
      autoplay = e.target.checked;
      try { localStorage.setItem("jeetube-autoplay", autoplay ? "1" : "0"); } catch {}
    };
    const modeSel = $("#playbackModeSel");
    if (modeSel) modeSel.onchange = async e => {
      const m = e.target.value;
      store.set('playback-mode', m);
      await Backend.setPlaybackMode(m);
      viewWatch(id);
    };
    document.title = v.title + " - My Tube";
    window.scrollTo(0, 0);

    let ended = false;
    let progressTimer = null;
    const sessionId = Backend.sid();
    Backend.sessions.set(id, { id: sessionId, source: isExternal ? 'external_youtube' : 'embedded', lastPos: 0, lastSent: Date.now() });

    async function startBackendSession(source) {
      // Best-effort: requires backend + known video in library. Failure preserves local behavior.
      const r = await Backend.historyStart(id, source, sessionId, 0);
      if (r && r.session_id) { Backend.sessions.get(id).id = r.session_id; }
    }

    if (isExternal) {
      const openBtn = $("#openYtBtn");
      const openExternal = async () => {
        await startBackendSession('external_youtube'); // initiation recorded; NOT confirmed YouTube history
        window.open(ytUrl, '_blank', 'noopener');
        toast('Opened on YouTube. My Tube recorded initiation only (no confirmed YouTube sync).');
      };
      if (openBtn) openBtn.onclick = openExternal;
      // clicking the direct link also records initiation
      const direct = $("#ytDirectLink");
      if (direct) direct.addEventListener('click', () => { startBackendSession('external_youtube'); });
      cleanup = () => {
        try { /* no player */ } catch {}
        Backend.sessions.delete(id);
      };
      return;
    }

    // Embedded mode
    startBackendSession('embedded');
    loadYT().then(() => {
      if (location.hash !== `#/watch/${id}`) return;
      player = new YT.Player("ytplayer", {
        videoId: id,
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onStateChange: e => {
            if (e.data === YT.PlayerState.PLAYING) {
              if (!progressTimer) progressTimer = setInterval(() => {
                try {
                  if (!player || !player.getCurrentTime) return;
                  const secs = player.getCurrentTime() || 0;
                  const st = Backend.sessions.get(id);
                  if (st && st.id) Backend.historyProgress(st.id, { position_s: secs, watched_delta_s: 5 });
                } catch {}
              }, 5000);
            }
            if (e.data === YT.PlayerState.ENDED) {
              ended = true;
              rememberEngagement(id, 0, true);
              if (autoplay) playNext();
            }
          },
        },
      });
    });
    cleanup = () => {
      let secs = 0;
      try { if (player && player.getCurrentTime) secs = player.getCurrentTime() || 0; } catch {}
      if (progressTimer) try { clearInterval(progressTimer); } catch {}
      rememberEngagement(id, secs, ended);
      try { player && player.destroy(); } catch {}
      player = null;
      Backend.sessions.delete(id);
    };
  }

  /* ---------- backup: export / import ----------
     Everything that makes the app yours lives in a handful of mytube-* keys. Export
     serialises them to one JSON file; import validates the shape, replaces the current
     state, and keeps an Undo of whatever was there before. */
  const STATE_KEYS = ["hidden-ch", "hidden-vid", "hidden-cat", "cat-ov", "ratings", "courses", "history", "seen", "neg"];
  const emptyFor = k => (k === "cat-ov" || k === "ratings" || k === "seen") ? {} : [];
  const snapshotState = () => {
    const s = {};
    for (const k of STATE_KEYS) s[k] = store.get(k, emptyFor(k));
    return s;
  };
  function exportState() {
    const payload = { mytube: 1, exportedAt: new Date().toISOString(), state: snapshotState() };
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "mytube-backup.json";
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded your backup — hidden items, category moves, star ratings, courses and history.");
  }
  async function migrateToBackend() {
    // Phase 6: explicit, opt-in, non-destructive. Sends local My Tube state to backend;
    // backend applies only entities it knows. Never confirms YouTube account history.
    const s = snapshotState();
    const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
    const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    const seenRaw = obj(s["seen"]);
    const clean = {
      "hidden-ch": strArr(s["hidden-ch"]),
      "hidden-vid": strArr(s["hidden-vid"]),
      "hidden-cat": strArr(s["hidden-cat"]),
      "cat-ov": Object.fromEntries(Object.entries(obj(s["cat-ov"])).filter(([, v]) => typeof v === "string")),
      "ratings": Object.fromEntries(Object.entries(obj(s["ratings"])).filter(([, v]) => Number.isInteger(v) && v >= 1 && v <= 5)),
      "courses": (Array.isArray(s["courses"]) ? s["courses"] : [])
        .filter(c => c && typeof c.name === "string" && Array.isArray(c.videos))
        .map(c => ({ id: typeof c.id === "string" ? c.id : ("c" + Date.now().toString(36)), name: c.name, videos: c.videos.filter(x => typeof x === "string") })),
      "history": (Array.isArray(s["history"]) ? s["history"] : [])
        .filter(h => h && typeof h.id === "string")
        .map(h => ({ id: h.id, ch: Number.isInteger(h.ch) ? h.ch : 0, t: typeof h.t === "number" ? h.t : 0 })),
      "seen": { cats: strArr(seenRaw.cats), chs: strArr(seenRaw.chs) },
      "neg": strArr(s["neg"]),
    };
    try {
      const r = await Backend.api('/user/state', { method: 'POST', body: JSON.stringify(clean) });
      if (!r) { toast("Backend unavailable — local data unchanged."); return; }
      const a = (r && r.applied) || {};
      const parts = [];
      if (a.history) parts.push(`${a.history} history`);
      if (a["hidden-ch"]) parts.push(`${a["hidden-ch"]} hidden channels`);
      if (a.ratings) parts.push(`${a.ratings} ratings`);
      if (a.courses) parts.push(`${a.courses} courses`);
      toast(`Sent local data to backend (${parts.join(", ") || "done"}). Applies only items the backend library knows; local data unchanged; YouTube account history not confirmed.`);
    } catch (e) {
      toast("Migration failed — local data unchanged.");
    }
  }
  function applyState(state) {
    const prev = snapshotState();
    hiddenCh.clear(); for (const id of state["hidden-ch"]) hiddenCh.add(id);
    hiddenVid.clear(); for (const id of state["hidden-vid"]) hiddenVid.add(id);
    hiddenCat.clear(); for (const id of state["hidden-cat"]) hiddenCat.add(id);
    Object.keys(catOv).forEach(k => delete catOv[k]); Object.assign(catOv, state["cat-ov"]);
    ratings = { ...state["ratings"] };
    courses = state["courses"];
    history = state["history"];
    seenAll = { cats: new Set(state["seen"].cats), chs: new Set(state["seen"].chs) };
    negIds = new Set(Array.isArray(state["neg"]) ? state["neg"] : []);
    saveHidden(); saveCatOv(); saveRatings(); saveCourses(); saveSeen(); saveNeg();
    store.set("history", history);
    rebucket();
    invalidateWatched();
    renderSide();
    route();
    return prev;
  }
  function importState(file) {
    file.text().then(text => {
      let payload;
      try { payload = JSON.parse(text); } catch { toast("That file isn't valid JSON — nothing changed."); return; }
      if (!payload || payload.mytube !== 1 || !payload.state || typeof payload.state !== "object") {
        toast("That doesn't look like a My Tube backup — nothing changed."); return;
      }
      const s = payload.state;
      const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
      const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
      const seenRaw = obj(s["seen"]);
      const clean = {
        "hidden-ch": strArr(s["hidden-ch"]),
        "hidden-vid": strArr(s["hidden-vid"]),
        "hidden-cat": strArr(s["hidden-cat"]),
        "cat-ov": Object.fromEntries(Object.entries(obj(s["cat-ov"])).filter(([, v]) => typeof v === "string")),
        "ratings": Object.fromEntries(Object.entries(obj(s["ratings"])).filter(([, v]) => Number.isInteger(v) && v >= 1 && v <= 5)),
        "courses": (Array.isArray(s["courses"]) ? s["courses"] : [])
          .filter(c => c && typeof c.name === "string" && Array.isArray(c.videos))
          .map(c => ({ ...c, id: typeof c.id === "string" ? c.id : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), videos: c.videos.filter(x => typeof x === "string") })),
        "history": (Array.isArray(s["history"]) ? s["history"] : [])
          .filter(h => h && typeof h.id === "string")
          .map(h => ({ id: h.id, ch: Number.isInteger(h.ch) ? h.ch : 0, t: typeof h.t === "number" ? h.t : 0 })),
        "seen": { cats: strArr(seenRaw.cats), chs: strArr(seenRaw.chs) },
        "neg": strArr(s["neg"]),
      };
      const prev = applyState(clean);
      const parts = [];
      if (clean["hidden-ch"].length) parts.push(`${clean["hidden-ch"].length} hidden channels`);
      if (clean["hidden-vid"].length) parts.push(`${clean["hidden-vid"].length} hidden videos`);
      if (clean["hidden-cat"].length) parts.push(`${clean["hidden-cat"].length} hidden categories`);
      if (Object.keys(clean["cat-ov"]).length) parts.push(`${Object.keys(clean["cat-ov"]).length} category moves`);
      if (Object.keys(clean["ratings"]).length) parts.push(`${Object.keys(clean["ratings"]).length} ratings`);
      if (clean["courses"].length) parts.push(`${clean["courses"].length} courses`);
      if (clean["history"].length) parts.push(`${clean["history"].length} history entries`);
      if (clean["seen"].cats.length || clean["seen"].chs.length) parts.push("watched marks");
      if (clean["neg"].length) parts.push(`${clean["neg"].length} not-interested marks`);
      toast(`Imported ${parts.join(", ") || "an empty backup"}.`, "Undo", () => applyState(prev));
    }).catch(() => toast("Couldn't read that file — nothing changed."));
  }

  /* ---------- ranking controls ---------- */
  let rerankTimer = 0;
  function scheduleRerank() {

      const onForYou = (($("#sortChips .chip.on") || {}).textContent || "") === "For you";

  function renderRecoBody() {
    const body = $("#recoBody");

    const row = (id, label, val, min, max, step, hint) => `<div class="tunerow">

    const learned = ranker
      ? `Trained on ${fmtNum(ranker.pairs)} pairs · log-loss ${ranker.loss} · ${new Date(ranker.at).toLocaleDateString()}`

      + row("tSer", "Serendipity", reco.serendipity + "%", 0, 100, 10,
        "How far the feed reaches outside your comfort zone. At 0% it stays strictly on-topic and a channel may appear three times in a row; at 100% it enforces one video per channel and boosts channels you have never watched.")
      + `<div class="presets">${[["Balanced", 60, 90, 30, 30], ["Topic first", 0, 120, 30, 25],
        ["Channel first", 160, 180, 60, 15], ["This week only", 60, 14, 30, 45]]

      + `<div class="tunerow"><label>Learned ranker <b>${ranker ? "on" : "off"}</b></label>

    const bind = (id, key, suffix) => {

  function renderPickList() {

    const term = (picker.term || "").trim().toLowerCase();
    const base = picker.channel === "" ? V : byChannel[+picker.channel] || [];
    const pool = term
      ? base.filter(v => v.title.toLowerCase().includes(term) || CH[v.ch].name.toLowerCase().includes(term))
      : base;
    const shown = pool.slice(0, 60);
    list.innerHTML = shown.length
      ? shown.map(v => `<label class="pickrow">
          <input type="checkbox" data-pick="${v.id}" ${picker.selected.has(v.id) ? "checked" : ""}>
          <img src="${thumbURL(v.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <span class="t">${esc(v.title)}</span>
          <span class="c">${esc(CH[v.ch].name)}</span>
        </label>`).join("")
        + (pool.length > shown.length ? `<div class="sideempty">${fmtNum(pool.length - shown.length)} more — type to narrow</div>` : "")
      : `<div class="sideempty" style="padding:14px 2px">No videos match.</div>`;
    updatePickCount();
  }

  function updatePickCount() {
    const n = picker ? picker.selected.size : 0;
    const el = $("#cmCount");
    if (el) el.textContent = `${fmtNum(n)} selected`;
  }

  function openCourseModal(course, opts = {}) {
    picker = {
      course: course || null,
      selected: new Set(course ? course.videos : []),
      channel: opts.channel != null ? String(opts.channel) : "",
      term: "",
    };

    $("#cmSave").textContent = course ? "Save changes" : "Create course";
    $("#cmBody").innerHTML = `
      <input id="cmName" type="text" maxlength="80" autocomplete="off" placeholder="Course name — e.g. Linear algebra from scratch" value="${course ? esc(course.name) : ""}">

        <input id="cmSearch" type="search" autocomplete="off" placeholder="Search videos to add">
        <select id="cmChannel" aria-label="Filter videos by channel">
          <option value="">All channels</option>

    $("#cmNone").onclick = () => {
      picker.selected.clear();
      document.querySelectorAll("#cmList [data-pick]").forEach(b => { b.checked = false; });

  function closeCourseModal() {
    $("#courseModal").hidden = true;
    picker = null;
  }

  function saveCourseFromModal() {
    if (!picker) return;
    const name = $("#cmName").value.trim();
    if (!name) { $("#cmName").focus(); toast("Give the course a name first."); return; }
    const videos = [...picker.selected];
    let target = picker.course;
    const created = !target;
    if (target) { target.name = name; target.videos = videos; }
    else { target = { id: newCourseId(), name, videos, created: Date.now() }; courses.push(target); }
    saveCourses();
    closeCourseModal();
    renderCourses();
    if (created) location.hash = `#/course/${target.id}`;
    else if (location.hash === `#/course/${target.id}`) route();
    toast(`“${target.name}” ${created ? "created" : "saved"} — ${fmtNum(videos.length)} video${videos.length === 1 ? "" : "s"}.`);
  }

  function viewCourse(id) {
    const course = courses.find(c => c.id === id);
    if (!course) {
      main.innerHTML = `<div class="empty">Course not found. <a class="link" href="#/">Back to All videos</a></div>`;
      document.title = "Course - My Tube";
      return;
    }
    const { vids, done, hours, pct } = courseStats(course);
    const time = hours >= 1 ? `${Math.round(hours)} hours` : `${Math.round(hours * 60)} minutes`;
    main.innerHTML = `<div class="chhead">
      <div style="min-width:0">
        <h1>${esc(course.name)}</h1>
        <div class="sub">${fmtNum(vids.length)} videos · ${time} · ${done} watched (${pct}%)</div>
        <div class="coursebar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Course progress"><div style="width:${pct}%"></div></div>
        <div class="actions">
          <button class="pill primary" id="addVids">＋ Add videos</button>
          <button class="pill" id="editCourse">Edit course</button>
          <button class="pill" id="deleteCourse">Delete</button>
        </div>
      </div></div>
      <div class="feed"></div>`;
    const feed = $(".feed", main);
    let grid = null;
    const build = () => {
      grid && grid.stop();
      feed.replaceChildren();
      let pos = 0;
      grid = infiniteGrid(feed, n => vids.slice(pos, pos += n), {
        empty: "No videos in this course yet — use “Add videos” to pull them from any channel.",
        watched: watchedSet(),
      });
    };
    $("#addVids").onclick = () => openCourseModal(course);
    $("#editCourse").onclick = () => openCourseModal(course);
    $("#deleteCourse").onclick = () => {
      if (!confirm(`Delete “${course.name}”?`)) return;
      const backup = courses;
      courses = courses.filter(c => c.id !== course.id);
      saveCourses();
      location.hash = "#/";
      renderCourses();
      toast("Course deleted.", "Undo", () => { courses = backup; saveCourses(); renderCourses(); });
    };
    build();
    document.title = course.name + " - My Tube";
    window.scrollTo(0, 0);
    cleanup = () => grid && grid.stop();
  }

  /* ---------- intelligence workspace (My Tube 3.0) ---------- */
  const intelBase = "/api/v1";
  const intelFmtTime = s => {
    if (s == null) return "";
    const t = Math.max(0, Math.round(Number(s)));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
  };
  const intelVideo = (id, title) => {
    const label = esc(title || id || "video");
    return /^[\w-]{11}$/.test(id || "") ? `<a href="#/watch/${esc(id)}" title="Play in My Tube">${label}</a>` : label;
  };
  async function intelFetch(path, opts) {
    if (!(await Backend.ping())) return { error: "offline" };
    try {
      const r = await fetch(intelBase + path, Object.assign({ cache: "no-store", headers: { "Content-Type": "application/json" } }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return { error: (data && data.detail) || `HTTP ${r.status}` };
      return data;
    } catch (err) { return { error: String(err && err.message || err) }; }
  }
  function intelOffline(what) {
    return `<div class="intel"><div class="inteloffline intelcard"><h1>${esc(what)} needs the local backend</h1>
      <p class="intelmuted">The standalone library still works. Start the backend to unlock local knowledge, search and AI features. Nothing is uploaded.</p>
      <p class="intelmuted"><code>cd backend && python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8010</code></p>
      <p class="intelmuted">Then open this site from the same machine, or point the frontend at the loopback API. AI, embeddings and transcription remain optional.</p></div></div>`;
  }
  function intelShell(title, subtitle, body, actions) {
    return `<div class="intel"><div class="intelhead"><div><h1>${esc(title)}</h1><p>${subtitle || ""}</p></div>${actions ? `<div class="intelactions">${actions}</div>` : ""}</div>${body}</div>`;
  }
  function intelError(result) {
    return `<div class="intelcard"><span class="intelbadge bad">Error</span> <span class="intelmuted">${esc(result && result.error || "request failed")}</span></div>`;
  }
  function intelEmpty(title, body) {
    return `<div class="intelcard"><h2>${esc(title)}</h2><p class="intelmuted">${body || ""}</p></div>`;
  }

  function viewAsk() {
    main.innerHTML = intelShell(
      "Ask My Tube",
      "Answers are built only from stored transcripts, extracted knowledge and video metadata in your subscription library. Every claim is cited. Without a local model you get extractive evidence, not invented prose.",
      `<div class="intelcard">
        <form id="askForm" class="intelrow">
          <input id="askQ" class="grow" type="text" placeholder="e.g. How do different creators explain convolution?" autocomplete="off" required>
          <button class="pill primary" id="askGo" type="submit">Ask</button>
          <label class="intelmuted"><input id="askLlm" type="checkbox"> use local LLM</label>
        </form>

      const cites = (res.citations || []).map(c => `<div class="intelcite">

        ${c.timestamp_s != null ? ` · ${intelFmtTime(c.timestamp_s)}` : ""} · relevance ${esc(c.relevance_label || "")}</span>
        <q>${esc(c.excerpt)}</q>
        <div class="meta intelmuted">source: ${esc(c.source_kind)} · retrieval: ${esc((c.methods || []).join(", "))}</div>
      </div>`).join("");
      const notes = (res.notes || []).map(n => `<li>${esc(n)}</li>`).join("");
      out.innerHTML = `<div class="intelcard">
        <div class="intelrow" style="justify-content:space-between"><h2 style="margin:0">Answer</h2><span class="intelbadge ${res.mode === "llm" ? "ok" : ""}">${esc(res.mode)}</span></div>
        <div class="intelanswer">${esc(res.answer)}</div>
        ${notes ? `<ul class="intelmuted">${notes}</ul>` : ""}
        <div class="intelrow" style="margin-top:10px"><button class="pill" id="saveAnswer">Save as research note</button></div>
      </div>
      <div class="intelcard"><h2>Evidence <span class="intelmuted">(${(res.citations || []).length} sources)</span></h2>${cites || `<p class="intelmuted">The library does not contain enough evidence. Nothing was invented.</p>`}</div>`;

        save.disabled = false;

  function viewGraph() {
    main.innerHTML = intelShell(
      "Knowledge Graph",
      "Concepts, videos and channels come from stored extraction. Edge provenance and confidence are kept; nothing is inferred without evidence. Click any node to see why it is connected.",
      `<div class="intelcard">
        <div class="intelrow">
          <input id="kgSearch" class="grow" type="search" placeholder="Search nodes (concept, video, channel)…" autocomplete="off">
          <label class="intelmuted"><input id="kgVideos" type="checkbox" checked> include videos</label>
          <label class="intelmuted"><input id="kgCollections" type="checkbox"> collections</label>
          <select id="kgWatched"><option value="">watched + unwatched</option><option value="true">watched only</option><option value="false">unwatched only</option></select>
          <button class="pill" id="kgReload">Refresh</button>
        </div>
        <div class="kgwrap" style="margin-top:12px">
          <div><div class="kgcanvas" id="kgCanvas"><div class="empty">Loading graph…</div></div>
            <div class="kglegend"><span><i style="background:#ff6b6b"></i>concept</span><span><i style="background:#7cc4ff"></i>video</span><span><i style="background:#3fb950"></i>channel</span><span><i style="background:#f6c945"></i>collection</span><span>line opacity = confidence · labels truncate at small sizes</span></div>
          </div>
          <div class="intelpane" id="kgDetail"><h3>Node details</h3><p class="intelmuted">Pick a concept to see its videos and relationships.</p></div>
        </div>
      </div>`
    );
    const canvas = $("#kgCanvas"), detail = $("#kgDetail");
    let graph = null;
    const load = async () => {
      canvas.innerHTML = `<div class="empty">Loading graph…</div>`;
      const q = ["limit=220"];
      if (!$("#kgVideos").checked) q.push("include_videos=false");
      if ($("#kgCollections").checked) q.push("include_collections=true");
      if ($("#kgWatched").value) q.push("watched=" + $("#kgWatched").value);
      const res = await intelFetch("/graph?" + q.join("&"));
      if (res.error === "offline") { main.innerHTML = intelOffline("Knowledge Graph"); return; }
      if (res.error) { canvas.innerHTML = intelError(res); return; }
      graph = res;
      render();
    };
    const render = () => {
      if (!graph) return;
      const nodes = graph.nodes || [], edges = graph.edges || [];
      if (!nodes.length) { canvas.innerHTML = `<div class="empty">No graph yet. Ingest a transcript and extract knowledge for at least one video.</div>`; return; }
      const W = 1000, H = 620, cx = W / 2, cy = H / 2;
      const groups = { concept: [], video: [], channel: [], collection: [] };
      nodes.forEach(n => (groups[n.type] || groups.video).push(n));
      const pos = {};
      const ring = (arr, radius) => arr.forEach((n, i) => {
        const a = (i / Math.max(1, arr.length)) * Math.PI * 2 - Math.PI / 2;
        pos[n.id] = [cx + Math.cos(a) * radius * 0.62, cy + Math.sin(a) * radius];
      });
      ring(groups.concept, 250);
      ring(groups.video, 330);
      ring(groups.channel, 360);
      ring(groups.collection, 390);
      const colors = { concept: "#ff6b6b", video: "#7cc4ff", channel: "#3fb950", collection: "#f6c945" };
      const degree = {};
      edges.forEach(e => { degree[e.source] = (degree[e.source] || 0) + 1; degree[e.target] = (degree[e.target] || 0) + 1; });
      const s = [];
      s.push(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Knowledge graph">`);
      edges.forEach(e => {
        const a = pos[e.source], b = pos[e.target];
        if (!a || !b) return;
        const op = Math.max(0.08, Math.min(0.55, Number(e.confidence || 0.2) * 0.6));
        s.push(`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#808080" stroke-width="1" opacity="${op}"><title>${esc(e.relation)} — ${esc(e.explanation || "")} (${Math.round(Number(e.confidence || 0) * 100)}%)</title></line>`);
      });
      nodes.forEach(n => {
        const p = pos[n.id]; if (!p) return;
        const r = Math.min(16, 5 + Math.sqrt(degree[n.id] || 1) * 1.8);
        const label = String(n.label || "").slice(0, 26);
        s.push(`<g class="kgnode" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label || n.id)}"><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${colors[n.type] || "#aaa"}" opacity="0.92"></circle><text x="${(p[0] + r + 3).toFixed(1)}" y="${(p[1] + 3).toFixed(1)}">${esc(label)}</text></g>`);
      });
      s.push("</svg>");
      canvas.innerHTML = s.join("");
      const open = async id => {
        const res = await intelFetch(`/graph/node?node_id=${encodeURIComponent(id)}&limit=40`);
        if (res.error) { detail.innerHTML = intelError(res); return; }
        const n = res.node || {};
        const neighbors = (res.neighbors || []).map(x => `<div class="intelitem"><b>${esc(x.label || x.id)}</b><div class="meta"><span class="intelbadge">${esc(x.type || "")}</span><span>${esc(x.relation || "")}</span><span>${x.confidence != null ? Math.round(x.confidence * 100) + "% confidence" : ""}</span></div><div class="intelmuted" style="margin-top:4px">${esc(x.explanation || "")}</div></div>`).join("");
        detail.innerHTML = `<h3>${esc(n.label || id)}</h3><div class="meta intelmuted"><span class="intelbadge">${esc(n.type || "")}</span>${n.video_count != null ? `<span>${n.video_count} videos</span>` : ""}${n.channel_count != null ? `<span>${n.channel_count} channels</span>` : ""}</div><p class="intelmuted">${esc(n.description || "")}</p><h3 style="margin-top:14px">Connections</h3><div class="intellist">${neighbors || `<span class="intelmuted">No stored relationships.</span>`}</div>`;
      };
      canvas.onclick = e => { const g = e.target.closest("[data-node]"); if (g) open(g.dataset.node); };
      canvas.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-node]"); if (g) { e.preventDefault(); open(g.dataset.node); } } };
      $("#kgSearch").oninput = e => {
        const term = e.target.value.trim().toLowerCase();
        canvas.querySelectorAll("[data-node]").forEach(g => {
          const hit = !term || g.getAttribute("aria-label").toLowerCase().includes(term);
          g.style.opacity = hit ? "1" : "0.15";
        });
      };
    };
    $("#kgReload").onclick = load;
    $("#kgVideos").onchange = load;
    $("#kgCollections").onchange = load;
    $("#kgWatched").onchange = load;
    load();
  }

  function viewFlashcards() {
    main.innerHTML = intelShell(
      "Spaced Repetition",
      "FSRS-5 scheduling over your own cards. Auto-generated cards link to the source extract; review history is stored independently of videos.",
      `<div class="intelcard">
        <div class="intelrow"><select id="fcDeck"></select><button class="pill" id="fcLoad">Load due cards</button><input id="fcVid" type="text" placeholder="video id to generate" style="width:160px"><button class="pill" id="fcGen">Generate</button><button class="pill" id="fcNewDeck">New deck</button><button class="pill" id="fcExport">Export deck</button></div>

    );
    let decks = [], due = [], index = 0;
    const deck = $("#fcDeck"), cardBox = $("#fcCard"), statsBox = $("#fcStats");
    const loadDecks = async () => {
      const r = await intelFetch("/flashcards/decks");
      if (r.error) { cardBox.innerHTML = intelError(r); return; }
      decks = r.decks || [];
      deck.innerHTML = decks.map(d => `<option value="${esc(d.id)}">${esc(d.name)} (${d.due_now || 0} due)</option>`).join("") || `<option value="">Default deck</option>`;
      loadDue();
    };
    const loadStats = async () => {
      const r = await intelFetch("/flashcards/stats");
      if (r.error) return;
      statsBox.innerHTML = `<div class="intelcard"><h2>Review stats</h2>
        <div class="stats"><div class="stat">${r.due_now} due now</div><div class="stat">${r.total_cards} active cards</div><div class="stat">${r.reviews_window} reviews / ${r.window_days}d</div><div class="stat">retention ${r.retention_estimate == null ? "—" : Math.round(r.retention_estimate * 100) + "%"}</div></div>
        <p class="intelmuted">${esc(r.note)}</p></div>`;
    };
    const loadDue = async () => {
      const id = deck.value;
      const r = await intelFetch(`/flashcards/due?limit=40${id ? "&deck_id=" + encodeURIComponent(id) : ""}`);
      if (r.error) { cardBox.innerHTML = intelError(r); return; }
      due = r.cards || []; index = 0; renderCard(); loadStats();
    };
    const renderCard = () => {
      if (!due.length) { cardBox.innerHTML = `<div class="intelcard"><h2>All caught up</h2><p class="intelmuted">No cards are due in this deck. Generate cards from a processed video or come back later.</p></div>`; return; }
      const c = due[index % due.length];
      cardBox.innerHTML = `<div class="intelcard"><div class="intelrow" style="justify-content:space-between"><span class="intelbadge">${esc(c.card_type)}</span><span class="intelmuted">${index + 1} / ${due.length} · ${esc(c.state)}</span></div>
        <div class="fcface" id="fcFace">${esc(c.front)}</div>
        <div id="fcBack"></div>
        <div class="intelrow" style="margin-top:10px"><button class="pill primary" id="fcShow">Show answer</button><button class="pill" id="fcEdit">Edit</button><button class="pill" id="fcDelete">Delete</button></div></div>`;
      $("#fcShow").onclick = () => {
        $("#fcBack").innerHTML = `<div class="intelcard" style="margin-top:10px"><div class="intelanswer">${esc(c.back)}</div>${c.source_excerpt ? `<p class="intelmuted">Source: ${esc(c.source_excerpt)}</p>` : ""}</div><div class="fcrate">${[[1, "Again"], [2, "Hard"], [3, "Good"], [4, "Easy"]].map(([n, label]) => `<button class="pill" data-rate="${n}">${label}</button>`).join("")}</div>`;
        $("#fcBack").querySelectorAll("[data-rate]").forEach(b => b.onclick = async () => {
          const r = await intelFetch(`/flashcards/${c.id}/review`, { method: "POST", body: JSON.stringify({ rating: Number(b.dataset.rate) }) });
          if (r.error) { toast(r.error); return; }
          due = due.filter(x => x.id !== c.id); renderCard(); loadStats(); loadDecks();
        });
      };
      $("#fcEdit").onclick = async () => {
        const front = prompt("Front of the card", c.front); if (front == null) return;
        const back = prompt("Back of the card", c.back); if (back == null) return;
        const r = await intelFetch(`/flashcards/${c.id}`, { method: "PATCH", body: JSON.stringify({ front, back }) });
        if (r.error) toast(r.error); else loadDue();
      };
      $("#fcDelete").onclick = async () => {
        if (!confirm("Delete this card? It can be restored from the API.")) return;
        const r = await intelFetch(`/flashcards/${c.id}`, { method: "DELETE" });
        if (r.error) toast(r.error); else loadDue();
      };
    };
    $("#fcLoad").onclick = loadDue;
    deck.onchange = loadDue;
    $("#fcGen").onclick = async () => {
      const video_id = $("#fcVid").value.trim(); if (!video_id) return;
      const r = await intelFetch("/flashcards/generate", { method: "POST", body: JSON.stringify({ video_id, deck_id: deck.value || null }) });
      if (r.error) { toast(r.error); return; }
      toast(`Cards: ${r.created} new, ${r.skipped} already present.`); loadDecks();
    };
    $("#fcNewDeck").onclick = async () => {
      const name = prompt("Deck name"); if (!name) return;
      const r = await intelFetch("/flashcards/decks", { method: "POST", body: JSON.stringify({ name }) });
      if (r.error) toast(r.error); else loadDecks();
    };
    $("#fcExport").onclick = async () => {
      if (!deck.value) return;
      const r = await intelFetch(`/flashcards/export/${encodeURIComponent(deck.value)}`);
      if (r.error) { toast(r.error); return; }
      const blob = new Blob([JSON.stringify(r, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `mytube-deck-${deck.value}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    loadDecks();
  }

  async function viewResearch() {
    main.innerHTML = intelShell(
      "Research Lab",
      "Compare explanations across videos and keep the evidence. Directly stated material, deterministic inferences and optional local-model synthesis are labelled separately.",
      `<div class="intelsplit"><div class="intelcard"><h2>Saved documents</h2><div id="rdList" class="intellist"><span class="intelmuted">Loading…</span></div></div>
      <div><div class="intelcard"><h2>Compare videos</h2><div class="intelrow"><input id="rdIds" class="grow" type="text" placeholder="video ids, comma separated" autocomplete="off"><button class="pill primary" id="rdGo">Compare</button></div><p class="intelmuted" style="margin:8px 0 0">Select at least two videos that already have transcripts or extracted knowledge.</p><div id="rdPick" class="intelrow" style="margin-top:8px"></div></div><div id="rdOut"></div></div></div>`
    );

    const renderDoc = doc => {
      const body = doc.body || {};
      if (doc.kind === "answer") {
        out.innerHTML = `<div class="intelcard"><h2>${esc(body.question || doc.title)}</h2><div class="intelanswer">${esc(body.answer || "")}</div>${(body.citations || []).map(c => `<div class="intelcite"><b>[${c.index}]</b> ${intelVideo(c.video_id, c.title)}<q>${esc(c.excerpt || "")}</q></div>`).join("")}</div>`;
        return;
      }
      const section = (key, label) => {
        const value = body[key];
        if (!value || (Array.isArray(value) && !value.length)) return "";
        return `<div class="intelcard"><h2>${esc(label)}</h2>${Array.isArray(value) ? value.map(v => `<div class="intelitem"><div>${esc(typeof v === "string" ? v : v.concept || v.text || v.summary || JSON.stringify(v))}</div>${v.claim_type ? `<div class="meta"><span class="intelbadge">${esc(v.claim_type)}</span>${v.rule ? `<span>${esc(v.rule)}</span>` : ""}</div>` : ""}${v.evidence ? `<div class="intelcite"><b>${intelVideo(v.evidence.video_id, v.evidence.title)}</b><q>${esc(v.evidence.excerpt || v.evidence.note || "")}</q></div>` : ""}</div>`).join("") : `<p class="intelanswer">${esc(String(value))}</p>`}</div>`;
      };
      out.innerHTML = `<div class="intelcard"><h2>${esc(doc.title)}</h2><p class="intelmuted">Saved comparison. Claim types: ${Object.entries(body.claim_types || {}).map(([k, v]) => `<b>${esc(k)}</b> — ${esc(v)}`).join(" · ")}</p></div>` +
        section("common_explanations", "Common explanations") + section("agreements", "Agreements") +
        section("possible_contradictions", "Possible contradictions (heuristic)") + section("unique_concepts", "Unique concepts") +
        section("different_approaches", "Different technical approaches") + section("missing_explanations", "Missing explanations") +
        section("complementary_videos", "Complementary videos");
    };
    const loadDocs = async () => {
      const r = await intelFetch("/research/documents?limit=40");
      if (r.error) { $("#rdList").innerHTML = intelError(r); return; }
      const rows = (r.documents || []).map(d => `<div class="intelitem" data-doc="${esc(d.id)}"><b>${esc(d.title)}</b><div class="meta"><span class="intelbadge">${esc(d.kind)}</span></div></div>`).join("");
      $("#rdList").innerHTML = rows || `<span class="intelmuted">Nothing saved yet.</span>`;
      $("#rdList").querySelectorAll("[data-doc]").forEach(el => el.onclick = async () => {
        const d = await intelFetch(`/research/documents/${encodeURIComponent(el.dataset.doc)}`);
        if (d.error) toast(d.error); else renderDoc(d);
      });
    };
    const pick = async () => {
      const g = await intelFetch("/graph?limit=200");
      if (g.error) return;
      const vids = (g.nodes || []).filter(n => n.type === "video");
      $("#rdPick").innerHTML = vids.slice(0, 18).map(v => `<label class="intelbadge" style="cursor:pointer"><input type="checkbox" value="${esc(v.id.replace(/^video:/, ""))}"> ${esc(String(v.label).slice(0, 34))}</label>`).join("") || `<span class="intelmuted">No processed videos yet.</span>`;
    };
    $("#rdGo").onclick = async () => {
      const picked = [...$("#rdPick").querySelectorAll("input:checked")].map(x => x.value);
      const typed = $("#rdIds").value.split(/[\s,]+/).filter(Boolean);
      const ids = [...new Set([...picked, ...typed])];
      if (ids.length < 2) { toast("Select or type at least two video ids."); return; }
      out.innerHTML = `<div class="intelcard intelmuted">Comparing stored evidence…</div>`;
      const r = await intelFetch("/research/compare", { method: "POST", body: JSON.stringify({ video_ids: ids }) });
      if (r.error) { out.innerHTML = intelError(r); return; }
      renderDoc({ kind: "comparison", title: r.title || "Comparison", body: r }); loadDocs();
    };
    loadDocs(); pick();
  }

      out.innerHTML = `<div class="intelcard"><div class="intelrow" style="justify-content:space-between"><h2 style="margin:0">${esc(report.period)} report</h2><span class="intelmuted">${new Date(report.generated_at).toLocaleString()}</span></div><p class="intelmuted">Window: ${report.window.days || ""} days · ${(report.events || []).length} events</p><div class="intellist">${events || `<p class="intelmuted">No opportunities matched the current window.</p>`}</div></div>`;
      out.querySelectorAll("[data-event]").forEach(row => row.querySelectorAll("[data-ev-status]").forEach(b => b.onclick = async () => {

        if (r.error) toast(r.error); else load();
      }));
    };
    const load = async () => {
      const cfg = await intelFetch("/radar/config");

      if (rep.error) { out.innerHTML = intelError(rep); return; }

    $("#radSave").onclick = async () => {
      const r = await intelFetch("/radar/config", { method: "PUT", body: JSON.stringify({ enabled: $("#radEnabled").checked, paused: $("#radPaused").checked, schedule: $("#radSchedule").value, window_days: Number($("#radWindow").value) || 30 }) });
      if (r.error) toast(r.error); else { toast("Radar settings saved."); load(); }
    };
    $("#radScan").onclick = async () => {
      out.innerHTML = `<div class="intelcard intelmuted">Scanning your subscription library…</div>`;
      const r = await intelFetch("/radar/scan", { method: "POST", body: JSON.stringify({ period: "manual" }) });
      if (r.error) { out.innerHTML = intelError(r); return; }
      if (r.enabled === false || r.paused) { toast(r.reason || "Discovery is off."); load(); return; }
      renderReport(r);
    };
    load();
  }

        <div class="intelcard"><h2>Activity</h2><div class="bars">${bars}</div><p class="intelmuted">${esc(metric)} per ${esc(data.period)}. Empty buckets are real zeros.</p></div>
        <div class="intelgrid"><div class="intelcard"><h2>Top subjects</h2>${topics || `<p class="intelmuted">No topic evidence yet.</p>`}</div><div class="intelcard"><h2>Interest shifts</h2><h3>Emerging</h3><ul class="intelmuted">${emerging || "<li>None</li>"}</ul><h3>Declining</h3><ul class="intelmuted">${declining || "<li>None</li>"}</ul></div></div>
        <div class="intelcard"><h2>Topic transitions</h2><ul class="intelmuted">${transitions || "<li>No dominant-topic change in this window.</li>"}</ul><p class="intelmuted">${Object.entries(data.metric_definitions || {}).map(([k, v]) => `<b>${esc(k)}</b>: ${esc(String(v))}`).join(" · ")}</p></div>`;
    };
    const load = async () => {
      out.innerHTML = `<div class="intelcard intelmuted">Loading timeline…</div>`;
      const r = await intelFetch(`/analytics/timeline?period=${$("#tlPeriod").value}&buckets=12`);
      if (r.error) { out.innerHTML = intelError(r); return; } render(r);
    };
    $("#tlGo").onclick = load; $("#tlPeriod").onchange = load; $("#tlMetric").onchange = load;
    load();
  }

  function viewIntelSettings() {
    main.innerHTML = intelShell(
      "Intelligence Settings",
      "Everything runs locally and is optional. No model is downloaded here. The backend reports what is actually reachable; unavailable features degrade to FTS, TF-IDF and deterministic extraction.",
      `<div class="intelgrid"><div id="aiStatus"></div><div id="aiCfg"></div></div><div id="pipeCfg"></div>`
    );
    const status = $("#aiStatus"), cfg = $("#aiCfg"), pipe = $("#pipeCfg");
    const load = async () => {
      const s = await intelFetch("/ai/status");
      if (s.error) { status.innerHTML = intelError(s); return; }
      status.innerHTML = `<div class="intelcard"><h2>Local status</h2>
        <div class="intelitem"><b>LLM</b><div class="intelmuted">provider: ${esc(s.llm.provider)} · model: ${esc(s.llm.model || "—")} · ${s.llm.available ? `<span class="intelbadge ok">available</span>` : `<span class="intelbadge warn">${esc(s.llm.error || "unavailable")}</span>`}</div></div>
        <div class="intelitem" style="margin-top:8px"><b>Embeddings</b><div class="intelmuted">${esc(s.embedding.model_id)} · ${s.embedding.dim} dims · ${s.embedding.available ? `<span class="intelbadge ok">local</span>` : `<span class="intelbadge bad">unavailable</span>`}</div></div>
        <div class="intelitem" style="margin-top:8px"><b>Transcription</b><div class="intelmuted">${s.transcription.available ? `<span class="intelbadge ok">available</span>` : `<span class="intelbadge warn">not installed</span>`} — ${esc(s.transcription.note)}</div></div>
        <p class="intelmuted" style="margin-top:10px">local only: ${s.policy.local_only} · cloud required: ${s.policy.requires_cloud} · downloads models: ${s.policy.downloads_models} · works without AI: ${s.policy.works_without_ai}</p>
        <button class="pill" id="aiTest">Test local model</button></div>`;
      $("#aiTest").onclick = async () => {
        const r = await intelFetch("/ai/test", { method: "POST" });
        if (r.error) toast(r.error); else toast(`Model replied: ${String(r.response || "").slice(0, 80)}`);
      };
      const c = s.selected_config || { provider: "ollama", model: "llama3.2:3b", endpoint: "", enabled: false };
      cfg.innerHTML = `<div class="intelcard"><h2>Model selection</h2><div class="intelrow"><label class="intelmuted"><input id="aiOn" type="checkbox" ${c.enabled ? "checked" : ""}> enable local LLM</label><select id="aiProv"><option value="ollama" ${c.provider === "ollama" ? "selected" : ""}>Ollama</option><option value="llamacpp" ${c.provider === "llamacpp" ? "selected" : ""}>llama.cpp</option><option value="none" ${c.provider === "none" ? "selected" : ""}>none</option></select></div><div class="intelrow" style="margin-top:8px"><input id="aiModel" class="grow" type="text" value="${esc(c.model || "")}" placeholder="model name"></div><div class="intelrow" style="margin-top:8px"><input id="aiEndpoint" class="grow" type="text" value="${esc(c.endpoint || "")}" placeholder="loopback endpoint (optional)"></div><div class="intelrow" style="margin-top:10px"><button class="pill primary" id="aiSave">Save selection</button></div><p class="intelmuted">Saving does not install, download or call a remote service. Non-loopback endpoints require the backend's explicit remote-AI opt-in.</p></div>`;
      $("#aiSave").onclick = async () => {
        const r = await intelFetch("/ai/config", { method: "PUT", body: JSON.stringify({ enabled: $("#aiOn").checked, provider: $("#aiProv").value, model: $("#aiModel").value.trim() || "none", endpoint: $("#aiEndpoint").value.trim() || null }) });
        if (r.error) toast(r.error); else { toast("AI selection saved."); load(); }
      };
      const p = await intelFetch("/pipeline/config");
      if (p.error) { pipe.innerHTML = intelError(p); return; }
      const pc = p.config || {};
      const step = (k, label) => `<label class="intelbadge" style="cursor:pointer"><input type="checkbox" value="${k}" ${(pc.steps || []).includes(k) ? "checked" : ""}> ${label}</label>`;
      pipe.innerHTML = `<div class="intelcard"><h2>Processing pipeline</h2><div class="intelrow">${step("transcript", "transcript")}${step("extract", "extract")}${step("embed", "embed")}${step("chapters", "chapters")}${step("cards", "cards")}</div><div class="intelrow" style="margin-top:8px"><label class="intelmuted"><input id="pipeAuto" type="checkbox" ${pc.auto_process_new ? "checked" : ""}> auto-process new videos</label><label class="intelmuted"><input id="pipeLlm" type="checkbox" ${pc.allow_llm ? "checked" : ""}> allow local LLM</label><input id="pipeMax" type="number" min="1" max="500" value="${pc.max_videos_per_run || 50}" style="width:90px"> max/run</div><div class="intelrow" style="margin-top:10px"><button class="pill primary" id="pipeSave">Save pipeline</button></div><p class="intelmuted">Processing is incremental, cancellable and never blocks the library UI. Fetching captions or audio remains an explicit, separate action.</p><div class="intelrow" style="margin-top:10px"><input id="pipeIds" class="grow" type="text" placeholder="video ids to process now, comma separated"><button class="pill" id="pipeRun">Run now</button></div><div id="pipeOut" class="intelmuted" style="margin-top:8px"></div></div>`;
      $("#pipeSave").onclick = async () => {
        const steps = [...pipe.querySelectorAll("input[type=checkbox][value]")].filter(x => x.checked && ["transcript", "extract", "embed", "chapters", "cards"].includes(x.value)).map(x => x.value);
        const r = await intelFetch("/pipeline/config", { method: "PUT", body: JSON.stringify({ steps, auto_process_new: $("#pipeAuto").checked, allow_llm: $("#pipeLlm").checked, max_videos_per_run: Number($("#pipeMax").value) || 50 }) });
        if (r.error) toast(r.error); else toast("Pipeline settings saved.");
      };
      $("#pipeRun").onclick = async () => {
        const ids = $("#pipeIds").value.split(/[\s,]+/).filter(Boolean);
        if (!ids.length) { toast("Enter at least one video id."); return; }
        const steps = [...pipe.querySelectorAll("input[type=checkbox][value]")].filter(x => x.checked && ["transcript", "extract", "embed", "chapters", "cards"].includes(x.value)).map(x => x.value);
        $("#pipeOut").textContent = "Running local pipeline…";
        const r = await intelFetch("/pipeline/run", { method: "POST", body: JSON.stringify({ video_ids: ids, steps: steps.length ? steps : ["extract"], run_now: true }) });
        $("#pipeOut").textContent = r.error ? r.error : `Processed ${r.result.videos} video(s); errors: ${r.result.results.flatMap(x => x.errors).length}.`;
      };
    };
    load();
  }

  /* ---------- router ---------- */
  function route() {
    cleanup(); cleanup = () => {};
    const h = location.hash.replace(/^#\/?/, "");
    const m = {};
    if (!h.startsWith("search/")) $("#q").value = "";
    $("#aboutBtn").classList.toggle("active", h === "about");
    if ((m.watch = h.match(/^watch\/([\w-]{11})$/))) { markSide(""); viewWatch(m.watch[1]); }
    else if ((m.ch = h.match(/^c\/(\d+)$/))) { markSide(`c/${m.ch[1]}`); viewChannel(+m.ch[1]); }
    else if ((m.search = h.match(/^search\/(.*)$/))) { markSide(""); viewSearch(decodeURIComponent(m.search[1])); }
    else if ((m.cat = h.match(/^t\/([\w-]+)$/))) { markSide(`t/${m.cat[1]}`); viewCat(m.cat[1]); }
    else if ((m.course = h.match(/^course\/([\w-]+)$/))) { markSide(`course/${m.course[1]}`); viewCourse(m.course[1]); }
    else if (h === "ask") { markSide("ask"); viewAsk(); }
    else if (h === "graph") { markSide("graph"); viewGraph(); }
    else if (h === "vault") { markSide("vault"); viewVault(); }
    else if (h === "paths") { markSide("paths"); viewPaths(); }
    else if (h === "flashcards") { markSide("flashcards"); viewFlashcards(); }
    else if (h === "research") { markSide("research"); viewResearch(); }
    else if (h === "radar") { markSide("radar"); viewRadar(); }
    else if (h === "analytics") { markSide("analytics"); viewAnalytics(); }
    else if (h === "intel-settings") { markSide("intel-settings"); viewIntelSettings(); }
    else if (h === "about") { markSide("about"); viewAbout(); }
    else { markSide("home"); viewHome(); }
    renderCategories(); // refresh the chip badges after history changes
  }

  /* ---------- boot ---------- */
  function boot() {
    if (!data || !Array.isArray(data.videos) || !data.videos.length) {
      main.innerHTML = `<div class="empty">No video data yet. Run <code>python3 build.py</code> to generate <code>site/data.js</code>.</div>`;
      return;
    }
    CH = data.channels.map((c, i) => ({ ...c, i }));
    byChannel = CH.map(() => []);
    V = data.videos.map(([id, title, dur, views, ch], ix) => ({ id, title, dur, views, ch, ix }));
    for (const v of V) { (byChannel[v.ch] || (byChannel[v.ch] = [])).push(v); byId.set(v.id, v); }
    $("#q").placeholder = `Search ${fmtNum(V.length)} videos`;
    renderSide();
    window.addEventListener("hashchange", route);
    route();
  }
  boot();

  /* ---------- chrome ---------- */
  $("#searchForm").onsubmit = e => {
    e.preventDefault();
    const q = $("#q").value.trim();
    location.hash = q ? `#/search/${encodeURIComponent(q)}` : "#/";
  };
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const isLight = root.dataset.theme ? root.dataset.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = isLight ? "dark" : "light";
    try { localStorage.setItem("jeetube-theme", root.dataset.theme); } catch {}
  };
  $("#luckyBtn").onclick = () => {
    if (!V.length) return;
    location.hash = `#/watch/${V[Math.random() * V.length | 0].id}`;
  };
  $("#cmSave").onclick = saveCourseFromModal;
  $("#cmCancel").onclick = closeCourseModal;
  $("#courseModal").addEventListener("click", e => { if (e.target.id === "courseModal") closeCourseModal(); });
  $("#recoDone").onclick = closeReco;
  $("#recoDefaults").onclick = () => {
    reco = Object.assign({}, RECO_DEFAULTS);
    saveReco(); renderRecoBody(); scheduleRerank();
    toast("Ranking back to its defaults.");
  };
  $("#recoModal").addEventListener("click", e => { if (e.target.id === "recoModal") closeReco(); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (picker) closeCourseModal();
    else if (!$("#recoModal").hidden) closeReco();
  });
  // Channel links inside cards (anchors can't nest, so these are spans). The hide and
  // course controls are handled first so they never navigate.
  document.addEventListener("click", e => {
    const notint = e.target.closest("[data-notint]");
    if (notint) {
      e.preventDefault(); e.stopPropagation();
      const v = byId.get(notint.dataset.notint);
      if (v) {
        markNotInterested(v);
        const wrap = notint.closest(".cardwrap");
        if (wrap) wrap.remove(); else route();
      }
      return;
    }
    const hideV = e.target.closest("[data-hidevid]");
    if (hideV) {
      e.preventDefault(); e.stopPropagation();
      const v = byId.get(hideV.dataset.hidevid);
      if (v) hideVideo(v, hideV);
      return;
    }
    const hideCat = e.target.closest("[data-hidecat]");
    if (hideCat) {
      e.preventDefault(); e.stopPropagation();
      toggleCategory(hideCat.dataset.hidecat);
      return;
    }
    const hideC = e.target.closest("[data-hidech]");
    if (hideC) {
      e.preventDefault(); e.stopPropagation();
      toggleChannel(+hideC.dataset.hidech);
      return;
    }
    const add = e.target.closest("[data-course]");
    if (add) {
      e.preventDefault(); e.stopPropagation();
      openCourseModal(null, { channel: +add.dataset.course, video: add.dataset.video });
      return;
    }
    const t = e.target.closest("[data-href]");
    if (t) { e.preventDefault(); e.stopPropagation(); location.hash = t.dataset.href; return; }
    // Click feedback for the shelf bandit: which row earned the click?
    const shelf = e.target.closest("[data-shelf]");
    if (shelf && e.target.closest("a[data-vid]")) shelfClick(shelf.dataset.shelf);
  }, true);

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) return;
    const cm = location.hash.match(/^#\/c\/(\d+)$/);
    if (cm && /^[1-5]$/.test(e.key)) { const c = CH[+cm[1]]; if (c) setRating(c, +e.key); return; }
    if (e.key === "N" && e.shiftKey) {
      e.preventDefault();
      if (location.hash.startsWith("#/watch/")) playNext();
      else if (V.length) location.hash = `#/watch/${V[Math.random() * V.length | 0].id}`;
    }
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  });
  window.addEventListener("scroll", () => {
    $("#hdr").classList.toggle("scrolled", window.scrollY > 2);
  }, { passive: true });
})();
</script>
</body>
</html>
